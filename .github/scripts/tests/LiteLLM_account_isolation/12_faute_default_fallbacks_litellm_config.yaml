---
# "default_fallbacks" s'applique a tous les groupes a la fois : il traverse toutes les frontieres
# d'un seul coup, y compris celles qui n'existent pas encore.
model_list:
  - model_name: gen-chat-dragnix
    litellm_params:
      model: fournisseur/identifiant
      api_key: os.environ/GEMINI_API_KEY_DRAGNIX

  - model_name: gen-chat-tigerblue77
    litellm_params:
      model: fournisseur/identifiant
      api_key: os.environ/GEMINI_API_KEY_TIGERBLUE77

router_settings:
  default_fallbacks: ["gen-chat-tigerblue77"]
