# EXPECTED: 1 CONTAINS: fall back on
---
# The SAME cross-account fallback as fixture 10, written in BLOCK style. The first version of the
# check, which read lines, did not see it: its regex demanded brackets. Yet that is the form every
# YAML serialiser produces, so Ansible's "to_nice_yaml" filter, and it is the repository's majority
# style. This fixture exists so that this hole never reopens.
model_list:
  - model_name: gen-chat-dragnix
    litellm_params:
      model: provider/identifier
      api_key: os.environ/GEMINI_API_KEY_DRAGNIX

  - model_name: gen-chat-tigerblue77
    litellm_params:
      model: provider/identifier
      api_key: os.environ/GEMINI_API_KEY_TIGERBLUE77

router_settings:
  fallbacks:
    - gen-chat-dragnix:
        - gen-chat-tigerblue77
