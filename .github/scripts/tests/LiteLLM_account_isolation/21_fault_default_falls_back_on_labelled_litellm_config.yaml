# EXPECTED: 1 CONTAINS: fall back on
---
# A fallback from the default account's model onto another account's: the boundary is the same
# whether or not the key carries a suffix.
model_list:
  - model_name: gen-chat
    litellm_params:
      model: provider/identifier
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gen-chat-team-a
    litellm_params:
      model: provider/identifier
      api_key: os.environ/GEMINI_API_KEY_TEAM_A

router_settings:
  fallbacks:
    - gen-chat: ["gen-chat-team-a"]
