# EXPECTED: 1 CONTAINS: litellm_settings
---
# The fallback keys are declared under "router_settings" just as readily as under
# "litellm_settings". Watching only the first would leave a door wide open, in the very section
# where LiteLLM's documentation places several of its examples.
model_list:
  - model_name: gen-chat-team-a
    litellm_params:
      model: provider/identifier
      api_key: os.environ/GEMINI_API_KEY_TEAM_A

  - model_name: gen-chat-team-b
    litellm_params:
      model: provider/identifier
      api_key: os.environ/GEMINI_API_KEY_TEAM_B

litellm_settings:
  context_window_fallbacks:
    - gen-chat-team-a: ["gen-chat-team-b"]
