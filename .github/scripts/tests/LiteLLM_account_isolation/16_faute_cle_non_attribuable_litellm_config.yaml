---
# Une cle que le controle ne sait pas rattacher a un compte doit etre SIGNALEE, pas ignoree :
# une entree non rattachee est exactement une entree sur laquelle aucune des regles ne protege.
# Ici, une cle hors convention de nommage et une entree sans "api_key" du tout.
model_list:
  - model_name: gen-chat-dragnix
    litellm_params:
      model: fournisseur/identifiant
      api_key: os.environ/UNE_CLE_SANS_CONVENTION

  - model_name: gen-chat-tigerblue77
    litellm_params:
      model: fournisseur/identifiant
