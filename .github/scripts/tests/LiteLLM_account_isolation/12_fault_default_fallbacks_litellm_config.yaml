# EXPECTED: 1 CONTAINS: ALL the model groups
---
# "default_fallbacks" applies to every group at once: it crosses every boundary in a single go,
# including the ones that do not exist yet.
model_list:
  - model_name: gen-chat-team-a
    litellm_params:
      model: provider/identifier
      api_key: os.environ/GEMINI_API_KEY_TEAM_A

  - model_name: gen-chat-team-b
    litellm_params:
      model: provider/identifier
      api_key: os.environ/GEMINI_API_KEY_TEAM_B

router_settings:
  default_fallbacks: ["gen-chat-team-b"]
