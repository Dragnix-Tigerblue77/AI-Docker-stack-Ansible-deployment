# EXPECTED: 1 CONTAINS: declared more than once
---
# LiteLLM keeps the first of two credentials of one name. The second, which a reader may take for the one in
# use, reads another account's key.
credential_list:
  - credential_name: gemini
    credential_info: {}
    credential_values:
      api_key: os.environ/GEMINI_API_KEY
  - credential_name: gemini
    credential_info: {}
    credential_values:
      api_key: os.environ/GEMINI_API_KEY_TEAM_A

model_list:
  - model_name: gen-chat
    litellm_params:
      model: provider/identifier
      litellm_credential_name: gemini
