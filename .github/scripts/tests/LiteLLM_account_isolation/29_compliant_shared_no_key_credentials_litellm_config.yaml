# EXPECTED: 0
---
# A keyless gateway's entry keeps its literal marker beside entries that read their keys through credentials: the
# marker is no secret and no credential, and the entry stays shared, as in the fixture of its own.
credential_list:
  - credential_name: gemini-team-a
    credential_info: {}
    credential_values:
      api_key: os.environ/GEMINI_API_KEY_TEAM_A
  - credential_name: gemini-team-b
    credential_info: {}
    credential_values:
      api_key: os.environ/GEMINI_API_KEY_TEAM_B

model_list:
  - model_name: gen-chat-team-a
    litellm_params:
      model: provider/identifier
      litellm_credential_name: gemini-team-a

  - model_name: gen-chat-team-b
    litellm_params:
      model: provider/identifier
      litellm_credential_name: gemini-team-b

  - model_name: omniroute-free-auto
    litellm_params:
      model: provider/identifier
      api_key: "omniroute-no-key-needed"

router_settings:
  fallbacks:
    - gen-chat-team-a: ["omniroute-free-auto"]
    - gen-chat-team-b: ["omniroute-free-auto"]
