# EXPECTED: 1 CONTAINS: no identifiable account
---
# A credential whose key is not read as "<PROVIDER>_API_KEY[_<ACCOUNT>]": the entry that names it cannot be
# attributed, and is reported, as an entry whose own key does not follow the convention is.
credential_list:
  - credential_name: gemini
    credential_info: {}
    credential_values:
      api_key: os.environ/GOOGLE_KEY

model_list:
  - model_name: gen-chat
    litellm_params:
      model: provider/identifier
      litellm_credential_name: gemini
