# EXPECTED: 0
---
# What the role deploys: the key is a named credential, which the entries name. The default account's
# credential and a labelled account's are two credentials, each read by the entries of its own account, and
# the cascade stays inside one account's keys, so nothing is reported.
credential_list:
  - credential_name: gemini
    credential_info: {}
    credential_values:
      api_key: os.environ/GEMINI_API_KEY
  - credential_name: groq
    credential_info: {}
    credential_values:
      api_key: os.environ/GROQ_API_KEY
  - credential_name: groq-team-a
    credential_info: {}
    credential_values:
      api_key: os.environ/GROQ_API_KEY_TEAM_A

model_list:
  - model_name: gen-chat
    litellm_params:
      model: provider/identifier
      litellm_credential_name: gemini

  - model_name: gen-code
    litellm_params:
      model: provider/identifier
      litellm_credential_name: groq

  - model_name: gen-code-team-a
    litellm_params:
      model: provider/identifier
      litellm_credential_name: groq-team-a

router_settings:
  fallbacks:
    - gen-chat: ["gen-code"]
