# EXPECTED: 1 CONTAINS: fall back on
---
# The visible vector: a fallback that names a model belonging to the other person.
model_list:
  - model_name: gen-chat-team-a
    litellm_params:
      model: provider/identifier
      api_key: os.environ/GEMINI_API_KEY_TEAM_A

  - model_name: gen-chat-team-b
    litellm_params:
      model: provider/identifier
      api_key: os.environ/GEMINI_API_KEY_TEAM_B

router_settings:
  fallbacks:
    - gen-chat-team-a: ["gen-chat-team-b"]
