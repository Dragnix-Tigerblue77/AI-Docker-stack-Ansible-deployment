---
# Le MEME repli inter-comptes que la fixture 10, ecrit en style BLOC. La premiere version du
# controle, qui lisait des lignes, ne le voyait pas : sa regex exigeait des crochets. Or c'est la
# forme que produit tout serialiseur YAML, donc le filtre "to_nice_yaml" d'Ansible, et c'est le
# style majoritaire du depot. Cette fixture existe pour que ce trou ne se rouvre jamais.
model_list:
  - model_name: gen-chat-dragnix
    litellm_params:
      model: fournisseur/identifiant
      api_key: os.environ/GEMINI_API_KEY_DRAGNIX

  - model_name: gen-chat-tigerblue77
    litellm_params:
      model: fournisseur/identifiant
      api_key: os.environ/GEMINI_API_KEY_TIGERBLUE77

router_settings:
  fallbacks:
    - gen-chat-dragnix:
        - gen-chat-tigerblue77
