# EXPECTED: 1 CONTAINS: groups deployments
---
# The invisible vector of the fixtures above, now behind credentials: two entries under one model_name whose
# credentials read the keys of two accounts. No api_key is written on either entry, and the Router still
# treats them as one group and spreads the load, then relays a 429 from one account to the other.
credential_list:
  - credential_name: gemini
    credential_info: {}
    credential_values:
      api_key: os.environ/GEMINI_API_KEY
  - credential_name: gemini-team-a
    credential_info: {}
    credential_values:
      api_key: os.environ/GEMINI_API_KEY_TEAM_A

model_list:
  - model_name: gen-chat
    litellm_params:
      model: provider/identifier
      litellm_credential_name: gemini

  - model_name: gen-chat
    litellm_params:
      model: provider/identifier
      litellm_credential_name: gemini-team-a
