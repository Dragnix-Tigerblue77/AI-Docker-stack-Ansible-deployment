# EXPECTED: 1 CONTAINS: carries both the credential
---
# An entry names the default account's credential and carries a key of its own, which LiteLLM sends: the
# credential a reader sees is not the account that pays. The attribution follows the key sent, so the one
# problem is the doubled source, and not a second one about the account.
credential_list:
  - credential_name: gemini
    credential_info: {}
    credential_values:
      api_key: os.environ/GEMINI_API_KEY

model_list:
  - model_name: gen-chat
    litellm_params:
      model: provider/identifier
      litellm_credential_name: gemini
      api_key: os.environ/GEMINI_API_KEY_TEAM_A
