# EXPECTED: 0
---
# The correct form: each model_name belongs to one account only, and the single fallback stays
# inside the keys of one single person.
model_list:
  - model_name: gen-chat-alpha
    litellm_params:
      model: provider/identifier
      api_key: os.environ/GEMINI_API_KEY_ALPHA
    model_info:
      access_groups: ["alpha"]

  - model_name: gen-code-alpha
    litellm_params:
      model: provider/identifier
      api_key: os.environ/GROQ_API_KEY_ALPHA
    model_info:
      access_groups: ["alpha"]

  - model_name: gen-chat-beta
    litellm_params:
      model: provider/identifier
      api_key: os.environ/GEMINI_API_KEY_BETA
    model_info:
      access_groups: ["beta"]

router_settings:
  fallbacks:
    - gen-chat-alpha: ["gen-code-alpha"]
