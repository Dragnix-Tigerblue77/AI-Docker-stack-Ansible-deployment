---
# The correct form: each model_name belongs to one account only, and the single fallback stays
# inside the keys of one single person.
model_list:
  - model_name: gen-chat-dragnix
    litellm_params:
      model: provider/identifier
      api_key: os.environ/GEMINI_API_KEY_DRAGNIX
    model_info:
      access_groups: ["dragnix"]

  - model_name: gen-code-dragnix
    litellm_params:
      model: provider/identifier
      api_key: os.environ/GROQ_API_KEY_DRAGNIX
    model_info:
      access_groups: ["dragnix"]

  - model_name: gen-chat-tigerblue77
    litellm_params:
      model: provider/identifier
      api_key: os.environ/GEMINI_API_KEY_TIGERBLUE77
    model_info:
      access_groups: ["tigerblue77"]

router_settings:
  fallbacks:
    - gen-chat-dragnix: ["gen-code-dragnix"]
