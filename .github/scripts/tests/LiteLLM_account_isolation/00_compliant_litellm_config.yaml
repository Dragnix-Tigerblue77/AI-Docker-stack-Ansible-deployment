# EXPECTED: 0
---
# The correct form: each model_name belongs to one account only, and the single fallback stays
# inside the keys of one single person.
model_list:
  - model_name: gen-chat-team-a
    litellm_params:
      model: provider/identifier
      api_key: os.environ/GEMINI_API_KEY_TEAM_A
    model_info:
      access_groups: ["team-a"]

  - model_name: gen-code-team-a
    litellm_params:
      model: provider/identifier
      api_key: os.environ/GROQ_API_KEY_TEAM_A
    model_info:
      access_groups: ["team-a"]

  - model_name: gen-chat-team-b
    litellm_params:
      model: provider/identifier
      api_key: os.environ/GEMINI_API_KEY_TEAM_B
    model_info:
      access_groups: ["team-b"]

router_settings:
  fallbacks:
    - gen-chat-team-a: ["gen-code-team-a"]
