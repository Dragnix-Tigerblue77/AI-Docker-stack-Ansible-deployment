# EXPECTED: 1 CONTAINS: is not declared in the credential_list
---
# An entry names a credential nobody declares: a typo, or a credential removed while an entry still reads it.
# LiteLLM starts anyway and sends the request with no key of its own, falling back on the one its provider
# reads from the environment, which for Gemini is the default account's. An entry meant for another account
# would spend the default one's quota, with nothing failing.
credential_list:
  - credential_name: gemini-team-a
    credential_info: {}
    credential_values:
      api_key: os.environ/GEMINI_API_KEY_TEAM_A

model_list:
  - model_name: gen-chat-team-a
    litellm_params:
      model: provider/identifier
      litellm_credential_name: gemini-team-b
