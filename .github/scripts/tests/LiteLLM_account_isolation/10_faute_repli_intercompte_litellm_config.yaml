# Le vecteur visible : un repli qui cite un modele de l'autre personne.
model_list:
  - model_name: gen-chat-dragnix
    litellm_params:
      model: fournisseur/identifiant
      api_key: os.environ/GEMINI_API_KEY_DRAGNIX

  - model_name: gen-chat-tigerblue77
    litellm_params:
      model: fournisseur/identifiant
      api_key: os.environ/GEMINI_API_KEY_TIGERBLUE77

router_settings:
  fallbacks:
    - gen-chat-dragnix: ["gen-chat-tigerblue77"]
