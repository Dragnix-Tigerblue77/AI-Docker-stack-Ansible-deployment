---
name: Ansible CI

# The quality checks, on every pull request. Secret detection lives in its own workflow
# ("gitleaks.yml") because it has neither the same tooling nor the same reason to exist.
#
# ! None of these jobs can be made REQUIRED before a human merges: the organisation is on a plan
#   that allows neither a ruleset nor a branch protection on a private repository
#   ("GET /repos/.../rulesets" answers 403 "Upgrade to GitHub Pro or make this repository
#   public"). For a human's merge they inform the reviewer; they do not guard the door. That is a
#   limit of the plan, not of the configuration.
#
#   Two kinds of pull request are the exception, and the one place these jobs do gate something:
#   Dependabot's updates and the weekly model-deletion pull request of "LiteLLM_model_drift.yml".
#   "dependabot-auto-merge.yml" merges one only once every job named in
#   ".github/rulesets/main.json" has succeeded on it (bar "sign-off" for the second, which never
#   starts for it) -- every job of this workflow, of
#   "gitleaks.yml" and of "sign-off.yml", by its display "name:". Renaming a job, or adding one,
#   means editing that file in the same pull request; "check_required_checks.py" below fails until
#   it is done. The workflow's own "name:" above is what "dependabot-auto-merge.yml" listens for, so
#   it is load-bearing too. So is every job's "name:" being a plain string, never rendered from a
#   matrix: the two "role run" jobs below say why.
#
# Every job below takes its runner from the CI_RUNNER repository variable, and falls back to
# "ubuntu-latest" when it is unset. It is the whole of the switch to a self-hosted pool on the day
# the organisation's included minutes run out (#162). #32 and #141 had left it out as an indirection
# no variable would ever fill in; that reason went the day the switch was planned. The pool it would
# name is prepared, switched off, outside this repository.
#
# ! Set CI_RUNNER to "self-hosted" only on the day the included minutes run out, and only once a
#   pool serves the organisation and its runners show "Idle" under the organisation's Settings ->
#   Actions -> Runners. A label no runner answers to does not fail: the job queues for 24 hours
#   and is then cancelled, with no error anywhere.
#
# The "|| 'ubuntu-latest'" is what stops an unset variable from leaving "runs-on" empty. It leans
# on "||" returning its first truthy operand rather than a boolean, which every workflow relies
# on but GitHub's operators table does not state -- it says only "Or" -- and it leans on it just
# the same once CI_RUNNER is set, since the expression is the same in both states.
#
# Repository scope only. "runs-on" is resolved before the job starts, so an environment variable is
# never read there, and GitHub Free exposes no organisation variable to a private repository.

on:
  push:
    branches: [main]
  pull_request:
  # How "dependabot-auto-merge.yml" runs this workflow on main once it has merged an update: that
  # merge is a push made with GITHUB_TOKEN, which starts no "push" run, so its merge commit would
  # otherwise be the one head of main nothing checks (#180). GitHub refuses a dispatch to a workflow
  # without this trigger, which is why "check_required_checks.py" refuses its removal. It also lets
  # anyone with write access run these checks by hand, on any branch, from the Actions tab -- on a
  # Dependabot branch, that run counts for the merge gate as the pull request's own does: same
  # jobs, same head commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yamllint:
    name: yamllint
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Check the repository out
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # Next to nothing on GitHub's hosted runners, and needed on a self-hosted pool CI_RUNNER
          # can name: a self-hosted runner can keep its tool cache between jobs, and left at its
          # "false" default setup-python looks in that cache FIRST and only asks the versions
          # manifest when it misses -- so the first 3.12 patch the cache ever holds
          # would be the one every later job gets, for ever. "true" resolves the newest patch from
          # the manifest before looking in the cache: one small HTTPS GET per job, and one download
          # on the day the patch changes.
          check-latest: true
          cache: "pip"

      - name: Install the tooling
        run: pip install -r requirements.txt

      - name: Run yamllint
        run: yamllint .

  reuse:
    name: REUSE compliance
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # 15 and not 5, for the self-hosted pool CI_RUNNER can name: on such a pool, setting the job up
    # can use up a 5-minute limit before "reuse lint", which takes a second or two, even starts. A
    # job over its "timeout-minutes" concludes "cancelled", which "dependabot-auto-merge.yml"
    # rightly refuses, so on that pool every Dependabot update would sit waiting for a human with
    # nothing red to say why.
    timeout-minutes: 15
    steps:
      # Symlinks are checked out as symlinks, which matters here: "LICENSE" is one, pointing at
      # "LICENSES/AGPL-3.0-only.txt", so that the file REUSE requires and the file GitHub reads for
      # the repository's licence badge are the same bytes rather than two copies free to drift.
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # See the "yamllint" job above.
          check-latest: true
          cache: "pip"

      # From requirements.txt rather than a bare "pip install reuse", so the version stays pinned in
      # the one file Dependabot watches. It pulls in ansible-core for nothing here, which is what the
      # yamllint job above already does and is cheaper than a second place to bump.
      - name: Install the tooling
        run: pip install -r requirements.txt

      # Every authored file needs a copyright line and an SPDX identifier. The two groups that cannot
      # carry one -- role templates, which are rendered onto the managed node, and JSON, which has no
      # comment syntax -- are declared in REUSE.toml instead.
      - name: Run reuse lint
        run: reuse lint

  ansible-lint:
    name: ansible-lint
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Check the repository out
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # See the "yamllint" job above.
          check-latest: true
          cache: "pip"

      - name: Install the tooling
        run: pip install -r requirements.txt

      # "community.docker" arrived with #76: the first service issue to need more than
      # "ansible.builtin.assert" and "ansible.builtin.include_role". Without it installed,
      # ansible-lint cannot resolve "community.docker.docker_host_info" and
      # "community.docker.docker_container_exec" to check their argument spec.
      - name: Install the collections
        run: ansible-galaxy collection install -r requirements.yml

      # This repository IS the role -- "tasks/", "defaults/" and the rest sit at its own root rather
      # than under a "roles/<name>/" of its own, which is what lets a caller install it with Galaxy
      # or a submodule and have the checkout itself resolve as "deploy_Artificial_Intelligence_Docker_stack". The one
      # place that costs something is right here: "playbook.Artificial_Intelligence.example.yaml" calls the role by that
      # bare name too, and Ansible's own role search never looks at "the current directory" for a
      # match, only at "<playbook_dir>/roles/" and a short list of well-known locations, "~/.ansible/
      # roles" among them. This symlink is what makes that second location resolve -- it exists only
      # for this job's own use of the example playbook, never committed, and it is the CI mirror of
      # what CONTRIBUTING.md now asks every clone to do once.
      - name: Make this checkout resolvable as the "deploy_Artificial_Intelligence_Docker_stack" role
        run: |
          mkdir -p ~/.ansible/roles
          ln -sfn "$GITHUB_WORKSPACE" ~/.ansible/roles/deploy_Artificial_Intelligence_Docker_stack

      - name: Run ansible-lint
        run: ansible-lint

  syntax-check:
    name: ansible-playbook --syntax-check
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Check the repository out
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # See the "yamllint" job above.
          check-latest: true
          cache: "pip"

      - name: Install the tooling
        run: pip install -r requirements.txt

      # "community.docker" arrived with #76: without it installed, "--syntax-check" cannot resolve
      # the argument spec of "community.docker.docker_host_info" and
      # "community.docker.docker_container_exec".
      - name: Install the collections
        run: ansible-galaxy collection install -r requirements.yml

      # Same reason as the identical step in the "ansible-lint" job above: this repository is the
      # role itself, so "playbook.Artificial_Intelligence.example.yaml"'s own "- role: deploy_Artificial_Intelligence_Docker_stack" resolves
      # only once something under Ansible's default search locations carries that name.
      - name: Make this checkout resolvable as the "deploy_Artificial_Intelligence_Docker_stack" role
        run: |
          mkdir -p ~/.ansible/roles
          ln -sfn "$GITHUB_WORKSPACE" ~/.ansible/roles/deploy_Artificial_Intelligence_Docker_stack

      # Playbooks are DISCOVERED, not named. A hard-coded name ("playbook.Artificial_Intelligence.example.yaml") would
      # mean coming back here on the first rename, and above all it would stay green in silence if
      # the file were renamed -- the worse of the two, a check that ticks its box without reading
      # anything.
      #
      # ! The glob can legitimately match nothing -- it did until #31 landed and brought
      #   "playbook.Artificial_Intelligence.example.yaml". In that case the step says so in a "::warning::" annotation
      #   visible on the run's page, rather than handing back a mute green: an empty check that
      #   keeps quiet is a check one only believes one has. It needs no edit either way.
      - name: Check the syntax of every playbook
        run: |
          shopt -s nullglob
          playbooks=(playbook.*.yaml playbook.*.yml)
          if [ ${#playbooks[@]} -eq 0 ]; then
            echo "::warning title=No playbook::No playbook.*.y(a)ml file: this step verified nothing. It will become effective once #31 has landed."
            exit 0
          fi
          for playbook in "${playbooks[@]}"; do
            echo "--- $playbook"
            ansible-playbook --syntax-check "$playbook"
          done

  # Every job above READS the role: lint, syntax, render, parse. None of them had ever RUN it, and v1.0
  # shipped with a task that failed on every run regardless of variables -- a "when" indented one level
  # too deep, read as an argument of "ansible.builtin.assert" -- plus an example playbook that did not
  # pass the role's own asserts. Both are invisible to reading, and both are the first thing a run hits.
  #
  # So this job runs "playbook.Artificial_Intelligence.example.yaml" itself, unedited, on the runner, to
  # its last task: every assert, every rendered file, the deployment role's include, and the
  # post-deployment tasks. The deployer is the stand-in in ".github/role_run/roles/", which renders the
  # compose file and has the real Docker Compose validate it -- starting the stack would pull more than
  # ten gigabytes of images per pull request. What therefore stays unexercised here is everything that
  # needs a running container: the tasks that look for one find none and skip, exactly as written to.
  # The one exception is the agent's key registration, which talks to the gateway's admin API and would
  # wait for a gateway that was never started: "stand_in_gateway.py" answers its three calls, and
  # refuses any other. The rest of that half is #85's, on a machine that looks like the target.
  #
  # Twice: with the Claude Code agent on (the example's default), and off, since each state has an
  # assert, a compose block and registration tasks of its own that the other never touches.
  #
  # ! Two jobs, not a matrix. "dependabot-auto-merge.yml" requires a check by the exact name GitHub
  #   reports it under, and ".github/rulesets/main.json" can only list a name written somewhere. A
  #   matrix job's "name:" is rendered once per leg at run time, by a rule GitHub documents nowhere,
  #   so the one string this file would hold -- "role run (Claude Code agent ${{ matrix.<key> }})" --
  #   is a name no check run ever carries. Listed in main.json, it satisfies
  #   "check_required_checks.py" and holds every Dependabot update for ever, each gate run saying only
  #   that the check "has not reported yet". A static "name:" per job is a name this file states, and
  #   the two below are exactly the ones the matrix legs reported under on GitHub.
  #
  #   The steps are written once, anchored as "&role_run_steps" and aliased as "*role_run_steps",
  #   which Actions reads since 18 September 2025. Only "steps:" is shared: aliasing the whole job and
  #   overriding its "name:" would need the merge key "<<", which Actions refuses -- while PyYAML,
  #   yamllint and "check_required_checks.py" all accept it, so it would pass every local check and
  #   fail on GitHub. What tells the two jobs apart is their own ROLE_RUN_CLAUDE_CODE_AGENT, and the
  #   last step refuses any value but "off" or "on" rather than quietly running the default twice.
  #
  # Their runner comes from CI_RUNNER, like every other job's (see the header), and whatever pool that
  # names needs what GitHub's hosted runners already have for these two: a Docker daemon and Compose
  # v2. Without them the stand-in deployer's "docker compose config" fails, so the jobs go red rather
  # than wait -- the loud way, and the one "dependabot-auto-merge.yml" reads correctly.
  role-run-agent-off:
    name: role run (Claude Code agent off)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      ROLE_RUN_CLAUDE_CODE_AGENT: "off"
    steps: &role_run_steps
      - name: Check the repository out
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # See the "yamllint" job above.
          check-latest: true
          cache: "pip"

      # "requirements.txt" carries "docker" too: the Python SDK the role's "community.docker" modules need ON
      # THE MANAGED NODE -- which, in this run, is this very interpreter (see ".github/role_run/inventory.ini").
      - name: Install the tooling
        run: pip install -r requirements.txt

      - name: Install the collections
        run: ansible-galaxy collection install -r requirements.yml

      # Same reason as the identical step of the "ansible-lint" job above.
      - name: Make this checkout resolvable as the "deploy_Artificial_Intelligence_Docker_stack" role
        run: |
          mkdir -p ~/.ansible/roles
          ln -sfn "$GITHUB_WORKSPACE" ~/.ansible/roles/deploy_Artificial_Intelligence_Docker_stack

      # Listens on 127.0.0.1:4000 until the job ends. Started here for both jobs, though only the agent-on
      # one calls it: one step list is the reason these are two jobs and not a matrix.
      - name: Start the stand-in for the gateway's admin API
        run: nohup python3 .github/role_run/stand_in_gateway.py > "$RUNNER_TEMP/stand_in_gateway.log" 2>&1 &

      - name: Run the example playbook
        env:
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/.github/role_run/roles:~/.ansible/roles
          ANSIBLE_FORCE_COLOR: "1"
        run: |
          extra_vars=(-e @.github/role_run/vars.yml)
          case "$ROLE_RUN_CLAUDE_CODE_AGENT" in
            on) ;;
            off) extra_vars+=(-e @.github/role_run/vars.claude_code_agent_off.yml) ;;
            *)
              echo "::error title=Unknown role run variant::ROLE_RUN_CLAUDE_CODE_AGENT is '$ROLE_RUN_CLAUDE_CODE_AGENT', expected off or on."
              exit 1
              ;;
          esac
          ansible-playbook -i .github/role_run/inventory.ini "${extra_vars[@]}" playbook.Artificial_Intelligence.example.yaml

  role-run-agent-on:
    name: role run (Claude Code agent on)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      ROLE_RUN_CLAUDE_CODE_AGENT: "on"
    steps: *role_run_steps

  home-made-checks:
    name: home-made checks
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # 15 and not 5: see the "REUSE compliance" job above.
    timeout-minutes: 15
    # A single job for the checks in ".github/scripts/". Actions bills by the job and rounds each
    # one up to the minute: three scripts each running in a second would cost three minutes, and
    # would pay for a "checkout" and a "setup-python" each. A fourth check is free to add here.
    #
    # "check_no_inventory_data.py" imports nothing outside the standard library.
    # "check_LiteLLM_account_isolation.py" and "check_required_checks.py" read PyYAML: it is the
    # only dependency of those two, and it was taken knowingly (the reason is written in the first
    # one's header and in "requirements.txt"). "check_LiteLLM_model_drift.py" reads PyYAML too and
    # renders the model list with Jinja2, pinned in "requirements.txt" as well. The install step
    # below is what it costs.
    #
    # The price is real and worth stating: the check list of a pull request carries one line instead
    # of three, so a red cross no longer says WHICH one failed without opening the run. A step that
    # fails still names itself in there, which was the essential part of what separate jobs bought.
    #
    # "!cancelled()": these are independent checks sharing a runner, not a pipeline. Without it, the
    # first failure would hide the state of the ones after it.
    steps:
      - name: Check the repository out
        uses: actions/checkout@v7

      # The python3 of ubuntu-latest is pinned by nobody; a single installation serves both scripts.
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # See the "yamllint" job above.
          check-latest: true
          cache: "pip"

      - name: Install the tooling
        run: pip install -r requirements.txt

      # This check arrived with #31, and until now nothing was running it: the repository had no
      # workflow. It renders and parses the compose template in BOTH of its states, which none of
      # the other jobs does -- reading a diff is not verification. Its dependencies are ansible-core,
      # installed above, whose own "to_json" filter the template uses (#188), and the jinja2 and
      # PyYAML that arrive with it.
      - name: "Compose template: check the check itself"
        run: python3 .github/scripts/check_compose_template.py --selftest

      - name: "Compose template: render it, parse it, hold it to its conventions"
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/check_compose_template.py

      - name: "LiteLLM account isolation: check the check itself"
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/check_LiteLLM_account_isolation.py --selftest

      - name: "LiteLLM account isolation: read the repository's configuration"
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/check_LiteLLM_account_isolation.py

      # The offline half of the drift check: cascades and aliases name active entries, no name twice, every
      # commented-out entry gives its reason. The online half reads the providers' catalogues with
      # their keys, and so never runs on a pull request -- "LiteLLM_model_drift.yml" runs it weekly.
      - name: "LiteLLM model list: check the check itself"
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/check_LiteLLM_model_drift.py --selftest

      - name: "LiteLLM model list: hold it to its rule"
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/check_LiteLLM_model_drift.py

      - name: "Hard-coded inventory data: check the check itself"
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/check_no_inventory_data.py --selftest

      - name: "Hard-coded inventory data: read the repository"
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/check_no_inventory_data.py

      # The job of "sign-off.yml" runs this check on a pull request's commits, and only there. This
      # step proves the check itself on every event, against throwaway repositories and the
      # session-start hook run in a sandbox, so it needs nothing but git and bash.
      - name: "Sign-off: check the check itself"
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/check_sign_off.py --selftest

      # The list of checks a Dependabot update must pass before "dependabot-auto-merge.yml"
      # merges it names jobs by their display name. A job renamed without that list is one every
      # update then waits on for ever; a job added without it is one an update can fail and still
      # merge.
      - name: "Dependabot merge gate: check the check itself"
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/check_required_checks.py --selftest

      - name: "Dependabot merge gate: hold .github/rulesets/main.json to the workflows"
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/check_required_checks.py
