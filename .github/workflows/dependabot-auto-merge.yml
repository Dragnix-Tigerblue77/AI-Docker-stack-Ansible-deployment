---
name: Dependabot auto-merge

# Merges Dependabot's minor and patch updates once every check .github/rulesets/main.json names is
# green on the pull request's head commit.
#
# That file is imported as the repository's ruleset, so GitHub itself refuses any merge, a human's
# included, before every check it names is green. This workflow still merges directly rather than
# with "gh pr merge --auto", and does its own checking first, because "--auto" merges whatever head
# the branch holds when the checks finish: a push to the model-deletion branch after the guards
# below were read would merge unread. The direct merge is pinned to the commit those guards read,
# and GitHub answers 409 if the branch moved since. It never asks GitHub to merge later; it merges
# now, and only after reading, for the exact commit it is about to merge, every check the ruleset
# file lists.
#
# That file is the one gate and it is read from main, never from the pull request: a pull request
# that edits the list of checks it has to pass must not be the one deciding what that list is.
#
# The file names every job of "Quality checks", "Secret scan" and "Commit sign-off" one by one rather
# than a single aggregate job. The step below already refuses a check that is missing, still running,
# cancelled or skipped, so an aggregate job would add nothing to this gate but one more job billed to
# the minute on every run, and one name hiding which check is red. What an aggregate job would have
# bought -- a new job covered without touching this list -- is what
# .github/scripts/check_required_checks.py enforces instead: it fails CI when a job of any of those
# workflows is missing from the file, as well as when a context in it names no job.
#
# Why "workflow_run" and not "pull_request":
#
#   * A job triggered by the pull request would have to sit and poll until the checks finish, on a
#     runner the checks themselves are waiting for. Triggered when "Quality checks", "Secret scan"
#     or "Commit sign-off" completes, it starts only once there is something to read, and whichever
#     of them finishes last is the run that finds every check green.
#   * The definition that runs is the one on main, and nothing from the pull request is checked out
#     or executed. This workflow's two jobs hold a write token, as does the "publish" job of
#     "LiteLLM_model_drift.yml", and that is what makes holding one acceptable: no job may both
#     write and run code nobody has reviewed yet -- a freshly bumped dependency included, since
#     that is exactly what a Dependabot branch carries.
#
# The second point above is what allows these jobs to hold a write token: nothing from a pull
# request is checked out or executed, so no job both holds a write token and runs code nobody has
# reviewed. The header of "ansible-ci.yml" says why every job runs on hosted runners only.
#
# The same step also merges two pull requests that "LiteLLM_model_drift.yml" opens, the one that
# deletes the models their provider has retired and the one that corrects the sheets of entries
# (the value of a "max_input_tokens", "max_output_tokens" or "supports_vision" line), and nothing
# else that workflow's tokens open: the two pull requests of additions are a choice, and stay a
# person's. Neither is Dependabot's, so each is held to what makes it safe in its own terms, all
# read from GitHub's own account of the pull request, bar the one heading of its body that says a
# person has to read. What both share:
#
#   * it is on that workflow's fixed branch for it, from this repository, opened by the Actions bot or
#     by that workflow's GitHub App (MODEL_DRIFT_APP_SLUG, a repository variable, empty until the
#     App is configured), and carries one commit, which the Actions bot is the author of in both
#     cases: the pull request's author widens with the App, the commit's does not. An App only the
#     repository's administrator can install is what opens it, and nobody else can name it here;
#   * it changes the model list's template, and beside it, in no other way, the two files generated in
#     the same run: the catalogue of what the gateway serves and the figures file that catalogue shows
#     (the Artificial Analysis and Epoch AI figures of each entry, which the drift workflow reads online
#     and the CI cannot). What is allowed of the template is the one thing each kind adds, below. The two
#     generated files are not held to lines: each is let through for its identity, which must be a file
#     that exists and is modified, not added, removed or renamed, with at least one changed line and at
#     most DRIFT_GENERATED_MAX_CHANGES, whatever lines it gains or loses, and the template must be there
#     with them, never they alone. What they say is proved by the check every pull request runs, which
#     the last bullet below requires green: it refuses a figures file that is not numbers, within
#     bounds, for entries of the template, and a catalogue that is not what the template, the contracts
#     and those figures produce. This is what the gate opens, and it is said here so that nobody reads
#     it as less: a compromised job that reads the two sites could publish wrong figures, in the
#     figures file and the catalogue, in a pull request that merges unseen. They steer no routing -- no
#     cascade, entry or head reads them -- and a person who reads the catalogue reads them as the
#     figures of the last run. The counts below are of the template's patch alone;
#   * its body has no "À relire" section. The script lists there what a person has to read (for
#     the deletions a comment that names a model that is gone, the reason of a group that lost a
#     member; for the sheets a correction it could not write, and the entries
#     "check_compose_template.py" will refuse): a pull request with such a section waits for that
#     person;
#   * its head contains all of main. The checks ran on that head, and what lands is that head merged
#     into main as it is when the merge happens: only a head that is not behind makes the two the
#     same tree, and a head that is behind is rebuilt by the next run;
#   * every check the ruleset names is green on its head, "sign-off" included. That check reads the
#     commits of a pull request, which GitHub never starts for one opened with GITHUB_TOKEN and does
#     for one opened with the App; without the App it never starts, and the ruleset then keeps that
#     pull request from merging at all, a human's included.
#
# What the deletions add:
#
#   * it adds no line to the template: a pull request that can only take lines away cannot bring in a
#     model, an address or a key, whatever made it;
#   * what it takes away is read line by line in the diff, not counted: whole model entries, the
#     cascade slots that name an entry going in the same diff, comments and blank lines, and
#     nothing else. A setting, an address, or the model of an entry that stays is not a model, and
#     a person reads a diff that deletes one. Counting alone would let settings through under the
#     name of a deletion, as long as there were few enough;
#   * it deletes at least one and at most REMOVALS_MAX_ENTRIES entries and REMOVALS_MAX_LINES
#     lines, counted in the diff, the entries a commented-out one included: a run that would delete
#     more has read a catalogue that is wrong, or is being made to, and a person looks first.
#
# What the sheet corrections add. A sheet is the "model_info" of an entry, which the routers read
# to keep a request away from a member it does not fit. A value that comes from a provider's
# catalogue needs no judgment, and CI refuses the one thing that would contradict an entry, a length
# it sets that the new sheet no longer allows:
#
#   * every changed line of the template is a sheet line rewritten in place, read in the whole file as it
#     is on main and as it is on the head, not in the patch alone, which shows too few lines to tell which entry
#     a line is in: the same number of lines, and on each changed line the same key, indentation,
#     spacing and trailing comment, a positive whole number or true or false, in the "model_info" of
#     an entry. Nothing is added, removed or moved. The function that asks it is the "sheet guard" of
#     "LiteLLM_model_drift.yml", copied byte for byte: neither workflow can load a file of the
#     repository, and "check_drift_publish_guard.py" plays both copies on the same cases and refuses
#     a pair that differs;
#   * it rewrites at least one and at most SHEETS_MAX_VALUES values, one line taken out and one put
#     in for each, counted in the diff: a catalogue that turns wrong all at once (a renamed field,
#     a unit changed) has one cause and many values, and a person looks first.
#
# "check_auto_merge_gate.py" runs the step below against made-up pull requests -- those that must
# merge and, one by one, the shapes that must not -- and breaks its script and its environment a
# guard at a time to prove a scenario notices each. A guard that stops guarding is otherwise seen by
# nobody.
#
# Each branch name is written here, in the "if:" of the job and in the step below, and in
# "LiteLLM_model_drift.yml", where it is made: "check_required_checks.py" fails CI when they differ.
#
# What the step below refuses, and why each refusal is there:
#
#   * a pull request neither opened by Dependabot nor one of the model-drift pull requests above, or
#     not based on main, or whose head is not the commit that was just checked -- the merge is pinned to that
#     SHA, so a push that lands between the check and the merge makes GitHub refuse the merge
#     rather than merge unchecked code;
#   * (Dependabot) any update that is not semver-minor or semver-patch, read from the metadata
#     block Dependabot writes into its own commit message. A major waits for a human;
#   * (Dependabot) any commit on the branch that is not Dependabot's own and signed as such. A
#     branch someone pushed to has stopped being a Dependabot update, whatever its title says.
#     Nothing in this repository writes to a Dependabot branch, so there is no exception to that;
#   * (the deletions, the sheet corrections) anything the lists above do not allow;
#   * a required check that is missing, still running, or anything but a success -- cancelled and
#     skipped included, since neither says the change was checked.
#
# Each refusal is a notice and a green run, not a failure: most of them are the ordinary state of a
# pull request whose other workflow has not finished yet, and a red run there would be noise the
# next run makes true anyway. The pull request itself stays open, which is the visible outcome.
#
# Merging with GITHUB_TOKEN has one consequence the second job is there for. A push made with that
# token starts no workflow, so the merge commit would be the one head of main no "push" run of
# "Quality checks" or "Secret scan" ever checks -- dc5bb6a, the merge of #142, has no run at all
# (#180). The pull request was checked on its own head, but what lands on main is that head merged
# with whatever reached main since its run: another Dependabot update merged a minute earlier, or
# the main of the day its run started, when a job of it is re-run by hand days later -- a re-run
# keeps the original event's commit. The ruleset does not ask for the branch to be up to date
# ("strict_required_status_checks_policy": false), so only a run on main sees that tree, and until
# one does, main's head carries no status at all. GitHub documents an exception to its own rule
# that fits: a "workflow_dispatch" GITHUB_TOKEN causes still creates a run. So once "merge" has
# merged, "recheck-main" dispatches the workflows on main that run there -- what a human's merge
# gets from their "push" trigger. "Commit sign-off" is not among them: it reads the commits of a
# pull request, and the merge commit this leaves on main is a merge, which it would skip.

on:
  workflow_run:
    workflows: ["Quality checks", "Secret scan", "Commit sign-off"]
    types: [completed]

permissions: {}

# Workflows finishing within seconds of each other would otherwise start several of these on the
# same commit, a later one then failing on a pull request an earlier one had just merged.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  merge:
    name: Merge a green Dependabot update or model drift pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A cheap filter so that the completion of every workflow on every branch does not take a
    # runner. It decides nothing: the step below checks the author, the commits and the checks
    # itself, and a branch merely named "dependabot/..." gets no further than that.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (startsWith(github.event.workflow_run.head_branch, 'dependabot/') ||
      github.event.workflow_run.head_branch == 'claude/LiteLLM-model-drift-removals' ||
      github.event.workflow_run.head_branch == 'claude/LiteLLM-model-drift-sheets')
    permissions:
      # Merging a pull request is a write to the repository's contents; nothing else here writes.
      contents: write
      pull-requests: read
      checks: read
    # "true" once this run has merged a pull request, empty otherwise: what "recheck-main" keys on.
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      # github-script rather than gh and jq: the runner's own Node is the one thing every runner is
      # guaranteed to have, whatever else the image it runs in carries.
      - name: Merge the pull request if every required check passed on its head
        id: merge
        uses: actions/github-script@v9
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          # The model-drift deletions and sheet corrections: see the header.
          REMOVALS_BRANCH: claude/LiteLLM-model-drift-removals
          SHEETS_BRANCH: claude/LiteLLM-model-drift-sheets
          # The slug of the GitHub App that workflow opens its pull requests with, when it has one:
          # a pull request is then authored by "<slug>[bot]" and not by the Actions bot, which
          # stays accepted. A repository variable only an administrator can set, empty until the
          # App is configured. Used only if it is a slug, which is lowercase letters, digits and
          # hyphens; anything else leaves the Actions bot alone.
          MODEL_DRIFT_APP_SLUG: ${{ vars.MODEL_DRIFT_APP_SLUG }}
          # The one model file either changes, and the two files generated from it that either may rewrite
          # beside it, under a cap on the lines each changes.
          DRIFT_FILE: templates/LiteLLM_config.yaml.j2
          DRIFT_CATALOG_FILE: docs/CATALOG.md
          DRIFT_SCORES_FILE: docs/catalog_scores.json
          DRIFT_GENERATED_MAX_CHANGES: '4000'
          REMOVALS_MAX_ENTRIES: '5'
          REMOVALS_MAX_LINES: '200'
          # How many sheet values one pull request may rewrite and still merge itself. A catalogue
          # that turns wrong at once (a renamed field, a unit changed) rewrites many values with one
          # cause, and that is a person's to read before it reaches the file the routers read.
          SHEETS_MAX_VALUES: '10'
          # The title of the section of the body of each that asks a person to read.
          # "check_auto_merge_gate.py" reads the script that writes them, and fails if it stops
          # fitting.
          REMOVALS_REVIEW_HEADING: '## À relire'
          SHEETS_REVIEW_HEADING: '## À relire'
        with:
          script: |
            const { owner, repo } = context.repo;
            const headSha = process.env.HEAD_SHA;

            // The question this answers: is every line the patch deletes part of a whole model entry, a
            // cascade slot of one of those entries, a comment or a blank line? Anything else -- a setting,
            // the "model:" of an entry that stays, an "api_base" -- is not a model, whatever else the patch
            // is, and a person reads it. The entries of a keyless gateway hold two lines more, the header that
            // blanks Authorization, which are part of the entry only written as the template writes them. Every entry also holds the two lines of its
            // groups, "LLM" for a text model and the one that says what its provider does with the data, and "Claude-Code" after
            // them for a member of the agent's cascade: one in another type group, or in an order the template does not write,
            // has other lines and is a person's. A
            // diff may put one deletion a few identical lines higher or lower
            // than another would: the question is asked of the file that results, so any placement that is
            // a whole deletion counts.
            function removalsPatchProblem(patch) {
              const BLANK = /^\s*$/;
              const COMMENT = /^\s*#/;
              const HEADER = /^ {2}- model_name:\s*(\S.*?)\s*$/;
              const BODY = /^( {4}model_info:| {6}access_groups:\s*\["LLM", "(?:Private-Data|Public-Data-Only)"(?:, "Claude-Code")?\]| {4}litellm_params:| {6}(model|api_key|litellm_credential_name|api_base):\s*\S.*?| {6}extra_headers:| {8}Authorization:\s*"")\s*$/;
              const SLOT = /^ {8}- ([A-Za-z0-9_.:/-]+)\s*$/;
              const REACH = 3;
              const cut = (text) => (text.length > 60 ? text.slice(0, 57) + '...' : text);

              // Each hunk is read as the lines it holds of the old file, with the runs of deleted ones marked.
              const hunks = [];
              let hunk = null;
              let after = false;
              const rows = patch.split('\n');
              rows.forEach((row, index) => {
                if (row.startsWith('@@')) { hunk = { old: [], owner: [], runs: [] }; hunks.push(hunk); after = false; return; }
                if (!hunk || row.startsWith('\\') || (row === '' && index === rows.length - 1)) return;
                const tag = row.charAt(0);
                if (tag === '+') hunk.added = true;
                hunk.old.push(row.slice(1));
                if (tag === '-') {
                  if (!after) hunk.runs.push({ start: hunk.old.length - 1, length: 0 });
                  hunk.runs[hunk.runs.length - 1].length += 1;
                  hunk.owner.push(hunk.runs.length - 1);
                  after = true;
                } else {
                  hunk.owner.push(-1);
                  after = false;
                }
              });
              if (hunks.some((each) => each.added)) return 'a line is added';
              if (hunks.length === 0) return 'the patch holds no change';

              const kindOf = (line) => (
                BLANK.test(line) ? 'blank' : COMMENT.test(line) ? 'comment' : HEADER.test(line) ? 'header'
                  : BODY.test(line) ? 'body' : SLOT.test(line) ? 'slot' : null);

              // What a run of deleted lines is, if it is something the tool deletes: whole entries, or cascade slots.
              const judge = (lines, next) => {
                const kinds = lines.map(kindOf);
                const odd = kinds.indexOf(null);
                if (odd >= 0) return { problem: `a deleted line is not a model entry, a cascade slot, a comment or a blank line: "${cut(lines[odd].trim())}"` };
                const significant = kinds.filter((kind) => kind !== 'blank' && kind !== 'comment');
                if (significant.length === 0) return { entries: [], slots: [] };
                if (significant[0] === 'slot') {
                  if (significant.some((kind) => kind !== 'slot')) return { problem: 'a run of deleted cascade slots is mixed with something else' };
                  return { entries: [], slots: lines.filter((line, i) => kinds[i] === 'slot').map((line) => SLOT.exec(line)[1]) };
                }
                if (significant[0] !== 'header') return { problem: 'a run of deleted lines starts inside an entry, not at its first line' };
                if (significant.includes('slot')) return { problem: 'a run of deleted lines mixes entries and cascade slots' };
                if (next !== undefined && /^ {3,}\S/.test(next) && !COMMENT.test(next)) {
                  return { problem: `the deleted entry is cut short: "${cut(next.trim())}" is left behind` };
                }
                return { entries: lines.filter((line, i) => kinds[i] === 'header').map((line) => HEADER.exec(line)[1].replace(/^["']|["']$/g, '')), slots: [] };
              };

              const entryNames = new Set();
              const slotNames = [];
              for (const each of hunks) {
                each.runs.forEach((run, id) => {
                  if (run.verdict) return;
                  // A diff may put the same deletion a few identical lines higher or lower (the "api_key" of the entry
                  // above instead of the entry below): the file that results is the same, so any placement that is a
                  // whole deletion makes it one.
                  const without = (start) => each.old.slice(0, start).concat(each.old.slice(start + run.length)).join('\n');
                  const result = without(run.start);
                  let first = null;
                  for (let shift = 0; shift <= 2 * REACH && !run.verdict; shift++) {
                    const move = shift === 0 ? 0 : (shift % 2 === 1 ? 1 : -1) * Math.ceil(shift / 2);
                    const start = run.start + move;
                    if (start < 0 || start + run.length > each.old.length) continue;
                    if (each.owner.slice(start, start + run.length).some((owner) => owner !== -1 && owner !== id)) continue;
                    if (move !== 0 && without(start) !== result) continue;
                    const verdict = judge(each.old.slice(start, start + run.length), each.old[start + run.length]);
                    if (first === null) first = verdict;
                    if (!verdict.problem) run.verdict = verdict;
                  }
                  if (!run.verdict) run.verdict = first;
                });
                for (const run of each.runs) {
                  if (run.verdict.problem) return run.verdict.problem;
                  run.verdict.entries.forEach((name) => entryNames.add(name));
                  slotNames.push(...run.verdict.slots);
                }
              }
              for (const name of slotNames) {
                if (!entryNames.has(name)) return `a cascade slot "${cut(name)}" is deleted but the entry it names is not`;
              }
              return null;
            }


            // BEGIN sheet guard
            // What the job that made the template may hand over for the pull request of the sheet
            // corrections: the template on the commit it worked on with the value of lines written
            // again, each a "max_input_tokens", "max_output_tokens" or "supports_vision" line of the
            // "model_info" of an entry, kept as it is but for that value (a positive whole number, or
            // true or false for the image flag). A line added, removed or changed otherwise, a changed
            // key, indentation or comment, a line outside the "model_info" of an entry, is refused.
            // Returns why, or null. The same block stands in LiteLLM_model_drift.yml, where the job that
            // writes asks it of the template it was handed, and in dependabot-auto-merge.yml, where the gate
            // asks it of a pull request: neither can load a file of the repository, so each holds its copy.
            // "check_drift_publish_guard.py" plays both on the same cases and refuses a pair that differs.
            // Keep the markers.
            const SHEET_LINE = /^([ \t]+)(max_input_tokens|max_output_tokens|supports_vision):([ \t]+)([0-9]+|true|false)((?:[ \t]+#.*)?[ \t]*)$/;
            const sheetValueFits = (key, value) =>
              (key === 'supports_vision' ? /^(true|false)$/ : /^[1-9][0-9]{0,11}$/).test(value);
            const sheetIndent = (line) => line.length - line.trimStart().length;
            const sheetParent = (lines, index) => {
              const own = sheetIndent(lines[index]);
              for (let at = index - 1; at >= 0; at -= 1) {
                if (lines[at].trim() === '' || /^\s*#/.test(lines[at])) continue;
                if (sheetIndent(lines[at]) < own) return { at, line: lines[at] };
              }
              return null;
            };
            const sheetProblem = (baseText, newText) => {
              if (typeof baseText !== 'string' || typeof newText !== 'string') return 'a template is no text';
              if (baseText.includes('\r') || newText.includes('\r')) return 'a template holds a carriage return';
              const before = baseText.split('\n');
              const after = newText.split('\n');
              if (before.length !== after.length) return `it has ${after.length} lines and the base ${before.length}: a line was added or removed`;
              for (let index = 0; index < before.length; index += 1) {
                if (before[index] === after[index]) continue;
                const was = SHEET_LINE.exec(before[index]);
                const now = SHEET_LINE.exec(after[index]);
                if (!was || !now) return `line ${index + 1} is changed and is not a sheet line of the base: ${after[index].slice(0, 120)}`;
                if (was[1] !== now[1] || was[2] !== now[2] || was[3] !== now[3] || was[5] !== now[5]) return `line ${index + 1} changes more than the value of its sheet field`;
                if (!sheetValueFits(was[2], was[4]) || !sheetValueFits(now[2], now[4])) return `line ${index + 1} gives ${now[2]} a value that is no positive whole number or flag`;
                const info = sheetParent(before, index);
                if (!info || !/^\s*model_info:\s*(?:#.*)?$/.test(info.line)) return `line ${index + 1} is not in a model_info`;
                const entry = sheetParent(before, info.at);
                if (!entry || !/^\s*-\s+model_name:\s*\S+\s*$/.test(entry.line)) return `line ${index + 1} is in a model_info that is no entry's`;
              }
              return null;
            };
            // END sheet guard


            const defaultBranch = context.payload.repository.default_branch;
            const allowedUpdateTypes = new Set([
              'version-update:semver-minor',
              'version-update:semver-patch',
            ]);

            // Read from main, never from the pull request: see the header.
            const { data: file } = await github.rest.repos.getContent({
              owner, repo, path: '.github/rulesets/main.json', ref: defaultBranch,
            });
            const ruleset = JSON.parse(Buffer.from(file.content, 'base64').toString('utf8'));
            const rules = ruleset.rules.filter((rule) => rule.type === 'required_status_checks');
            if (rules.length !== 1) {
              core.setFailed(`.github/rulesets/main.json holds ${rules.length} required_status_checks rules, expected exactly one.`);
              return;
            }
            const required = rules[0].parameters.required_status_checks.map((check) => check.context);
            if (required.length === 0) {
              core.setFailed('.github/rulesets/main.json requires no check at all, which would merge unchecked updates.');
              return;
            }

            const { data: associated } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner, repo, commit_sha: headSha,
            });
            const candidates = associated.filter((pr) =>
              pr.state === 'open' &&
              pr.head.sha === headSha &&
              pr.base.ref === defaultBranch &&
              pr.head.repo?.full_name === `${owner}/${repo}`);
            if (candidates.length !== 1) {
              core.notice(`${headSha} is the head of ${candidates.length} open pull request(s) against ${defaultBranch}, not exactly one. Nothing to merge.`);
              return;
            }
            const pr = candidates[0];
            const label = `#${pr.number} (${pr.title})`;

            const dependabot = pr.user.login === 'dependabot[bot]';
            // The model-drift deletions and sheet corrections: opened with the workflow's own token or
            // with its GitHub App's, each on its one fixed branch. What else either opens is none of
            // this step's business. Only the author widens with the App: the one commit below is
            // still the Actions bot's.
            const appSlug = process.env.MODEL_DRIFT_APP_SLUG ?? '';
            const driftAuthors = ['github-actions[bot]'];
            if (/^[a-z0-9-]+$/.test(appSlug)) driftAuthors.push(`${appSlug}[bot]`);
            const removals = driftAuthors.includes(pr.user.login) &&
              pr.head.ref === process.env.REMOVALS_BRANCH;
            const sheets = driftAuthors.includes(pr.user.login) &&
              pr.head.ref === process.env.SHEETS_BRANCH;
            if ((!dependabot && !removals && !sheets) || pr.draft) {
              core.notice(`${label} is neither a Dependabot pull request nor the model deletions nor the sheet corrections, or is a draft. Left alone.`);
              return;
            }

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            if (dependabot) {
              const updateTypes = [];
              for (const commit of commits) {
                const author = commit.author?.login;
                const signed = commit.commit.verification?.verified === true;
                if (author !== 'dependabot[bot]' || !signed) {
                  core.notice(`${label} carries ${commit.sha}, which is not a signed Dependabot commit. It is waiting for a human.`);
                  return;
                }
                for (const match of commit.commit.message.matchAll(/^\s*update-type:\s*(\S+)\s*$/gm)) {
                  updateTypes.push(match[1]);
                }
              }
              if (updateTypes.length === 0) {
                core.notice(`${label}: no update-type found in Dependabot's commit metadata. It is waiting for a human.`);
                return;
              }
              const refused = updateTypes.filter((type) => !allowedUpdateTypes.has(type));
              if (refused.length > 0) {
                core.notice(`${label} includes ${[...new Set(refused)].join(', ')}. Only minor and patch updates merge themselves; this one is waiting for a human.`);
                return;
              }
            } else {
              // Not signed, unlike Dependabot's: the workflow makes its commit through the API with
              // an author of its own, which GitHub does not sign. The author is told by name, and
              // is no boundary against someone who can push here -- they can push to main. What
              // bounds this merge is what the file can change, below: lines taken away for the
              // deletions, the value of sheet lines for the corrections.
              if (commits.length !== 1 || commits[0].author?.login !== 'github-actions[bot]') {
                core.notice(`${label}: the branch is not main plus the one commit the workflow made. It is waiting for a human.`);
                return;
              }
              const heading = (removals ? process.env.REMOVALS_REVIEW_HEADING : process.env.SHEETS_REVIEW_HEADING)
                .replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              if (new RegExp(`^${heading}\\s*$`, 'm').test(pr.body ?? '')) {
                core.notice(`${label} lists what a person has to read ${removals ? 'once these models are gone' : 'before these sheets are corrected'}. It is waiting for a human.`);
                return;
              }
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: pr.number, per_page: 100,
              });
              // The template is the one file whose lines are read below. Beside it, the catalogue generated
              // from it and the figures file the catalogue shows are the two files the same run rewrites,
              // and they are let through for their identity, not their lines: each must be a file that
              // exists and is changed as text (modified, not added, removed or renamed, and at least one
              // line of it, so that no binary or mode-only change passes), under a cap, whatever lines it
              // gains or loses. What they say is held by the check every pull request runs, which this
              // step has just required green: it refuses a figures file that is not numbers for entries of
              // the template, and a catalogue that is not what the template, the contracts and those
              // figures produce. So what a compromised reader could still do through them is put wrong
              // figures in the catalogue, which steer no routing. Every count and rule below is of the
              // template's patch alone.
              const generatedNames = [process.env.DRIFT_CATALOG_FILE, process.env.DRIFT_SCORES_FILE];
              const generated = files.filter((each) => generatedNames.includes(each.filename));
              const others = files.filter((each) => !generatedNames.includes(each.filename));
              const file = others[0] ?? {};
              if (others.length !== 1 || file.filename !== process.env.DRIFT_FILE ||
                  file.status !== 'modified' || (removals && file.additions !== 0) || !file.patch) {
                core.notice(`${label} is not ${removals ? 'a deletion of lines from' : 'a rewrite of sheet values in'} ${process.env.DRIFT_FILE} alone, beside ${generatedNames.join(' and ')}. It is waiting for a human.`);
                return;
              }
              // A cap that is not a number would let every comparison below pass: refuse to merge
              // anything, loudly, rather than merge without it.
              const maxGenerated = Number(process.env.DRIFT_GENERATED_MAX_CHANGES);
              if (!Number.isInteger(maxGenerated) || maxGenerated < 1) {
                core.setFailed(`DRIFT_GENERATED_MAX_CHANGES ("${process.env.DRIFT_GENERATED_MAX_CHANGES}") must be a positive whole number: no drift pull request merges until it is.`);
                return;
              }
              const rewritten = generatedNames.map((name) => generated.filter((each) => each.filename === name));
              if (rewritten.some((same) => same.length > 1 ||
                  same.some((each) => each.status !== 'modified' || !(each.changes >= 1) || !(each.changes <= maxGenerated)))) {
                core.notice(`${label} does not rewrite ${generatedNames.join(' and ')} as files that exist, changed as text and under ${maxGenerated} changed lines each. It is waiting for a human.`);
                return;
              }
              if (removals) {
                // A cap that is not a number would let every comparison below pass: refuse to merge
                // anything, loudly, rather than merge without it.
                const maxEntries = Number(process.env.REMOVALS_MAX_ENTRIES);
                const maxLines = Number(process.env.REMOVALS_MAX_LINES);
                if (!Number.isInteger(maxEntries) || !Number.isInteger(maxLines) || maxEntries < 1 || maxLines < 1) {
                  core.setFailed(`REMOVALS_MAX_ENTRIES ("${process.env.REMOVALS_MAX_ENTRIES}") and REMOVALS_MAX_LINES ("${process.env.REMOVALS_MAX_LINES}") must be positive whole numbers: no deletion pull request merges until they are.`);
                  return;
                }
                // Every line of a patch that starts with "-" is a deleted one, a YAML list item
                // included ("-  - model_name: x"): the patch carries no "---" file header.
                const deleted = file.patch.split('\n').filter((line) => line.startsWith('-'));
                const entries = deleted.filter((line) => /^-\s*(?:#\s*)?-\s+model_name\s*:/.test(line)).length;
                if (deleted.length !== file.deletions || entries === 0 || !(entries <= maxEntries) || !(deleted.length <= maxLines)) {
                  core.notice(`${label} deletes ${entries} entries in ${deleted.length} line(s) (${file.deletions} counted by GitHub); only 1 to ${maxEntries} entries and ${maxLines} lines merge themselves. It is waiting for a human.`);
                  return;
                }
                const shape = removalsPatchProblem(file.patch);
                if (shape) {
                  core.notice(`${label}: ${shape}. It is waiting for a human.`);
                  return;
                }
              } else {
                const maxValues = Number(process.env.SHEETS_MAX_VALUES);
                if (!Number.isInteger(maxValues) || maxValues < 1) {
                  core.setFailed(`SHEETS_MAX_VALUES ("${process.env.SHEETS_MAX_VALUES}") must be a positive whole number: no sheet pull request merges until it is.`);
                  return;
                }
                // One line taken out and one put in for each value, as GitHub counts them and as the
                // patch holds them; that they stand at the same place, and are sheet lines, is asked
                // of the two texts below.
                const patchRows = file.patch.split('\n');
                const taken = patchRows.filter((line) => line.startsWith('-')).length;
                const put = patchRows.filter((line) => line.startsWith('+')).length;
                if (taken !== file.deletions || put !== file.additions || taken !== put || taken === 0 || !(taken <= maxValues)) {
                  core.notice(`${label} takes out ${taken} line(s) and puts in ${put} (${file.deletions} and ${file.additions} counted by GitHub); only 1 to ${maxValues} sheet values merge themselves, each one line for one line. It is waiting for a human.`);
                  return;
                }
              }
              // The checks ran on this head, and what lands is this head merged into main as it is
              // now: only a head that contains all of main makes the two the same tree.
              const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                owner, repo, basehead: `${defaultBranch}...${headSha}`, per_page: 1,
              });
              if (comparison.behind_by !== 0) {
                core.notice(`${label} is ${comparison.behind_by} commit(s) behind ${defaultBranch}, so the checks did not run on the tree that would land. The next run rebuilds it.`);
                return;
              }
              if (sheets) {
                // The two whole files, not the patch alone: a patch shows three lines around a change,
                // too few to tell which "model_info" of which entry a line belongs to. The merge base
                // is main as it is, the head being level with it.
                const read = async (ref) => {
                  const { data: text } = await github.rest.repos.getContent({
                    owner, repo, path: process.env.DRIFT_FILE, ref, mediaType: { format: 'raw' },
                  });
                  return text;
                };
                const problem = sheetProblem(await read(comparison.merge_base_commit.sha), await read(headSha));
                if (problem) {
                  core.notice(`${label} is not ${process.env.DRIFT_FILE} on ${defaultBranch} with the value of sheet lines written again: ${problem}. It is waiting for a human.`);
                  return;
                }
              }
            }

            const checkRuns = await github.paginate(github.rest.checks.listForRef, {
              owner, repo, ref: headSha, per_page: 100,
            });
            for (const context of required) {
              // Only GitHub Actions' own check runs count: a check of the same name posted by
              // anything else is not the job the ruleset means.
              const runs = checkRuns
                .filter((run) => run.name === context && run.app?.slug === 'github-actions')
                .sort((a, b) => (b.started_at ?? '').localeCompare(a.started_at ?? ''));
              if (runs.length === 0) {
                core.notice(`${label}: "${context}" has not reported on ${headSha} yet. The run that completes it will try again.`);
                return;
              }
              const latest = runs[0];
              if (latest.status !== 'completed') {
                core.notice(`${label}: "${context}" is still ${latest.status} on ${headSha}. The run that completes it will try again.`);
                return;
              }
              if (latest.conclusion !== 'success') {
                core.notice(`${label}: "${context}" concluded ${latest.conclusion} on ${headSha}. It is waiting for a human.`);
                return;
              }
            }

            try {
              // "sha" is what pins the merge to the commit the checks above were read on: if the
              // branch moved since, GitHub answers 409 and merges nothing. "merge" rather than
              // "squash", because every pull request here lands as a merge commit.
              await github.rest.pulls.merge({
                owner, repo, pull_number: pr.number, sha: headSha, merge_method: 'merge',
              });
            } catch (error) {
              if (error.status === 405 || error.status === 409) {
                core.notice(`${label} was not merged: ${error.message}`);
                return;
              }
              throw error;
            }
            core.notice(`${label} merged: ${required.map((context) => `"${context}"`).join(', ')} green on ${headSha}.`);
            core.setOutput('merged', 'true');

  # The merge above is a push to main made with GITHUB_TOKEN, which starts no workflow: this job is
  # what checks the tree it leaves on main (the header says why that tree needs it, #180). A job of
  # its own rather than a last step of "merge", for the permissions: dispatching needs
  # "actions: write", merging "contents: write", and neither job needs the other's. It checks
  # nothing out and runs nothing from the pull request either, and it is skipped -- before any
  # runner is asked for -- on every run that merges nothing, which is nearly all of them.
  #
  # The runs it starts complete like any other and wake this workflow again through
  # "workflow_run", on main: the "if:" of "merge" skips them, so this does not loop. They share the
  # "concurrency" group of main's "push" runs, so when a human merges meanwhile the later of the two
  # runs cancels the earlier, and what gets checked is the newest head of main, which contains this
  # merge.
  recheck-main:
    name: Run the checks on main after the merge
    needs: merge
    if: needs.merge.outputs.merged == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Creating a "workflow_dispatch" event, and nothing else.
      actions: write
    steps:
      - name: Dispatch the checks on main
        uses: actions/github-script@v9
        env:
          # The FILES of the workflows "on.workflow_run.workflows" above names by their "name:",
          # bar those "check_required_checks.py" lists as NOT_DISPATCHED with their reason. It holds
          # the two lists to each other, and each file listed here to carrying the
          # "workflow_dispatch:" trigger GitHub refuses a dispatch without. It also holds the copy
          # of this list in LiteLLM_model_drift.yml to it: that workflow dispatches the same files
          # on the branch of the pull request it opens.
          WORKFLOW_FILES: ansible-ci.yml gitleaks.yml
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = context.payload.repository.default_branch;
            const refused = [];
            for (const workflow of process.env.WORKFLOW_FILES.split(/\s+/).filter(Boolean)) {
              try {
                await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: workflow, ref });
                core.notice(`${workflow} dispatched on ${ref}.`);
              } catch (error) {
                refused.push(workflow);
                core.error(`${workflow} could not be dispatched on ${ref}: ${error.message}`);
              }
            }
            // Red, although the merge itself went through: it is the check of the merge that is
            // missing, and a green run would hide exactly that.
            if (refused.length > 0) {
              core.setFailed(`${ref} was merged into, and ${refused.join(' and ')} will not check it.`);
            }
