# SPDX-License-Identifier: AGPL-3.0-only
---
name: LiteLLM model drift

# Every day, compares "templates/LiteLLM_config.yaml.j2" on main with what each provider's own API
# lists, writes the whole report to the run's summary, opens ONE pull request that deletes the models
# a provider no longer lists, TWO that propose the models it does not know yet, and ONE that corrects
# the sheets of the entries (context window, longest answer, image input) that their provider's catalogue
# states otherwise. Deletions are the only thing that may merge without a person, because they need no
# judgment: CLAUDE.md ("The model list keeps only what can be called") says a retired model is deleted,
# entry and cascade slots alike. No model reads a catalogue or writes a line here: "check_LiteLLM_model_drift.py --apply"
# does it, and deletes only what it can read back as the original minus the deletion. An addition is
# a choice, so its pull requests only make it cheap: the entry is written, its place in each router
# suggested, and, where the run lacks a fact a person needs to decide, which one and how to get it is
# listed (below). What each finding means is in the docstring of that script, which this workflow
# only runs. The README says what the repository needs for it, the setting "Allow GitHub Actions to
# create and approve pull requests" included: while it is off, and no GitHub App writes the pull
# requests (below), the step that opens them fails and names it.
#
# What a person has to read rides on the pull request it concerns, which notifies them: an announced
# retirement in the body of the deletion pull request, a model free again in the body of the pull
# request of ready additions (of the one to verify when the ready one is not opened), a NEW model
# neither can carry -- an id spelt otherwise, a provider with no entry yet, past the cap, a body too
# long -- with its entry and why, in the body of the one to verify, and a sheet it could not rewrite in
# the body of the sheet pull request. The summary of the "read" job has all of it, the router contracts
# included, and is the only place of what has no pull request that day to ride on. It notifies
# nobody, and that is the point: the issue is kept for the one finding no pull request can carry, a
# catalogue that could not be read (below).
#
# Every day, because a model a provider releases or retires then waits at most a day before a pull
# request proposes or deletes it. A retirement is announced weeks ahead (Groq gave four weeks for
# Compound, announced 2026-08-24 and shut 2026-09-21) but not always where an API carries it, and the
# run sees a model gone within a day: a cascade one entry shorter for that day, since a refused call
# only moves the request on. At 07:17 UTC -- 8:17 in Paris in winter, 9:17 in summer -- off the top
# of the hour, when every scheduled workflow on GitHub starts at once, and ready before the stack is
# used, from 17:00 to 22:00 on weekdays and from 10:00 to 22:00 at weekends and on holidays.
#
# Three retries, the same day at 09:17, 11:17 and 13:17 UTC, for a catalogue that could not be
# read: a provider's incident, a network error or a rate limit usually passes within hours, and an
# issue for every one of them would teach a person to ignore the issue. A retry runs the whole
# pipeline only when the attempt before it ended with a catalogue it could not read (a request that
# failed, the catalogue of a provider with a key that did not answer); otherwise its "gate" job ends
# within seconds having done nothing, so a healthy day costs one run and three of a few seconds. The
# issue is opened, or updated, only by the fourth attempt, when a catalogue is still unreadable: it
# names the providers, the class of each one's HTTP status (never a key, never an answer) and the
# times of the three attempts before. It is closed by the first run that reads every catalogue. A run
# started by hand is one attempt and no chain: it may close the issue, and never opens one, since the
# person who started it is watching it, and its summary says what it could not read.
#
# What carries one attempt to the next is GitHub's own record of the runs, and nothing this workflow
# writes elsewhere. The attempt is the place of the cron that fired the run ("github.event.schedule")
# among the four, which no earlier run has to have left behind. What the attempt before ended with is
# the NAME of an artifact its "read" job uploads, "LiteLLM-model-drift-outcome-read" or
# "...-unreadable", kept one day: the gate lists the artifacts of the day's earlier scheduled runs
# with a read-only token and reads no content, so neither a key nor a model's text can travel that
# way. A variable or a cache would need a token that writes, or would be read back by a job that runs
# code. An attempt that left no outcome (skipped, cancelled, crashed, or never started by GitHub) is
# passed over and the one before it decides; with none before it, nothing is tried again, and the
# run that left none shows why.
#
# Three jobs, because no job may both hold a write token and run code nobody has reviewed yet -- the
# rule "dependabot-auto-merge.yml" is built on. A freshly bumped PyYAML or Jinja2 is such code:
# Dependabot's updates merge themselves once CI is green, and the script imports both.
#
#   "gate"     holds a token that reads the Actions records and nothing else, and none of the keys.
#              It checks nothing out, and decides whether this attempt runs (above).
#   "read"     holds the providers' keys and a READ-ONLY token. It checks main out, installs
#              PyYAML and Jinja2, runs the script, and hands the texts, the edited template and the
#              proposals to the next job as an artifact, and six values as job outputs; it writes the
#              report to the run's summary, and uploads the artifact whose name is its outcome.
#   "publish"  holds the token that writes, and none of the providers' keys. It checks nothing out
#              and runs nothing of this repository: it takes what it receives as data (a status
#              among three, the catalogues not read as words of a provider and a class, a coverage
#              among two, a flag among three, a count, a commit of
#              main, a template it uploads only once it has checked that it is main's own with
#              lines deleted, and rows of its "head" table written again in the one form that names
#              only models and providers the file has, for each pull request of additions a list
#              of a provider, an id and a name per model, from which it writes the template itself,
#              and, for the sheet corrections, a template it uploads only once it has checked that it
#              is main's own with the value of sheet lines replaced)
#              and calls the API. It builds the issue's text itself, from a provider of its table, a
#              class among five and the times the gate read from GitHub.
#
# The split bounds the token that writes, not the keys: "read" holds them next to those two
# libraries, so a bad release could send them anywhere. That is accepted: they open a list of models
# (one list request per provider per run, no model called), they are dedicated to this workflow and
# revocable without touching LiteLLM's own. What a compromised "read" can make "publish" do is open
# a pull request that deletes lines of the template and re-points a router among models and
# providers the template already has, open two that add entries of a fixed shape, modelled on the
# template's own (a key name and an address it already has, an id and a name of a narrow spelling),
# and one that replaces the value of sheet lines of entries it has (a count or a flag, which no template
# could run), which nothing but a person merges, and open an issue that names providers of its table --
# not push to main, which "contents: write" next to such code would otherwise allow. The ruleset that
# requires the checks already refuses a push of a commit no check has seen, which is one more
# reason, not the only one, for that split. Whether that pull request then merges by itself is
# for "dependabot-auto-merge.yml" to say.
#
# Never on a pull request, and from main: this is the one workflow that holds the providers' keys,
# and no job may hold them next to the code of a pull request, which nobody has reviewed yet. So it
# runs on a schedule and by hand, and every job refuses any ref but main -- a guard against a run
# started by mistake, no boundary against a person who can push here, who could dispatch an edited
# copy of this file from a branch, with the secrets. The offline half of the check, which needs no
# key, runs on every pull request in "ansible-ci.yml".
#
# What reaches a write call. Everything in a provider's answer is untrusted, and none of it is ever
# put in a command line, a branch name or an expression of this file: the script cleans what it
# shows (an id spelt unusually is not offered, a name is cut to plain words) and writes files, and
# the steps below read those files and take every other value from the environment. The branch has
# a fixed name, the title a fixed text, and an entry of the additions is written by "publish" from
# pieces it has validated, a provider of its table, an id and a name each of a narrow spelling, never
# from text it was handed. No key reaches the output either: a failed read is reported
# with its HTTP status and nothing else, a key found in an error is replaced, and a redirect is not
# followed, since the keys travel in the headers.
#
# Every provider the model list routes to has its catalogue read here, one that needs a key included, and
# the offline run fails on an active entry of a provider no reader covers (OmniRoute's virtual routes and the
# Auto router, which no catalogue lists, apart).
#
# Secrets, each optional. A provider without one is listed as "not covered (no key)" in the summary
# at every run, rather than skipped in silence; OpenRouter, Cerebras, SambaNova, Kilo Gateway, NVIDIA, OVHcloud
# and Requesty publish their catalogue without one and need none. A missing key is no failed read: it opens no
# issue and starts no retry.
#
#   MODEL_DRIFT_GEMINI_API_KEY    Google AI Studio -- "gemini/" entries, Gemma on Gemini included
#   MODEL_DRIFT_GROQ_API_KEY      Groq -- "groq/" entries
#   MODEL_DRIFT_MISTRAL_API_KEY   Mistral -- "mistral/" entries
#   MODEL_DRIFT_DEEPSEEK_API_KEY  DeepSeek, direct API -- "deepseek/" entries
#   MODEL_DRIFT_CLOUDFLARE_API_KEY
#   MODEL_DRIFT_CLOUDFLARE_ACCOUNT_ID
#                                 Cloudflare Workers AI -- "cloudflare/" entries. The only provider
#                                 that takes two, and the two are given together or the provider is
#                                 "not covered": the token, an API token of the account whose one
#                                 permission is Account > Workers AI > Read (the API reference also
#                                 lists "Workers AI Metadata Read" as enough), and the 32 characters
#                                 of the account's identifier, which its address carries and which
#                                 is replaced by "***" wherever a message could show it, like a key.
#                                 The identifier is no credential, and a secret all the same: it is the
#                                 account's, which no file of this repository names.
#   MODEL_DRIFT_ZAI_API_KEY       Z AI -- "zai/" entries. Its answer is read as the OpenAI-style list the
#                                 API is expected to give, which no run has read: the catalogue answers
#                                 401 without a key, and no session of this repository holds one.
#   MODEL_DRIFT_CENT_AI_API_KEY   Cent AI -- "openai/" entries on its "api_base". Read as Z AI's is.
#
# Announced retirements have a second source that needs no key: the "deprecation_date" of LiteLLM's
# public price map, which one request per run reads. It doubles what the providers' own APIs announce
# and speaks for those that announce nothing; when the two disagree the earliest day is kept and the
# summary and the body of the deletion pull request carry a warning naming both. It never deletes
# anything, and a map that cannot be read is reported as the error of that source alone: no retry, no
# issue, no effect on a deletion.
#
# One more, which is no provider's: MODEL_DRIFT_ARTIFICIAL_ANALYSIS_API_KEY, the free key of the
# Artificial Analysis API (https://artificialanalysis.ai/, 1,000 requests a day, one made per run).
# With it the pull requests of additions carry the intelligence, coding and speed figures of each NEW
# model and a place suggested per router, and a model it matches for certain can be ready;
# without it the report says "not covered" like for any key, no model is ready, and a failed read
# changes neither the status of the run nor what it deletes. Like the others it is held by the
# "read" job alone: "publish" never has it. Their terms ask for the source to be cited, which the
# summary and the pull requests of additions do, with the day the figures were read.
#
# Cost: three jobs of under a minute each, every day, and three gates of a few seconds, each job
# billed as a whole minute, which hosted runners do not charge on a public repository -- plus, when
# something is deleted or proposed, the checks of the pull requests, and two minutes more per retry
# that runs, on a day a catalogue fails. The providers' limits hold at that pace: the run makes one
# list request per provider, OpenRouter's is read without a key, and Artificial Analysis allows a
# thousand requests a day.
#
# The issue is found by a hidden marker in its body, among the issues this workflow's own token
# opened, under its title or the one it had while it reported every drift, so that one still open
# is closed or taken over: no label to create, and an issue somebody else writes is never
# overwritten. Its text is written by the "publish" job, and the same issue is reopened the next
# time.
#
# The pull request: one branch (REMOVALS_BRANCH, below), one pull request, assigned to tigerblue77
# and never a draft. The branch is main plus ONE commit, made through the API with the token the
# paragraphs below describe and rewritten at every run that finds something to delete, so that it
# follows main and what the providers list; the title and the body are rewritten with it, and an
# edit made to either by hand is lost at the next run. A run that finds nothing leaves the branch
# alone and closes an open pull request with a comment -- unless a provider could not be read or has
# no key, or a retired model was refused (UNDELETED), since "nothing to delete" would then only mean
# "nothing seen". A pull request closed by a person is replaced the next day while the
# providers still do not list the models. Whether it merges by itself is
# "dependabot-auto-merge.yml"'s to say; if it does not, tigerblue77 merges it or closes it.
#
# A person's commit on the branch freezes it, and the run FAILS to say so, every day, until the
# branch is deleted (the deletions are then made again from main): force-pushing over somebody's
# work, or closing what they are working on, is what a scheduled job must not do. The workflow's own
# commits are told by their author, "github-actions[bot]"; a merge commit is not somebody's work
# (the "Update branch" button and the merge fallback of "auto_update_pull_request_branches.yml" add
# one, and the next run rebuilds the branch without it). A person's commit that a squash or rebase
# merge left out of main's history keeps counting until the branch is deleted.
#
# Who writes the branch and the pull request. A push and a pull request made with GITHUB_TOKEN
# start no workflow of their own: GitHub holds the runs of such a pull request until a person
# approves them, never starts "sign-off", and does not tell "dependabot-auto-merge.yml" about a run
# this token dispatched, so the gate never hears of the pull request. Hence an optional GitHub App,
# like the keys above: the variable MODEL_DRIFT_APP_CLIENT_ID (the client ID shown on the App's
# settings page, not its App ID), the secret MODEL_DRIFT_APP_PRIVATE_KEY, and the variable
# MODEL_DRIFT_APP_SLUG, which only the gate reads. The App needs the repository permissions
# Contents and Pull requests, each read and write, and has to be installed on this repository.
# With it the branch and the pull request are written with a token of the App, narrowed to those
# two, and the assignee, which is an issue's, with GITHUB_TOKEN: GitHub then starts the pull
# request's checks itself, "sign-off" included, and tells the gate, which accepts the App's bot as
# the pull request's author beside the Actions bot. The private key reaches this job alone, which
# checks nothing out and runs no script of this repository. The issue keeps GITHUB_TOKEN too.
#
# Without the variable nothing changes and nothing breaks: the run writes with GITHUB_TOKEN and
# dispatches "ansible-ci.yml" and "gitleaks.yml" on the branch itself -- the one event that token
# can cause and still get a run for -- for every workflow with no run yet on the branch's head, so
# that a run that failed half way is repaired by the next. The list is the gate's own
# "WORKFLOW_FILES", which "check_required_checks.py" holds equal. The pull request then waits for a
# person's approval of its runs, and for a person's merge, which the ruleset allows only once
# "sign-off", which nothing starts for it, has succeeded: the App is what lets the model-deletion
# pull request merge at all. With the App those dispatches are not made, since they would only
# double the native runs. A token that could not be minted leaves that
# step red and the run in the fallback.
#
# The commit's author is the Actions bot in both modes, and the commit carries that bot's
# Signed-off-by, as Dependabot's do: the gate reads the author, and "sign-off" accepts a bot's own
# sign-off.
#
# The pull requests of additions, each on a fixed branch of its own (ADDITIONS_BRANCH and
# ADDITIONS_TO_VERIFY_BRANCH, below), are kept the same way: main plus one commit of the Actions bot,
# rebuilt at every run, written with the App's token when there is one, assigned to tigerblue77,
# their checks dispatched where no App writes them. They are split by how much the run knows of a
# model, never by its provider. The first, ready for review, holds the models of which it knows every
# fact an addition needs: a free tier its provider's API states (OpenRouter's ":free" at a price
# of 0, Kilo Gateway's "isFree", Requesty's prices of 0 in and out) and a figure of the ranking matched for certain: the end of the id, less ":free", spelt like
# the slug or name of one entry of the ranking and no other once case and punctuation are dropped,
# with no variant marker such as "(Reasoning)" on that entry. The second, opened as a draft, holds any
# model one of those facts is missing for, whatever its provider, with which one and how to get it --
# where GitHub refuses a draft, as it does on a private repository of its free plan, it is opened
# ready for review
# and its body alone says to wait. Every kind of model is written, not chat alone: an item that is no chat
# model carries its usage, and its entry its "model_info.mode" and the access group of that mode (embeddings,
# speech, transcription, decisions, extraction, and the kinds the gateway has no router or client for yet --
# images, videos, rerank, moderation, OCR -- which only the "to verify" one carries, with a line saying so).
# A model that is no chat one has no ranking: it is ready when its API states its free tier and the file
# already serves the usage through that provider. An active entry whose mode has a router is written with a slot at
# the tail of that router's cascade, under its provider's key condition (an entry that has a router is in a cascade); the places the body gives are suggestions, computed on a ranking that is under revision. The gate merges neither: it knows the branch of
# the deletions alone, and "check_auto_merge_gate.py" plays both branches against it. A person's
# commit on either means somebody is deciding, so the open pull request is left as it is, with no
# failure; a person's commit on a branch whose pull request is no longer open fails the run until the
# branch is deleted. A box ticked in a body stays ticked while its line does not change, and a
# branch that differs from the new build only by the days its comments were proposed on is kept, so
# that a run with nothing new pushes nothing and starts no check. Each closes,
# with a comment, when nothing is left to propose -- unless a source it draws on (a catalogue, and the
# ranking for the ready one) could not be read, or the report was not trusted.
#
# The pull request of the sheet corrections has a branch of its own (SHEETS_BRANCH, below), and is kept the
# same way: main plus one commit of the Actions bot, rebuilt at every run that still finds a difference,
# written with the App's token when there is one, ready for review, assigned to tigerblue77, its checks
# dispatched where no App writes them. Its commit replaces the value of a line "max_input_tokens",
# "max_output_tokens" or "supports_vision" of an entry's "model_info" by the one its provider's catalogue
# states, and changes nothing else. "publish" does not build that file as it builds the additions: it takes
# the one the script wrote, with the body and the commit message, and pushes it only if its "sheet guard"
# finds it equal to main's but for the value of such lines, each in the "model_info" of an entry. The gate
# merges nothing of it, and a person reads each value on the provider's page first, which the body says: a
# catalogue is not that page. A person's commit freezes it as it freezes the additions. It is closed, with
# a comment, when no difference is left -- unless the catalogue of a provider whose entries declare a sheet
# could not be read, the script left a difference to a person (it could not rewrite it), or the report was
# not trusted. CI can refuse it, when an entry sets a length the new sheet no longer allows, and its body
# says which entries.
#
# A report is trusted when the step that keeps the issue found what the "read" job handed over well
# formed: a status among three that agrees with the unreadable catalogues it names. That step runs
# whether or not it then writes anything, and the pull requests are closed only after it succeeded.
#
# Every job runs on GitHub's hosted runners, each thrown away after the job, so nothing a pull
# request's code left behind can run next to the keys or the token. The header of "ansible-ci.yml"
# says why hosted runners only.

on:
  # The first attempt, then the three retries; the gate numbers them in this order, from its
  # SCHEDULES, which "check_drift_publish_guard.py" holds equal to this list.
  schedule:
    - cron: "17 7 * * *"
    - cron: "17 9 * * *"
    - cron: "17 11 * * *"
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions: {}

# A manual run started while the scheduled one is going would otherwise race it to create the issue,
# and two issues would be the result -- or push the branch from under it. It also holds a retry
# until the attempt before it has ended, so that the gate finds that attempt's outcome.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  gate:
    name: decide whether this attempt runs
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The runs of this workflow and their artifacts' names, and nothing else: no key, no checkout.
    permissions:
      actions: read
    outputs:
      # "true" when this attempt reads the catalogues, "false" when it has nothing to do.
      run: ${{ steps.decide.outputs.run }}
      # The attempt of the day, 1 to 4; 1 for a run started by hand.
      attempt: ${{ steps.decide.outputs.attempt }}
      # "true" for the day's last scheduled attempt, the one that may open the issue.
      last: ${{ steps.decide.outputs.last }}
      # When the earlier attempts of the day that could not read a catalogue started, in UTC.
      earlier: ${{ steps.decide.outputs.earlier }}
    steps:
      - name: Find what the earlier attempts of the day ended with
        id: decide
        uses: actions/github-script@v9
        env:
          # The crons of "on.schedule", in their order: the place of the one that fired is the attempt.
          SCHEDULES: |
            17 7 * * *
            17 9 * * *
            17 11 * * *
            17 13 * * *
          # The "read" job names the artifact it uploads this, followed by "read" or "unreadable".
          OUTCOME_PREFIX: LiteLLM-model-drift-outcome-
        with:
          script: |
            // BEGIN gate
            // Whether this attempt has anything to do, from what GitHub lists and nothing else: the
            // cron that fired, and the names of the artifacts of the day's earlier scheduled runs. A
            // retry runs when the latest of them that recorded an outcome recorded "unreadable".
            // "check_drift_publish_guard.py" plays this code against made-up days; keep the markers.
            const { owner, repo } = context.repo;
            const prefix = process.env.OUTCOME_PREFIX;
            const schedules = process.env.SCHEDULES.split('\n').map((line) => line.trim()).filter(Boolean);
            const decide = (run, attempt, last, earlier) => {
              core.setOutput('run', run ? 'true' : 'false');
              core.setOutput('attempt', String(attempt));
              core.setOutput('last', last ? 'true' : 'false');
              core.setOutput('earlier', earlier.join(' '));
            };
            if (context.eventName !== 'schedule') {
              core.notice('A run started by hand is one attempt: it reads every catalogue once, may close the issue and never opens it.');
              decide(true, 1, false, []);
              return;
            }
            const attempt = schedules.indexOf(context.payload.schedule) + 1;
            if (attempt === 0) {
              core.setFailed(`The schedule "${context.payload.schedule}" is none of SCHEDULES: give it its place there.`);
              decide(false, 0, false, []);
              return;
            }
            if (attempt === 1) {
              decide(true, 1, false, []);
              return;
            }
            const { data: current } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: context.runId });
            const day = current.created_at.slice(0, 10);
            const { data: listed } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: current.workflow_id, event: 'schedule', created: `>=${day}`, per_page: 100,
            });
            // The day's earlier scheduled runs, the latest first. A run started by hand is no attempt
            // of the chain, and a run of another day belongs to another chain.
            const before = listed.workflow_runs
              .filter((run) => run.event === 'schedule' &&
                run.created_at.slice(0, 10) === day && run.created_at < current.created_at)
              .sort((a, b) => (a.created_at < b.created_at ? 1 : -1));
            const outcomes = [];
            for (const run of before) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id: run.id, per_page: 100 });
              const names = data.artifacts.map((artifact) => artifact.name).filter((name) => name.startsWith(prefix));
              const outcome = names.length === 1 ? names[0].slice(prefix.length) : null;
              if (['read', 'unreadable'].includes(outcome)) outcomes.push({ run, outcome });
            }
            if (outcomes.length === 0) {
              core.notice(`Attempt ${attempt}: no earlier attempt of the day left an outcome, so there is nothing to try again.`);
              decide(false, attempt, false, []);
              return;
            }
            if (outcomes[0].outcome !== 'unreadable') {
              core.notice(`Attempt ${attempt}: the attempt before read every catalogue, so there is nothing to try again.`);
              decide(false, attempt, false, []);
              return;
            }
            const earlier = outcomes.filter((each) => each.outcome === 'unreadable')
              .map((each) => (each.run.run_started_at ?? each.run.created_at).replace(/\.[0-9]+Z$/, 'Z')).reverse();
            core.notice(`Attempt ${attempt}: the attempt before could not read a catalogue, so this one reads them again.`);
            decide(true, attempt, attempt === schedules.length, earlier);
            // END gate

  read:
    name: read the providers' catalogues
    needs: gate
    if: ${{ github.ref == 'refs/heads/main' && needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The keys, and no write. Checking out needs to read.
    permissions:
      contents: read
    env:
      # The script links the pull requests by them (pulls_link, branch_link). Fixed here and in the
      # next job, and nowhere else; the gate knows the first alone.
      REMOVALS_BRANCH: claude/LiteLLM-model-drift-removals
      ADDITIONS_BRANCH: claude/LiteLLM-model-additions
      ADDITIONS_TO_VERIFY_BRANCH: claude/LiteLLM-model-additions-to-verify
      SHEETS_BRANCH: claude/LiteLLM-model-drift-sheets
    outputs:
      # 0 no drift, 1 drift, 2 a provider could not be read.
      status: ${{ steps.drift.outputs.status }}
      # "<provider>:<class>" per catalogue that could not be read, space-separated, or nothing.
      unreadable: ${{ steps.drift.outputs.unreadable }}
      # "complete" when every provider's catalogue was read, "partial" otherwise.
      covered: ${{ steps.drift.outputs.covered }}
      # How many retired models the script did not delete, or "unknown".
      undeleted: ${{ steps.drift.outputs.undeleted }}
      # "true" when the template was changed, "false" when not, "invalid" when something else was.
      changed: ${{ steps.changes.outputs.changed }}
      # The commit of main the deletions were made on.
      base: ${{ steps.changes.outputs.base }}
    steps:
      - name: Check main out
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      # PyYAML and Jinja2 alone, each at the version requirements.txt pins, rather than the whole
      # file: the script reads the model list with the first and renders it with the second, needs
      # nothing else, and ansible-core and ansible-lint would triple the job's length for nothing.
      # Read from the file, so each pin still has one home, and Dependabot still moves them. A pin
      # line missing from the file leaves pip an empty requirement, which it refuses.
      - name: Install PyYAML and Jinja2
        run: pip install "$(grep -E '^PyYAML==' requirements.txt)" "$(grep -E '^Jinja2==' requirements.txt)"

      # 0 no drift, 1 drift, 2 a provider could not be read: the next job handles all three, so
      # none of them fails this step. Anything else is a crash, and this step fails on it: the
      # script gives a crash a status of its own (70) because an uncaught exception would exit 1,
      # which is "drift", and the next job would act on a report nobody wrote.
      # "--apply" edits the checked-out model list in place and writes the pull request's body and
      # the commit's message, which do not exist when nothing was deleted. "--proposals" writes what
      # the two pull requests of additions are made of, built on main as it was checked out, "--sheets"
      # what the pull request of the sheet corrections is made of, built on it too,
      # "--summary" the whole report, which goes to the run's summary, and "--unreadable" the
      # catalogues it could not read, or no file when the model list itself could not be read. All
      # of it goes to one directory, which is what the next job receives.
      - name: Compare the model list with every provider's catalogue, and delete what they retired
        id: drift
        env:
          ATTEMPT: ${{ needs.gate.outputs.attempt }}
          EVENT: ${{ github.event_name }}
          MODEL_DRIFT_GEMINI_API_KEY: ${{ secrets.MODEL_DRIFT_GEMINI_API_KEY }}
          MODEL_DRIFT_GROQ_API_KEY: ${{ secrets.MODEL_DRIFT_GROQ_API_KEY }}
          MODEL_DRIFT_MISTRAL_API_KEY: ${{ secrets.MODEL_DRIFT_MISTRAL_API_KEY }}
          MODEL_DRIFT_DEEPSEEK_API_KEY: ${{ secrets.MODEL_DRIFT_DEEPSEEK_API_KEY }}
          MODEL_DRIFT_CLOUDFLARE_API_KEY: ${{ secrets.MODEL_DRIFT_CLOUDFLARE_API_KEY }}
          MODEL_DRIFT_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.MODEL_DRIFT_CLOUDFLARE_ACCOUNT_ID }}
          MODEL_DRIFT_ZAI_API_KEY: ${{ secrets.MODEL_DRIFT_ZAI_API_KEY }}
          MODEL_DRIFT_CENT_AI_API_KEY: ${{ secrets.MODEL_DRIFT_CENT_AI_API_KEY }}
          MODEL_DRIFT_ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.MODEL_DRIFT_ARTIFICIAL_ANALYSIS_API_KEY }}
        run: |
          out="$RUNNER_TEMP/drift"
          mkdir -p "$out"
          status=0
          python3 .github/scripts/check_LiteLLM_model_drift.py --online --apply \
            --summary "$out/summary.md" \
            --unreadable "$out/unreadable.txt" \
            --pr-body "$out/pull_request.md" \
            --commit-message "$out/commit.txt" \
            --coverage "$out/coverage.txt" \
            --undeleted "$out/undeleted.txt" \
            --proposals "$out/proposals" \
            --sheets "$out/sheets" || status=$?
          if [ -f "$out/summary.md" ]; then
            {
              if [ "$EVENT" = schedule ]; then
                echo "Tentative $ATTEMPT sur 4 du jour, état de sortie $status."
              else
                echo "Exécution lancée à la main, une seule tentative, état de sortie $status."
              fi
              echo
              cat "$out/summary.md"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          case "$status" in
            0 | 1 | 2) ;;
            *)
              echo "::error::The drift check exited $status, which is neither 0, 1 nor 2: it crashed, and there is no report to trust. Its log is above."
              exit 1
              ;;
          esac
          covered=partial
          if [ -f "$out/coverage.txt" ]; then
            covered="$(tr -d '[:space:]' < "$out/coverage.txt")"
          fi
          undeleted=unknown
          if [ -f "$out/undeleted.txt" ]; then
            undeleted="$(tr -d '[:space:]' < "$out/undeleted.txt")"
          fi
          # One line per catalogue becomes one word, so that nothing the script wrote can start an
          # output of its own; the next job checks each word against the providers it knows.
          unreadable=unknown
          outcome=
          if [ -f "$out/unreadable.txt" ]; then
            unreadable="$(awk 'NF { printf "%s%s:%s", (n++ ? " " : ""), $1, $2 }' "$out/unreadable.txt")"
            outcome=read
            if [ -n "$unreadable" ]; then
              outcome=unreadable
            fi
            echo "$outcome $unreadable" > "$RUNNER_TEMP/outcome.txt"
          fi
          {
            echo "status=$status"
            echo "unreadable=$unreadable"
            echo "outcome=$outcome"
            echo "covered=$covered"
            echo "undeleted=$undeleted"
          } >> "$GITHUB_OUTPUT"

      # The one thing a retry cannot cure and the issue is not for: the template is on main, where
      # the offline check of every pull request reads it, and this red run is what says it broke.
      - name: Stop when the model list itself could not be read
        if: ${{ steps.drift.outputs.unreadable == 'unknown' }}
        run: |
          echo "::error::The model list could not be read, so no catalogue was compared and nothing is published. The run's summary says why."
          exit 1

      # What the next attempt's gate reads, by its name alone: a day is enough, since the chain ends
      # with the day.
      - name: Record what this attempt ended with, for the next one
        if: ${{ steps.drift.outputs.outcome != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: LiteLLM-model-drift-outcome-${{ steps.drift.outputs.outcome }}
          path: ${{ runner.temp }}/outcome.txt
          if-no-files-found: error
          retention-days: 1

      # What the script changed in the checkout. It edits one file and no other: anything else
      # modified here is a bug to stop at, not a change to push, and the next job says so.
      - name: Find what the deletions changed
        id: changes
        run: |
          changed="$(git status --porcelain --untracked-files=no)"
          if [ -z "$changed" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [ "$changed" = " M templates/LiteLLM_config.yaml.j2" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            cp templates/LiteLLM_config.yaml.j2 "$RUNNER_TEMP/drift/LiteLLM_config.yaml.j2"
          else
            echo "::error::The drift check changed something other than templates/LiteLLM_config.yaml.j2. Nothing will be pushed."
            echo "changed=invalid" >> "$GITHUB_OUTPUT"
          fi
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Hand the texts to the job that writes
        uses: actions/upload-artifact@v7
        with:
          name: LiteLLM-model-drift
          path: ${{ runner.temp }}/drift
          if-no-files-found: error
          retention-days: 1


  publish:
    name: publish the issue and the pull requests
    needs: [gate, read]
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The token that writes, and none of the providers' keys; the App's private key, when there is
    # one, reaches this job alone. This job checks nothing out, installs nothing and runs no script
    # of this repository.
    permissions:
      # The branches and their commit, written through the API.
      contents: write
      # The deletion pull request, the two of additions and the one of sheet corrections: opened,
      # updated, or closed.
      pull-requests: write
      # The issue, and the pull requests' assignee, which is an issue's.
      issues: write
      # Dispatching "ansible-ci.yml" and "gitleaks.yml" on the branches where no App writes the pull
      # requests, whose checks this token then starts none of; and downloading the artifact.
      actions: write
    env:
      REMOVALS_BRANCH: claude/LiteLLM-model-drift-removals
      ADDITIONS_BRANCH: claude/LiteLLM-model-additions
      ADDITIONS_TO_VERIFY_BRANCH: claude/LiteLLM-model-additions-to-verify
      SHEETS_BRANCH: claude/LiteLLM-model-drift-sheets
    steps:
      - name: Receive what the other job made
        id: receive
        uses: actions/download-artifact@v8
        with:
          name: LiteLLM-model-drift
          path: ${{ runner.temp }}/drift

      # github-script rather than gh, for the reason "dependabot-auto-merge.yml" gives: the runner's
      # own Node is the one thing every runner is guaranteed to have.
      - name: Open, update or close the issue of the unreadable catalogues
        id: issue
        uses: actions/github-script@v9
        env:
          DRIFT_STATUS: ${{ needs.read.outputs.status }}
          UNREADABLE: ${{ needs.read.outputs.unreadable }}
          LAST_ATTEMPT: ${{ needs.gate.outputs.last }}
          EARLIER: ${{ needs.gate.outputs.earlier }}
        with:
          script: |
            // BEGIN issue
            // Opened or updated for one thing only, a catalogue still unreadable at the day's last
            // scheduled attempt, and closed by the first run that reads every catalogue. Its text is
            // made here, from what is checked first: a provider of the table, a class of the five, the
            // times the gate read from GitHub. "check_drift_publish_guard.py" plays this code against
            // made-up issues; keep the markers.
            const { owner, repo } = context.repo;
            const marker = '<!-- LiteLLM-model-drift -->';
            const title = 'Catalogue de fournisseur illisible pour la liste de modèles LiteLLM';
            // The title the issue had while it reported every drift: one still open is closed by the
            // first run that reads every catalogue, or taken over.
            const titles = [title, 'Dérive de la liste de modèles LiteLLM'];
            const assignee = 'tigerblue77';
            const PROVIDERS = {
              openrouter: 'OpenRouter', cerebras: 'Cerebras', sambanova: 'SambaNova', gemini: 'Gemini',
              groq: 'Groq', mistral: 'Mistral', deepseek: 'DeepSeek', cloudflare: 'Cloudflare', kilo: 'Kilo Gateway',
              nvidia: 'NVIDIA', ovhcloud: 'OVHcloud', requesty: 'Requesty', zai: 'Z AI', centai: 'Cent AI', aionlabs: 'Aion Labs',
            };
            const CLASSES = {
              '3xx': 'HTTP 3xx : une redirection, que le contrôle ne suit jamais puisque la clé voyage dans les en-têtes',
              '4xx': 'HTTP 4xx : la requête est refusée, en général pour une clé invalide, expirée ou révoquée (Gemini répond 400 à une clé invalide)',
              '5xx': 'HTTP 5xx : une erreur du fournisseur',
              network: 'aucune réponse : une erreur de réseau ou un délai dépassé',
              answer: 'une réponse illisible : pas du JSON, vide de liste, ou d\'une forme que le contrôle ne lit pas',
            };
            const status = process.env.DRIFT_STATUS;
            const words = (text) => (text ?? '').trim().split(/\s+/).filter(Boolean);
            const unread = [];
            for (const word of words(process.env.UNREADABLE)) {
              const match = /^([a-z]+):([0-9a-z]+)$/.exec(word);
              if (!match || !Object.hasOwn(PROVIDERS, match[1]) || !Object.hasOwn(CLASSES, match[2]) ||
                  unread.some((each) => each.provider === match[1])) {
                core.setFailed(`The drift check named "${word.slice(0, 60)}" as a catalogue it could not read, which is no provider and class this step knows: there is no report to trust.`);
                return;
              }
              unread.push({ provider: match[1], kind: match[2] });
            }
            if (!['0', '1', '2'].includes(status) || (status === '2') !== (unread.length > 0)) {
              core.setFailed(`The drift check reported the status "${status}" and ${unread.length} catalogue(s) it could not read, which do not agree: there is no report to trust.`);
              return;
            }
            const earlier = words(process.env.EARLIER);
            if (earlier.some((time) => !/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$/.test(time))) {
              core.setFailed('The gate handed over a time of an earlier attempt that is no time: there is no report to trust.');
              return;
            }

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', per_page: 100,
            });
            const existing = issues
              .filter((issue) => !issue.pull_request &&
                issue.user?.login === 'github-actions[bot]' &&
                titles.includes(issue.title) &&
                (issue.body ?? '').includes(marker))
              .sort((a, b) => a.number - b.number)[0];
            const link = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const day = new Date().toISOString().slice(0, 10);

            if (unread.length === 0) {
              if (existing && existing.state === 'open') {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: `Fermée par le workflow : l'exécution du ${day} (${link}) a lu le catalogue de chaque fournisseur. Elle se rouvrira si une prochaine exécution ne peut toujours pas en lire un à sa dernière tentative.`,
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: existing.number, state: 'closed', state_reason: 'completed',
                });
                core.notice(`Every catalogue was read: #${existing.number} closed.`);
              } else {
                core.notice('Every catalogue was read, and no issue is open: nothing to do.');
              }
              return;
            }
            const named = unread.map((each) => PROVIDERS[each.provider]).join(', ');
            if (process.env.LAST_ATTEMPT !== 'true') {
              core.warning(context.eventName === 'schedule'
                ? `${named} could not be read: the next attempt, two hours from now, reads every catalogue again, and only the last one of the day opens the issue.`
                : `${named} could not be read: a run started by hand opens no issue, and its summary says what failed.`);
              return;
            }

            const body = [
              marker,
              '',
              `Le workflow \`.github/workflows/LiteLLM_model_drift.yml\` n'a pas pu lire le catalogue de ces fournisseurs à la dernière tentative du jour, l'[exécution du ${day}](${link}) :`,
              '',
              '| Fournisseur | Échec |',
              '| --- | --- |',
              ...unread.map((each) => `| ${PROVIDERS[each.provider]} | ${CLASSES[each.kind]} |`),
              '',
              earlier.length > 0
                ? `Les tentatives précédentes du jour n'avaient pas pu lire un catalogue non plus ; elles ont démarré à ${earlier.map((time) => `\`${time}\``).join(', ')} (UTC).`
                : 'Aucune tentative précédente du jour n\'a laissé de résultat.',
              '',
              'Tant qu\'un catalogue n\'est pas lu, rien n\'est supprimé pour son fournisseur, et les pull requests qui en dépendent restent ouvertes ; le reste de l\'exécution se fait comme les autres exécutions, et son résumé donne le rapport entier. Une clé qui manque n\'ouvre pas cette issue : le résumé la dit « non couverte ».',
              '',
              'Ce texte est réécrit chaque jour où la dernière tentative échoue encore, et l\'issue se ferme d\'elle-même à la première exécution qui lit le catalogue de chaque fournisseur.',
              '',
            ].join('\n');
            if (existing) {
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, title, body, state: 'open',
              });
              await github.rest.issues.addAssignees({
                owner, repo, issue_number: existing.number, assignees: [assignee],
              });
              core.notice(`The unreadable catalogues are reported in #${existing.number}.`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner, repo, title, body, assignees: [assignee],
              });
              core.notice(`The unreadable catalogues are reported in the new issue #${created.number}.`);
            }
            // END issue

      # Only when the App is configured: without the variable there is nothing to mint from, the
      # step is skipped, and the next one writes with GITHUB_TOKEN. Narrowed to what that step
      # calls -- the branches and their commits, and the pull requests -- whatever more the App was
      # granted; scoped by the action's default to this repository alone, and revoked when the job
      # ends. The pull requests' assignee is an issue's and is set by the step after, with
      # GITHUB_TOKEN, so the App is not asked for the Issues permission. The pull requests of
      # additions and the sheet corrections are written with it too, so that their checks start by
      # themselves; the gate, which knows the branch of the deletions alone, merges none of them.
      - name: Mint an installation token, if a GitHub App is configured
        id: app-token
        if: ${{ vars.MODEL_DRIFT_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MODEL_DRIFT_APP_CLIENT_ID }}
          private-key: ${{ secrets.MODEL_DRIFT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # The gate recognises the App's pull request by the slug in MODEL_DRIFT_APP_SLUG, and nothing
      # else reads it: a slug that is not the App's would leave every pull request it opens waiting
      # for a person, and the token above, which does not use it, would have worked all the same.
      # The action says which App the token is of, so the two are compared on every run.
      - name: Check that MODEL_DRIFT_APP_SLUG is the App's slug
        if: ${{ steps.app-token.outputs.token != '' }}
        env:
          ACTUAL: ${{ steps.app-token.outputs.app-slug }}
          DECLARED: ${{ vars.MODEL_DRIFT_APP_SLUG }}
        run: |
          if [ -z "$ACTUAL" ]; then
            echo "::warning::The action named no App slug, so MODEL_DRIFT_APP_SLUG (\"$DECLARED\") was not checked."
          elif [ "$ACTUAL" != "$DECLARED" ]; then
            echo "::error::The App is \"$ACTUAL\" but the variable MODEL_DRIFT_APP_SLUG says \"$DECLARED\": the gate would not recognise its pull requests. Set the variable to $ACTUAL."
            exit 1
          else
            echo "The App is \"$ACTUAL\", as MODEL_DRIFT_APP_SLUG says."
          fi

      # Runs even if the issue step failed, since the two have nothing to do with each other, but not
      # without what the other job made. One step for the four pull requests, so that they share the
      # code that reads a branch, writes its commit, opens the pull request and dispatches its checks;
      # each is handled apart, and an error in one leaves the others to be done.
      - name: Open, update or close the drift pull requests
        id: pull-request
        if: ${{ !cancelled() && steps.receive.outcome == 'success' }}
        uses: actions/github-script@v9
        env:
          # "true" when the App's token writes: GitHub then starts the pull request's checks itself
          # and this step dispatches none. Anything else is the GITHUB_TOKEN fallback.
          NATIVE_CHECKS: ${{ steps.app-token.outputs.token != '' && 'true' || 'false' }}
          DRIFT_STATUS: ${{ needs.read.outputs.status }}
          COVERED: ${{ needs.read.outputs.covered }}
          # Whether the step that keeps the issue found the report well formed (see the header): a
          # pull request is closed over "nothing left to delete" or "nothing left to propose" only
          # on a report that was.
          ISSUE_OUTCOME: ${{ steps.issue.outcome }}
          CHANGED: ${{ needs.read.outputs.changed }}
          # How many retired models the script did not delete: a pull request is closed over
          # "nothing left to delete" only at "0".
          UNDELETED: ${{ needs.read.outputs.undeleted }}
          BASE_SHA: ${{ needs.read.outputs.base }}
          PR_BODY: ${{ runner.temp }}/drift/pull_request.md
          COMMIT_MESSAGE: ${{ runner.temp }}/drift/commit.txt
          TEMPLATE_FILE: ${{ runner.temp }}/drift/LiteLLM_config.yaml.j2
          # What the script proposes to add: "proposals.json", and per pull request its body, its
          # commit message and the template as the script built it.
          PROPOSALS: ${{ runner.temp }}/drift/proposals
          # What it proposes to correct: "sheets.json", and when a sheet can be rewritten the body, the
          # commit message and the template with those values rewritten.
          SHEETS: ${{ runner.temp }}/drift/sheets
          # The FILES of the workflows a pull request is checked by, which GITHUB_TOKEN starts none
          # of: the very list "dependabot-auto-merge.yml" dispatches after a merge, each carrying the
          # "workflow_dispatch" trigger. "check_required_checks.py" fails CI when the two differ.
          WORKFLOW_FILES: ansible-ci.yml gitleaks.yml
        with:
          # The App's token when there is one, GITHUB_TOKEN otherwise: a pull request is then the
          # App bot's or the Actions bot's, and the gate accepts both for the deletions alone.
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const baseBranch = 'main';
            const template = 'templates/LiteLLM_config.yaml.j2';
            const workflows = process.env.WORKFLOW_FILES.split(/\s+/).filter(Boolean);
            const bot = { name: 'github-actions[bot]', email: '41898282+github-actions[bot]@users.noreply.github.com' };
            const status = process.env.DRIFT_STATUS;
            const base = process.env.BASE_SHA;
            const same = (a, b) => (a ?? '').replace(/\r\n/g, '\n').trim() === (b ?? '').replace(/\r\n/g, '\n').trim();
            // The pull requests this step opened or updated, for the step that assigns them.
            const numbers = [];

            // BEGIN template guard
            // What the job that made the template may hand over: the template on the commit it worked
            // on with lines taken out, and with rows of its "head" table written again. A row is the
            // one form "'router': 'name' if has.Provider else ... else 'name'" (or "false"), for a
            // router the table already has, naming only models that are entries of the file handed
            // over and providers the template's "has" table declares: nothing a template could run.
            // Anything else added or changed, or any line out of its order, is refused. Returns why,
            // or null. "check_drift_publish_guard.py" plays this function; keep the markers.
            const HEAD_BLOCK = /\{%-?\s*set\s+head\s*=\s*\{([\s\S]*?)\}\s*-?%\}/;
            const HAS_BLOCK = /\{%-?\s*set\s+has\s*=\s*\{([\s\S]*?)\}\s*-?%\}/;
            const HEAD_ROW = /^([ \t]*)'([^']+)'[ \t]*:[ \t]*((?:'[^']+'[ \t]+if[ \t]+has\.\w+[ \t]+else[ \t]+)*(?:'[^']+'|false))(,?)[ \t]*$/;
            const headRows = (text) => {
              const block = HEAD_BLOCK.exec(text);
              const rows = new Map();
              for (const line of block ? block[1].split('\n') : []) {
                const row = HEAD_ROW.exec(line);
                if (row) rows.set(row[2], line);
              }
              return rows;
            };
            const declaredProviders = (text) => {
              const block = HAS_BLOCK.exec(text);
              return new Set(block ? [...block[1].matchAll(/^[ \t]*'(\w+)'[ \t]*:/gm)].map((m) => m[1]) : []);
            };
            const entryNames = (text) =>
              new Set([...text.matchAll(/^[ \t]*-[ \t]+model_name:[ \t]*(\S+)[ \t]*$/gm)].map((m) => m[1]));
            const templateProblem = (baseText, newText) => {
              const baseLines = baseText.split('\n');
              const rows = headRows(baseText);
              const providers = declaredProviders(baseText);
              const names = entryNames(newText);
              let at = 0;
              for (const line of newText.split('\n')) {
                let wanted = line;
                const row = HEAD_ROW.exec(line);
                const original = row ? rows.get(row[2]) : undefined;
                if (original !== undefined && original !== line) {
                  for (const term of row[3].matchAll(/'([^']+)'(?:[ \t]+if[ \t]+has\.(\w+))?/g)) {
                    if (!names.has(term[1])) return `the row of "${row[2]}" names "${term[1]}", which is no entry of the file`;
                    if (term[2] !== undefined && !providers.has(term[2])) return `the row of "${row[2]}" tests the provider "${term[2]}", which the template does not declare`;
                  }
                  wanted = original;
                }
                while (at < baseLines.length && baseLines[at] !== wanted) at += 1;
                if (at === baseLines.length) return `it holds a line the base does not hold, or holds the lines in another order: ${line.slice(0, 120)}`;
                at += 1;
              }
              return null;
            };
            // END template guard

            // BEGIN sheet guard
            // What the job that made the template may hand over for the pull request of the sheet
            // corrections: the template on the commit it worked on with the value of lines written
            // again, each a "max_input_tokens", "max_output_tokens" or "supports_vision" line of the
            // "model_info" of an entry, kept as it is but for that value (a positive whole number, or
            // true or false for the image flag). A line added, removed or changed otherwise, a changed
            // key, indentation or comment, a line outside the "model_info" of an entry, is refused.
            // Returns why, or null. "check_drift_publish_guard.py" plays this function; keep the markers.
            const SHEET_LINE = /^([ \t]+)(max_input_tokens|max_output_tokens|supports_vision):([ \t]+)([0-9]+|true|false)((?:[ \t]+#.*)?[ \t]*)$/;
            const sheetValueFits = (key, value) =>
              (key === 'supports_vision' ? /^(true|false)$/ : /^[1-9][0-9]{0,11}$/).test(value);
            const sheetIndent = (line) => line.length - line.trimStart().length;
            const sheetParent = (lines, index) => {
              const own = sheetIndent(lines[index]);
              for (let at = index - 1; at >= 0; at -= 1) {
                if (lines[at].trim() === '' || /^\s*#/.test(lines[at])) continue;
                if (sheetIndent(lines[at]) < own) return { at, line: lines[at] };
              }
              return null;
            };
            const sheetProblem = (baseText, newText) => {
              if (typeof baseText !== 'string' || typeof newText !== 'string') return 'a template is no text';
              if (baseText.includes('\r') || newText.includes('\r')) return 'a template holds a carriage return';
              const before = baseText.split('\n');
              const after = newText.split('\n');
              if (before.length !== after.length) return `it has ${after.length} lines and the base ${before.length}: a line was added or removed`;
              for (let index = 0; index < before.length; index += 1) {
                if (before[index] === after[index]) continue;
                const was = SHEET_LINE.exec(before[index]);
                const now = SHEET_LINE.exec(after[index]);
                if (!was || !now) return `line ${index + 1} is changed and is not a sheet line of the base: ${after[index].slice(0, 120)}`;
                if (was[1] !== now[1] || was[2] !== now[2] || was[3] !== now[3] || was[5] !== now[5]) return `line ${index + 1} changes more than the value of its sheet field`;
                if (!sheetValueFits(was[2], was[4]) || !sheetValueFits(now[2], now[4])) return `line ${index + 1} gives ${now[2]} a value that is no positive whole number or flag`;
                const info = sheetParent(before, index);
                if (!info || !/^\s*model_info:\s*(?:#.*)?$/.test(info.line)) return `line ${index + 1} is not in a model_info`;
                const entry = sheetParent(before, info.at);
                if (!entry || !/^\s*-\s+model_name:\s*\S+\s*$/.test(entry.line)) return `line ${index + 1} is in a model_info that is no entry's`;
              }
              return null;
            };
            // END sheet guard

            // BEGIN additions builder
            // The template an addition pull request carries, built here from nothing but what each
            // item names once it is validated: a provider of this table, an id spelt like one and a
            // name spelt like the file's, which no word of the template already is. Each entry copies
            // the key and the base of its provider's last entry (its last active one, else its last
            // commented-out one, which it then follows commented out), so that no key name and no
            // address can come from elsewhere, and is written after that entry, under a comment of a
            // fixed text, in no cascade. An item with a "usage" other than chat (ADDITION_USAGES) is modelled on
            // the provider's last entry of that usage's mode instead, falling back on its last entry of no mode,
            // and is written with that mode and its access group. A provider with "free" states its free tier in that catalogue,
            // and only its models can be ready, those of one with a "freeSuffix" only when their id ends
            // in it. A "keyless" provider's key is a literal marker, copied, and its entry always blanks
            // the Authorization header, which the gateway refuses a bearer marker for. A provider with a "group" is
            // one whose models are kept out of "LLM" on purpose, and its entry is written in that group, whatever its mode. Every
            // provider has a "data" group, written after the first: what its terms do with the data sent to it
            // ("Private-Data", or "Public-Data-Only" where it is not read or not good enough). Returns { text } or { problem }. "check_drift_publish_guard.py" plays these functions, and holds
            // them to the script's own build_additions; keep the markers.
            const ADDITION_PROVIDERS = {
              openrouter: { prefix: 'openrouter/', label: 'OpenRouter', free: 'openrouter.ai/api/v1/models', freeSuffix: ':free', data: 'Public-Data-Only' },
              cerebras: { prefix: 'cerebras/', label: 'Cerebras', data: 'Public-Data-Only' },
              sambanova: { prefix: 'openai/', label: 'SambaNova', data: 'Public-Data-Only' },
              gemini: { prefix: 'gemini/', label: 'Gemini', data: 'Private-Data' },
              groq: { prefix: 'groq/', label: 'Groq', data: 'Public-Data-Only' },
              mistral: { prefix: 'mistral/', label: 'Mistral', data: 'Private-Data' },
              deepseek: { prefix: 'deepseek/', label: 'DeepSeek', data: 'Public-Data-Only' },
              cloudflare: { prefix: 'cloudflare/', label: 'Cloudflare', data: 'Private-Data' },
              kilo: { prefix: 'openai/', label: 'Kilo Gateway', free: 'ai-gateway.kilo.ai/api/v1/models', keyless: true, data: 'Public-Data-Only' },
              nvidia: { prefix: 'nvidia_nim/', label: 'NVIDIA', data: 'Public-Data-Only' },
              ovhcloud: { prefix: 'openai/', label: 'OVHcloud', keyless: true, data: 'Private-Data' },
              requesty: { prefix: 'openai/', label: 'Requesty', free: 'router.eu.requesty.ai/v1/models', data: 'Public-Data-Only' },
              zai: { prefix: 'zai/', label: 'Z AI', data: 'Public-Data-Only' },
              centai: { prefix: 'openai/', label: 'Cent AI', data: 'Public-Data-Only' },
              aionlabs: { prefix: 'openai/', label: 'Aion Labs', group: 'Fiction', data: 'Private-Data' },
            };
            // The usages other than chat an item may carry, each with the "model_info.mode" and the access
            // group the template holds its entries to (check_compose_template.py). The first five are served
            // by a router or a client of the gateway; the others are kinds of model it has none for yet, written
            // all the same so that a person keeps one or turns it down. A model served by LiteLLM's chat route
            // whatever it does (a voice, an agent, a music model) is an item with no usage, written as chat.
            // A provider with a "group" of its own is in that group whatever the mode.
            const ADDITION_USAGES = {
              embeddings: { mode: 'embedding', group: 'Embeddings' },
              speech: { mode: 'audio_speech', group: 'TTS' },
              transcription: { mode: 'audio_transcription', group: 'STT' },
              decision: { mode: 'evaluation', group: 'Decisions' },
              extraction: { mode: 'extraction', group: 'Extraction' },
              image: { mode: 'image_generation', group: 'Images' },
              video: { mode: 'video_generation', group: 'Videos' },
              rerank: { mode: 'rerank', group: 'Rerank' },
              moderation: { mode: 'moderation', group: 'Moderation' },
              ocr: { mode: 'ocr', group: 'OCR' },
            };
            // An "api_base" read whole from the environment, which only Cloudflare's embeddings carry: they go
            // through its OpenAI-compatible endpoint, whose address holds the account's identifier.
            const ADDITION_ENV_BASES = { 'os.environ/CLOUDFLARE_EMBEDDINGS_API_BASE': 'cloudflare' };
            // The cascade an active entry is given a slot in, at its tail: an entry whose mode has a router is in
            // a cascade, or the template fails its checks. A text entry goes to "Auto-Flash-Lite", Aion Labs' to
            // the router of their own, a typed one to the router of its mode; embeddings and the kinds the gateway
            // has no router for get none. "providers" are those a router routes to, and "slotIf" the condition a
            // provider's members are written under in a cascade (null for a provider that needs no key).
            const ADDITION_ROUTERS = {
              'flash-lite': { name: 'Auto-Flash-Lite' },
              stt: { name: 'Auto-STT', providers: ['groq', 'gemini', 'mistral'] },
              tts: { name: 'Auto-TTS', providers: ['gemini'] },
              decision: { name: 'Auto-Decision', providers: ['cloudflare'] },
              extraction: { name: 'Auto-Extraction', providers: ['cloudflare'] },
              fiction: { name: 'Auto-Fiction', providers: ['aionlabs'] },
            };
            const ADDITION_ROUTER_OF_USAGE = { chat: 'flash-lite', speech: 'tts', transcription: 'stt', decision: 'decision', extraction: 'extraction' };
            const ADDITION_SLOT_CONDITIONS = {
              gemini: 'has.Gemini', mistral: 'has.Mistral', groq: 'has.Groq', openrouter: 'has.OpenRouter', deepseek: 'has.DeepSeek',
              cloudflare: 'has.Cloudflare', zai: 'has.Zai', requesty: 'has.Requesty', nvidia: 'has.NVIDIA', centai: 'has.Cent_AI',
              aionlabs: 'has.Aion_Labs', kilo: null, ovhcloud: null,
            };
            const slotRouter = (provider, usage) => {
              if (provider === 'aionlabs') return usage === 'chat' ? 'fiction' : null;
              return Object.hasOwn(ADDITION_ROUTER_OF_USAGE, usage) ? ADDITION_ROUTER_OF_USAGE[usage] : null;
            };
            const slotRefusal = (provider, usage) => {
              const router = slotRouter(provider, usage);
              if (router === null) return null;
              const providers = ADDITION_ROUTERS[router].providers;
              if (providers !== undefined && !providers.includes(provider)) return `${provider} is not one of the providers of the ${ADDITION_ROUTERS[router].name} router, which exists only when one of them has a key`;
              if (!Object.hasOwn(ADDITION_SLOT_CONDITIONS, provider)) return `${provider} has no key variable to write a slot under`;
              return null;
            };
            const slotLines = (provider, router, name) => {
              const condition = ADDITION_SLOT_CONDITIONS[provider];
              const providers = ADDITION_ROUTERS[router].providers;
              if (condition === null || (providers !== undefined && providers.length === 1 && providers[0] === provider)) return [`        - ${name}`];
              return [`{% if ${condition} %}`, `        - ${name}`, '{% endif %}'];
            };
            // The index of the line a slot at the tail of a router's cascade is written before: the "endif"
            // that closes the router's own block, or the first line that is no member. null without such a
            // cascade, and -1 for one that cannot be read (an else branch).
            const cascadeTail = (lines, router) => {
              const heading = `    - ${ADDITION_ROUTERS[router].name}:`;
              const start = lines.findIndex((line) => line.trimEnd() === heading);
              if (start < 0) return null;
              let depth = 0;
              for (let index = start + 1; index < lines.length; index++) {
                const line = lines[index];
                if (/^\{%-?\s*(else|elif)\b.*%\}$/.test(line)) return -1;
                if (/^\{%-?\s*if\b.*%\}$/.test(line)) depth += 1;
                else if (/^\{%-?\s*endif\s*-?%\}$/.test(line)) {
                  if (depth === 0) return index;
                  depth -= 1;
                } else if (!/^        - [^\s#]+$/.test(line)) return index;
              }
              return lines.length;
            };
            const ADDITION_KINDS = ['ready', 'to_verify'];
            const ADDITION_LIMIT = 25;
            const ADDITION_ID = /^(?!.*(?:::|\/\/))(?:@cf\/)?[A-Za-z0-9][A-Za-z0-9._:\/+~-]{0,198}[A-Za-z0-9]$/;
            const ADDITION_NAME = /^[a-z0-9]+(?:-[a-z0-9]+)*$/;
            const ADDITION_KEY = /^os\.environ\/[A-Z][A-Z0-9_]*$/;
            const ADDITION_MARKER = /^[a-z][a-z0-9-]{0,63}$/;
            const ADDITION_BASE = /^https:\/\/[a-z0-9.-]+(?::[0-9]{1,5})?(?:\/[A-Za-z0-9._-]+)*\/?$/;
            const ADDITION_DATE = /^[0-9]{4}-[0-9]{2}-[0-9]{2}$/;
            const ADDITION_ENTRY = /^  (# )?- model_name: ([^\s#]+)\s*$/;
            const ADDITION_FIELD = /^\s+(model|api_key|api_base|mode):\s*(?:"([^"]*)"|(\S+))\s*$/;
            const providerOf = (model, apiBase) => {
              if (typeof model !== 'string' || !model.includes('/')) return null;
              const prefix = model.slice(0, model.indexOf('/'));
              if (['gemini', 'groq', 'mistral', 'deepseek', 'cerebras', 'openrouter', 'cloudflare', 'zai'].includes(prefix)) return prefix;
              if (prefix === 'nvidia_nim') return 'nvidia';
              if (prefix === 'openai' && typeof apiBase === 'string' && Object.hasOwn(ADDITION_ENV_BASES, apiBase)) return ADDITION_ENV_BASES[apiBase];
              if (prefix === 'openai' && typeof apiBase === 'string' && apiBase.includes('api.sambanova.ai')) return 'sambanova';
              if (prefix === 'openai' && typeof apiBase === 'string' && apiBase.includes('ai-gateway.kilo.ai')) return 'kilo';
              if (prefix === 'openai' && typeof apiBase === 'string' && apiBase.includes('oai.endpoints.kepler.ai.cloud.ovh.net')) return 'ovhcloud';
              if (prefix === 'openai' && typeof apiBase === 'string' && apiBase.includes('requesty.ai')) return 'requesty';
              if (prefix === 'openai' && typeof apiBase === 'string' && apiBase.includes('api.cent-ai.dev')) return 'centai';
              if (prefix === 'openai' && typeof apiBase === 'string' && apiBase.includes('api.aionlabs.ai')) return 'aionlabs';
              return null;
            };
            const additionEntries = (lines) => {
              const start = lines.indexOf('model_list:');
              if (start < 0) return null;
              let end = lines.findIndex((line, index) => index > start && /^[A-Za-z_][A-Za-z0-9_]*:/.test(line));
              if (end < 0) end = lines.length;
              const entries = [];
              for (let index = start + 1; index < end; index++) {
                const head = ADDITION_ENTRY.exec(lines[index]);
                if (!head) continue;
                const commented = head[1] !== undefined;
                const entry = { name: head[2], commented, fields: {}, last: index };
                const body = commented ? /^  # {2,}\S/ : /^ {4,}\S/;
                let at = index + 1;
                while (at < end && body.test(lines[at])) {
                  const field = ADDITION_FIELD.exec(commented ? lines[at].slice(4) : lines[at]);
                  if (field && !Object.hasOwn(entry.fields, field[1])) entry.fields[field[1]] = field[2] ?? field[3];
                  entry.last = at;
                  at += 1;
                }
                while (commented && at < end && /^  #( |$)/.test(lines[at])) {
                  entry.last = at;
                  at += 1;
                }
                entries.push(entry);
              }
              return entries;
            };
            const additionsTemplate = (baseText, date, kind, items) => {
              if (typeof baseText !== 'string' || baseText.includes('\r')) return { problem: 'the base template is not a text with plain line feeds' };
              if (typeof date !== 'string' || !ADDITION_DATE.test(date)) return { problem: 'the date is no date' };
              if (!ADDITION_KINDS.includes(kind)) return { problem: 'the kind is neither ready nor to_verify' };
              if (!Array.isArray(items) || items.length === 0 || items.length > ADDITION_LIMIT) return { problem: `there are no items, or more than ${ADDITION_LIMIT}` };
              const lines = baseText.split('\n');
              const entries = additionEntries(lines);
              if (!entries) return { problem: 'the base template has no "model_list:" line' };
              const words = new Set(baseText.match(/[A-Za-z0-9_.-]+/g) ?? []);
              const ignored = new Set([...baseText.matchAll(/^\s*#\s*drift-ignore\s*:\s*(\S+)\s+--/gm)].map((m) => m[1]));
              const known = new Set(entries.map((entry) => entry.fields.model).filter(Boolean));
              const names = new Set();
              const after = new Map();
              const slots = new Map();
              for (const item of items) {
                if (item === null || typeof item !== 'object' || Array.isArray(item) || !['id,name,provider', 'id,name,provider,usage'].includes(Object.keys(item).sort().join(','))) return { problem: 'an item is not {provider, id, name} or {provider, id, name, usage}' };
                const { provider, id, name } = item;
                if (typeof provider !== 'string' || !Object.hasOwn(ADDITION_PROVIDERS, provider)) return { problem: 'an item names no provider this reads' };
                const spec = ADDITION_PROVIDERS[provider];
                const hasUsage = Object.hasOwn(item, 'usage');
                if (hasUsage && (typeof item.usage !== 'string' || !Object.hasOwn(ADDITION_USAGES, item.usage))) return { problem: 'an item\'s usage is none the template has a mode for' };
                const usage = hasUsage ? ADDITION_USAGES[item.usage] : null;
                const embedsThroughEnv = provider === 'cloudflare' && item.usage === 'embeddings';
                const prefix = embedsThroughEnv ? 'openai/' : spec.prefix;
                if (kind === 'ready' && spec.free === undefined) return { problem: 'a ready addition is of a provider whose API states its free tier, and only' };
                if (typeof id !== 'string' || !ADDITION_ID.test(id)) return { problem: 'an id is not spelt like one' };
                if (spec.freeSuffix !== undefined && !id.endsWith(spec.freeSuffix)) return { problem: 'an id of a provider whose API states its free tier does not end in ":free"' };
                if (typeof name !== 'string' || name.length > 80 || !ADDITION_NAME.test(name)) return { problem: 'a name is not spelt like the file\'s' };
                if (words.has(name) || names.has(name)) return { problem: `the name ${name} is already a word of the template or another item's` };
                names.add(name);
                if (known.has(prefix + id)) return { problem: `${provider}/${id} is already an entry` };
                if (ignored.has(`${provider}/${id}`)) return { problem: `${provider}/${id} is set aside by a drift-ignore line` };
                const own = entries.filter((entry) => providerOf(entry.fields.model, entry.fields.api_base) === provider);
                const lastOf = (pool) => [...pool].reverse().find((entry) => !entry.commented) ?? pool[pool.length - 1];
                const usable = own.filter((entry) => !Object.hasOwn(ADDITION_ENV_BASES, entry.fields.api_base));
                const same = usage ? own.filter((entry) => entry.fields.mode === usage.mode) : [];
                const modeless = usable.filter((entry) => entry.fields.mode === undefined);
                const anchor = same.length > 0 ? lastOf(same) : lastOf(modeless.length > 0 ? modeless : usable);
                if (!anchor) return { problem: `the template has no entry of ${provider} to model one on` };
                const key = anchor.fields.api_key;
                let apiBase = anchor.fields.api_base;
                const envBase = embedsThroughEnv ? apiBase : undefined;
                if (embedsThroughEnv) {
                  if (envBase === undefined || !Object.hasOwn(ADDITION_ENV_BASES, envBase)) return { problem: 'the template has no embedding entry of cloudflare to model one on' };
                  apiBase = undefined;
                }
                if (spec.keyless) {
                  if (typeof key !== 'string' || !ADDITION_MARKER.test(key)) return { problem: `the key of the entry ${anchor.name} is not a plain marker, as a keyless gateway's is` };
                } else if (typeof key !== 'string' || !ADDITION_KEY.test(key)) return { problem: `the key of the entry ${anchor.name} is not read from the environment` };
                if (apiBase !== undefined && !ADDITION_BASE.test(apiBase)) return { problem: `the api_base of the entry ${anchor.name} is not a plain https address` };
                if (kind === 'ready' && anchor.commented) return { problem: 'a ready addition follows an active entry' };
                const lead = anchor.commented ? '  # ' : '  ';
                let note;
                if (anchor.commented) note = `Not routed to: proposed by the drift run on ${date}, its free tier on ${spec.label} not verified yet.`;
                else if (spec.free !== undefined) note = `Proposed by the drift run on ${date}: listed free by "${spec.free}" that day.`;
                else note = `Proposed by the drift run on ${date}: its free tier on ${spec.label} is not verified yet.`;
                const block = ['', `  # ${note}`, `${lead}- model_name: ${name}`, `${lead}  model_info:`];
                if (usage) block.push(`${lead}    mode: ${usage.mode}`);
                block.push(`${lead}    access_groups: ["${spec.group ?? (usage ? usage.group : 'LLM')}", "${spec.data}"]`, `${lead}  litellm_params:`, `${lead}    model: ${prefix}${id}`);
                if (envBase !== undefined) block.push(`${lead}    api_base: "${envBase}"`);
                else if (apiBase !== undefined) block.push(`${lead}    api_base: "${apiBase}"`);
                block.push(`${lead}    api_key: "${key}"`);
                if (spec.keyless) block.push(`${lead}    extra_headers:`, `${lead}      Authorization: ""`);
                after.set(anchor.last, (after.get(anchor.last) ?? []).concat([block]));
                if (!anchor.commented) {
                  const refusal = slotRefusal(provider, hasUsage ? item.usage : 'chat');
                  if (refusal !== null) return { problem: refusal };
                  const router = slotRouter(provider, hasUsage ? item.usage : 'chat');
                  if (router !== null) slots.set(router, (slots.get(router) ?? []).concat(slotLines(provider, router, name)));
                }
              }
              const slotsBefore = new Map();
              for (const [router, written] of slots) {
                const tail = cascadeTail(lines, router);
                if (tail === -1) return { problem: `the cascade of ${ADDITION_ROUTERS[router].name} has an else branch, where a slot cannot be written` };
                if (tail !== null) slotsBefore.set(tail, written);
              }
              // "notes" holds the index of each comment this wrote, the line after the blank one a
              // block opens with: only the builder knows them, since a base line can read the same.
              const out = [];
              const notes = [];
              lines.forEach((line, index) => {
                if (index > 0) out.push(...(slotsBefore.get(index) ?? []));
                out.push(line);
                for (const block of after.get(index) ?? []) {
                  notes.push(out.length + 1);
                  out.push(...block);
                }
              });
              out.push(...(slotsBefore.get(lines.length) ?? []));
              return { text: out.join('\n'), notes };
            };
            // What "proposals.json" says of one kind: { complete, items } once its shape is checked,
            // or { problem }. The items themselves are judged by additionsTemplate.
            const additionPart = (proposals, kind) => {
              if (proposals === null || typeof proposals !== 'object' || Array.isArray(proposals)) return { problem: 'the proposals are not an object' };
              if (typeof proposals.date !== 'string' || !ADDITION_DATE.test(proposals.date)) return { problem: 'the proposals carry no date' };
              const part = Object.hasOwn(proposals, kind) ? proposals[kind] : null;
              if (part === null || typeof part !== 'object' || typeof part.complete !== 'boolean' || !Array.isArray(part.items)) return { problem: `the proposals hold no "${kind}" part of the expected shape` };
              return { complete: part.complete, items: part.items };
            };
            // END additions builder

            // A checkbox a person ticked in a body stays ticked when the body is written again with
            // the same line.
            const keepTicks = (body, previous) => {
              const ticked = new Set((previous ?? '').replace(/\r\n/g, '\n').split('\n')
                .filter((line) => /^\s*- \[[xX]\] /.test(line)).map((line) => line.replace(/^(\s*- )\[[xX]\]/, '$1[ ]')));
              return body.split('\n').map((line) => (ticked.has(line) ? line.replace(/^(\s*- )\[ \]/, '$1[x]') : line)).join('\n');
            };

            // The open pull request of a branch, if any.
            const openPullRequest = async (branch) => (await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:${branch}`, base: baseBranch, per_page: 10,
            })).data[0];

            // The branch is the workflow's own, but a person may have added a commit to it. Returns
            // its head (or null) and, when there is one, the first commit the workflow did not make,
            // or a sentence saying it holds more commits than this reads. A merge commit is not a
            // person's work (the "Update branch" button adds one): the next run rebuilds the branch
            // from main without it.
            const branchState = async (branch) => {
              let head = null;
              try {
                head = (await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` })).data.object.sha;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              if (!head) return { head, foreign: null };
              const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                owner, repo, basehead: `${baseBranch}...${head}`, per_page: 100,
              });
              const foreign = comparison.commits.filter((commit) =>
                commit.commit.author?.name !== bot.name && commit.parents.length < 2);
              const unseen = comparison.total_commits - comparison.commits.length;
              if (foreign.length > 0) return { head, foreign: `a commit the workflow did not make, ${foreign[0].sha}` };
              if (unseen > 0) return { head, foreign: 'more commits than this step reads' };
              return { head, foreign: null };
            };

            // Why the commit the other job worked on may not be built on, or null: the branch is main
            // plus one commit and nothing else.
            const baseProblem = async () => {
              if (!/^[0-9a-f]{40}$/.test(base)) return `the drift check reported "${base}" as the commit it worked on, which is no commit`;
              const { data: ancestry } = await github.rest.repos.compareCommitsWithBasehead({
                owner, repo, basehead: `${base}...${baseBranch}`, per_page: 1,
              });
              if (!['ahead', 'identical'].includes(ancestry.status)) return `${base} is not on ${baseBranch} (${ancestry.status}): the commit was made on a commit this branch must not be built on`;
              return null;
            };

            // The template on a commit, as text, or null when it is not a file this step can read.
            const templateAt = async (ref) => {
              const { data: original } = await github.rest.repos.getContent({ owner, repo, path: template, ref });
              if (original.type !== 'file' || original.encoding !== 'base64') return null;
              return Buffer.from(original.content, 'base64').toString('utf8');
            };

            // The comment above a proposed entry carries the day it was proposed. A branch whose
            // template differs from the new build only by those days, on the lines the build wrote
            // them on, is kept as it is: a run with nothing new then pushes nothing and starts no
            // check, and each entry keeps the day it was first proposed. The lines are the builder's
            // own account, not the ones the base lacks: the comment does not name its model, so an
            // entry merged from an earlier proposal of the same day and source holds the same line.
            const undated = (line) => line.replace(/^(  # (?:Proposed|Not routed to: proposed) by the drift run on )[0-9]{4}-[0-9]{2}-[0-9]{2}/, '$1');
            const onlyDaysDiffer = (kept, built) => {
              const keptLines = kept.split('\n');
              const builtLines = built.text.split('\n');
              const notes = new Set(built.notes);
              return keptLines.length === builtLines.length && keptLines.every((line, index) => line === builtLines[index] ||
                (notes.has(index) && undated(line) === undated(builtLines[index])));
            };

            // Writes "content" as the template in one commit on "base", and points the branch at it
            // unless it already holds that tree. Returns the branch's new tip, or null when the branch
            // moved while this ran, which is left alone.
            const pushCommit = async (branch, head, content, message) => {
              const { data: baseCommit } = await github.rest.git.getCommit({ owner, repo, commit_sha: base });
              const { data: blob } = await github.rest.git.createBlob({
                owner, repo, content: Buffer.from(content).toString('base64'), encoding: 'base64',
              });
              const { data: tree } = await github.rest.git.createTree({
                owner, repo, base_tree: baseCommit.tree.sha,
                tree: [{ path: template, mode: '100644', type: 'blob', sha: blob.sha }],
              });
              const current = head ? (await github.rest.git.getCommit({ owner, repo, commit_sha: head })).data : null;
              if (current && current.tree.sha === tree.sha) {
                core.notice(`${branch} already holds this commit's content.`);
                return head;
              }
              const stamp = { ...bot, date: new Date().toISOString() };
              const { data: commit } = await github.rest.git.createCommit({
                owner, repo, message, tree: tree.sha, parents: [base], author: stamp, committer: stamp,
              });
              if (head) {
                // The API has no compare-and-swap, so look again just before: a person who pushed
                // since the check above is not overwritten either.
                const { data: now } = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
                if (now.object.sha !== head) {
                  core.warning(`${branch} moved while this run was working (${head} to ${now.object.sha}): neither the branch nor the pull request is touched.`);
                  return null;
                }
                await github.rest.git.updateRef({ owner, repo, ref: `heads/${branch}`, sha: commit.sha, force: true });
              } else {
                await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: commit.sha });
              }
              core.notice(`${branch} now holds ${commit.sha}.`);
              return commit.sha;
            };

            // Opens the pull request of "branch", or brings the title and the body of the open one
            // up to date. Returns it, or null when GitHub refused to open it, which fails the step.
            const openOrUpdate = async ({ branch, title, body, existing, draft }) => {
              try {
                if (existing) {
                  if (existing.title !== title || !same(existing.body, body)) {
                    await github.rest.pulls.update({ owner, repo, pull_number: existing.number, title, body });
                  }
                  core.notice(`Pull request #${existing.number} is up to date.`);
                  return existing;
                }
                let created;
                try {
                  ({ data: created } = await github.rest.pulls.create({ owner, repo, title, head: branch, base: baseBranch, body, draft }));
                } catch (error) {
                  // Where GitHub refuses a draft pull request, as on a private repository of its
                  // free plan, the body says to wait, and the run says why it is not a draft.
                  if (!draft || error.status !== 422 || !/draft/i.test(error.message)) throw error;
                  core.warning(`GitHub refused a draft pull request (${error.message}): ${branch} is opened ready for review, and its body alone says to wait.`);
                  ({ data: created } = await github.rest.pulls.create({ owner, repo, title, head: branch, base: baseBranch, body, draft: false }));
                }
                core.notice(`Opened pull request #${created.number}.`);
                return created;
              } catch (error) {
                if (error.status === 403 && /not permitted to create or approve pull requests/i.test(error.message)) {
                  core.setFailed(`GitHub refused to open the pull request: the repository setting "Allow GitHub Actions to create and approve pull requests" is off. Turn it on at https://github.com/${owner}/${repo}/settings/actions (under "Workflow permissions"; if the box is greyed out, the same setting at the organisation level), then run this workflow again. The commit is already on the branch ${branch}.`);
                  return null;
                }
                throw error;
              }
            };

            // The checks of this commit, where GitHub starts none: asked for whichever of them has no
            // run on it yet, whatever this run did or did not do before, so that a run that failed
            // half way is repaired by the next one. With the App's token GitHub starts them itself,
            // and a dispatch would only double them.
            const dispatchChecks = async (branch, tip, number) => {
              const problems = [];
              for (const workflow of process.env.NATIVE_CHECKS === 'true' ? [] : workflows) {
                try {
                  const { data: runs } = await github.rest.actions.listWorkflowRuns({
                    owner, repo, workflow_id: workflow, head_sha: tip, per_page: 1,
                  });
                  if (runs.total_count > 0) {
                    console.log(`${workflow} has already run on ${tip}.`);
                    continue;
                  }
                  await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: workflow, ref: branch });
                  core.notice(`${workflow} dispatched on ${branch}.`);
                } catch (error) {
                  problems.push(workflow);
                  core.error(`${workflow} could not be dispatched on ${branch}: ${error.message}`);
                }
              }
              if (problems.length > 0) {
                core.setFailed(`The pull request #${number} is open, but ${problems.join(' and ')} could not be dispatched: see the errors above. The next run tries again.`);
              }
            };

            // Writes the commit, opens or updates the pull request, hands its number to the step that
            // assigns it and asks for its checks.
            const publish = async (branch, head, content, message, request) => {
              const tip = await pushCommit(branch, head, content, message);
              if (!tip) return;
              const pr = await openOrUpdate({ branch, ...request });
              if (!pr) return;
              numbers.push(pr.number);
              await dispatchChecks(branch, tip, pr.number);
            };

            // The pull request that deletes what the providers retired, which the gate may merge.
            const removals = async () => {
              const branch = process.env.REMOVALS_BRANCH;
              const title = 'Supprimer de la liste LiteLLM les modèles que leur fournisseur a retirés';
              const covered = process.env.COVERED;
              const changed = process.env.CHANGED;
              const undeleted = process.env.UNDELETED;

              // What the other job reports is data, and is checked before anything is done with it.
              if (!['0', '1', '2'].includes(status) || !['complete', 'partial'].includes(covered) ||
                  !['true', 'false', 'invalid'].includes(changed) || !/^([0-9]+|unknown)$/.test(undeleted)) {
                core.setFailed(`The drift check reported something this step does not know: status "${status}", coverage "${covered}", changed "${changed}", undeleted "${undeleted}".`);
                return;
              }
              if (changed === 'invalid') {
                core.setFailed('The drift check changed something other than ' + template + '. Nothing is pushed.');
                return;
              }

              const existing = await openPullRequest(branch);
              if (changed === 'false' && !existing) {
                core.notice('Nothing to delete, and no deletion pull request open.');
                return;
              }

              // A person's commit is never overwritten, and the pull request it belongs to is neither
              // updated nor closed: the step fails so that somebody knows, every day, until the
              // branch is deleted.
              const { head, foreign } = await branchState(branch);
              if (foreign) {
                core.setFailed(`${branch} holds ${foreign}, so neither the branch nor its pull request is touched. Delete the branch (merge or close its pull request first if somebody is working on it) and the next run makes it again from ${baseBranch}.`);
                return;
              }

              if (changed === 'false') {
                // 2, or a provider without its key: "nothing to delete" may only be "nothing seen". A
                // retired model the script refused to delete is still retired, and nothing here may
                // call it gone. And a report whose issue step failed is one nobody trusted.
                if (status === '2' || covered !== 'complete' || undeleted !== '0' ||
                    process.env.ISSUE_OUTCOME !== 'success') {
                  core.notice(`Nothing was deleted in this run, but it did not see every catalogue, or a retired model was left to a person, or its report is not trusted: #${existing.number} is left open.`);
                  return;
                }
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: 'Plus rien à supprimer : le catalogue de chaque fournisseur, lu à la dernière exécution de `.github/workflows/LiteLLM_model_drift.yml`, liste toutes les entrées de `main` (ou ces suppressions ont été faites par ailleurs). Pull request fermée par le workflow.',
                });
                await github.rest.pulls.update({ owner, repo, pull_number: existing.number, state: 'closed' });
                core.notice(`Nothing left to delete: #${existing.number} closed.`);
                return;
              }

              const unbuildable = await baseProblem();
              if (unbuildable) {
                core.setFailed(`The deletions are not pushed: ${unbuildable}.`);
                return;
              }

              // Signed as Dependabot signs its commits: the certificate asks for a Name <address>
              // and the commit adds nothing a person could certify, only deletions and rows of the
              // "head" table, which the pull request lists for a person to read.
              const message = fs.readFileSync(process.env.COMMIT_MESSAGE, 'utf8').trimEnd() +
                `\n\nSigned-off-by: ${bot.name} <${bot.email}>\n`;
              const body = fs.readFileSync(process.env.PR_BODY, 'utf8');
              const content = fs.readFileSync(process.env.TEMPLATE_FILE);

              // The job that made the template is trusted with deleting lines and with writing the rows
              // of the "head" table again, and nothing else (see "templateProblem" above): the file it
              // handed over must be the template on that commit so changed, or nothing is pushed.
              const { data: original } = await github.rest.repos.getContent({
                owner, repo, path: template, ref: base,
              });
              if (original.type !== 'file' || original.encoding !== 'base64') {
                core.setFailed(`${template} on ${base} is not a file this step can read.`);
                return;
              }
              const problem = templateProblem(Buffer.from(original.content, 'base64').toString('utf8'), content.toString('utf8'));
              if (problem) {
                core.setFailed(`The template the other job handed over is not ${template} on ${base} with lines deleted and the rows of its "head" table written again, and nothing is pushed: ${problem}.`);
                return;
              }

              await publish(branch, head, content, message, { title, body, existing, draft: false });
            };

            // The two pull requests that propose additions, which nothing but a person merges: the
            // gate knows the branch of the deletions alone, and the one to verify is a draft.
            const ADDITION_TITLES = {
              ready: 'Ajouter à la liste LiteLLM les nouveaux modèles prêts, dont le run connaît tout',
              to_verify: "Vérifier, puis ajouter à la liste LiteLLM, les nouveaux modèles auxquels il manque une information",
            };
            const additions = async (kind) => {
              const spec = kind === 'ready'
                ? { branch: process.env.ADDITIONS_BRANCH, draft: false }
                : { branch: process.env.ADDITIONS_TO_VERIFY_BRANCH, draft: true };
              const folder = process.env.PROPOSALS;
              if (!['0', '1', '2'].includes(status)) {
                core.setFailed(`The drift check reported the status "${status}", which this step does not know: nothing is done for ${spec.branch}.`);
                return;
              }
              let proposals;
              try {
                proposals = JSON.parse(fs.readFileSync(`${folder}/proposals.json`, 'utf8'));
              } catch (error) {
                core.setFailed(`The drift check wrote no proposals this step can read (${error.name}).`);
                return;
              }
              const part = additionPart(proposals, kind);
              if (part.problem) {
                core.setFailed(`The proposals are refused, and nothing is pushed for ${spec.branch}: ${part.problem}.`);
                return;
              }

              const existing = await openPullRequest(spec.branch);
              if (part.items.length === 0 && !existing) {
                core.notice(`Nothing to propose on ${spec.branch}, and no pull request open.`);
                return;
              }
              // A person's commit means somebody is deciding: while the pull request is open, it is
              // left as it is. Without one, the branch is in the way of the next proposals, and the
              // step fails until it is deleted.
              const { head, foreign } = await branchState(spec.branch);
              if (foreign && existing) {
                core.notice(`${spec.branch} holds ${foreign}: #${existing.number} is left as it is while it is open.`);
                return;
              }
              if (foreign) {
                core.setFailed(`${spec.branch} holds ${foreign}, and no pull request is open for it: delete the branch and the next run proposes again from ${baseBranch}.`);
                return;
              }

              if (part.items.length === 0) {
                // A catalogue not read may hold the models still to propose, and a report whose issue
                // step failed is one nobody trusted.
                if (status === '2' || !part.complete || process.env.ISSUE_OUTCOME !== 'success') {
                  core.notice(`Nothing to propose on ${spec.branch} in this run, but it did not read every catalogue it draws on, or its report is not trusted: #${existing.number} is left open.`);
                  return;
                }
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: 'Plus rien à proposer : chaque modèle qu\'elle proposait est maintenant dans `main` ou écarté par une ligne `drift-ignore`, ou n\'est plus au catalogue de son fournisseur, lu à la dernière exécution de `.github/workflows/LiteLLM_model_drift.yml`. Pull request fermée par le workflow.',
                });
                await github.rest.pulls.update({ owner, repo, pull_number: existing.number, state: 'closed' });
                core.notice(`Nothing left to propose: #${existing.number} closed.`);
                return;
              }

              const unbuildable = await baseProblem();
              if (unbuildable) {
                core.setFailed(`Nothing is pushed for ${spec.branch}: ${unbuildable}.`);
                return;
              }
              const baseText = await templateAt(base);
              if (baseText === null) {
                core.setFailed(`${template} on ${base} is not a file this step can read.`);
                return;
              }
              // Built here, from the validated items alone; the script's own build, which it read back,
              // has to be the same text, or the two disagree and nothing is pushed.
              const built = additionsTemplate(baseText, proposals.date, kind, part.items);
              if (built.problem) {
                core.setFailed(`The additions proposed for ${spec.branch} are refused, and nothing is pushed: ${built.problem}.`);
                return;
              }
              let handed;
              let body;
              let message;
              try {
                handed = fs.readFileSync(`${folder}/${kind}_template.j2`, 'utf8');
                body = fs.readFileSync(`${folder}/${kind}_body.md`, 'utf8');
                message = fs.readFileSync(`${folder}/${kind}_commit.txt`, 'utf8');
              } catch (error) {
                core.setFailed(`The drift check proposed additions for ${spec.branch} without the files that go with them (${error.name}).`);
                return;
              }
              if (handed !== built.text) {
                core.setFailed(`The template built here for ${spec.branch} is not the one the drift check built and read back: nothing is pushed.`);
                return;
              }
              if (body.length > 65000) {
                core.setFailed(`The body proposed for ${spec.branch} is longer than GitHub accepts.`);
                return;
              }
              // Signed as the deletions are: the commit is a proposal a person reads before merging.
              message = message.trimEnd() + `\n\nSigned-off-by: ${bot.name} <${bot.email}>\n`;
              const kept = head ? await templateAt(head) : null;
              const content = kept !== null && onlyDaysDiffer(kept, built) ? kept : built.text;

              await publish(spec.branch, head, content, message, {
                title: ADDITION_TITLES[kind], existing, draft: spec.draft, body: keepTicks(body, existing?.body),
              });
            };

            // The pull request that corrects the sheets, which nothing but a person merges: the gate
            // knows the branch of the deletions alone. The template it carries is the one the other job
            // wrote, pushed only when it is main's with the value of sheet lines written again.
            const SHEETS_TITLE = 'Corriger dans la liste LiteLLM les fiches des modèles qui diffèrent du catalogue de leur fournisseur';
            const sheetCorrections = async () => {
              const sheetBranch = process.env.SHEETS_BRANCH;
              const folder = process.env.SHEETS;
              const known = ['0', '1', '2'].includes(status);
              if (!known) {
                core.setFailed(`The drift check reported the status "${status}", which this step does not know: nothing is done for ${sheetBranch}.`);
                return;
              }
              let sheets;
              try {
                sheets = JSON.parse(fs.readFileSync(`${folder}/sheets.json`, 'utf8'));
              } catch (error) {
                core.setFailed(`The drift check wrote no sheets this step can read (${error.name}).`);
                return;
              }
              const whole = (value) => Number.isInteger(value) && value >= 0 && value <= 100000;
              if (sheets === null || typeof sheets !== 'object' || Array.isArray(sheets) || typeof sheets.date !== 'string' ||
                  !ADDITION_DATE.test(sheets.date) || typeof sheets.complete !== 'boolean' || !whole(sheets.changes) || !whole(sheets.left)) {
                core.setFailed(`The sheet corrections are refused, and nothing is pushed for ${sheetBranch}: they are not of the expected shape.`);
                return;
              }

              const existing = await openPullRequest(sheetBranch);
              if (sheets.changes === 0 && !existing) {
                core.notice(`No sheet to correct, and no pull request open on ${sheetBranch}.`);
                return;
              }
              // A person's commit means somebody is deciding, as on the additions' branches.
              const { head, foreign } = await branchState(sheetBranch);
              if (existing && foreign) {
                core.notice(`${sheetBranch} holds ${foreign}: #${existing.number} is left as it is while it is open.`);
                return;
              }
              if (foreign) {
                core.setFailed(`${sheetBranch} holds ${foreign}, and no pull request is open for it: delete the branch and the next run proposes again from ${baseBranch}.`);
                return;
              }

              if (sheets.changes === 0) {
                // A catalogue not read says nothing of its sheets, a difference left to a person is still
                // there, and a report whose issue step failed is one nobody trusted.
                if (status === '2' || !sheets.complete || sheets.left !== 0 || process.env.ISSUE_OUTCOME !== 'success') {
                  core.notice(`No sheet was rewritten in this run, but it did not read every catalogue it draws on, or a difference was left to a person, or its report is not trusted: #${existing.number} is left open.`);
                  return;
                }
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: 'Plus aucun écart : les fiches des entrées de `main` disent ce que le catalogue de leur fournisseur publie, lu à la dernière exécution de `.github/workflows/LiteLLM_model_drift.yml` (ou ces corrections ont été faites par ailleurs). Pull request fermée par le workflow.',
                });
                await github.rest.pulls.update({ owner, repo, pull_number: existing.number, state: 'closed' });
                core.notice(`No sheet left to correct: #${existing.number} closed.`);
                return;
              }

              const unbuildable = await baseProblem();
              if (unbuildable) {
                core.setFailed(`Nothing is pushed for ${sheetBranch}: ${unbuildable}.`);
                return;
              }
              const baseText = await templateAt(base);
              if (baseText === null) {
                core.setFailed(`${template} on ${base} is not a file this step can read.`);
                return;
              }
              let content;
              let body;
              let message;
              try {
                content = fs.readFileSync(`${folder}/sheets_template.j2`, 'utf8');
                body = fs.readFileSync(`${folder}/sheets_body.md`, 'utf8');
                message = fs.readFileSync(`${folder}/sheets_commit.txt`, 'utf8');
              } catch (error) {
                core.setFailed(`The drift check proposed sheet corrections for ${sheetBranch} without the files that go with them (${error.name}).`);
                return;
              }
              const problem = sheetProblem(baseText, content);
              if (problem) {
                core.setFailed(`The template the other job handed over is not ${template} on ${base} with the value of sheet lines written again, and nothing is pushed for ${sheetBranch}: ${problem}.`);
                return;
              }
              if (body.length > 65000) {
                core.setFailed(`The body proposed for ${sheetBranch} is longer than GitHub accepts.`);
                return;
              }
              // Signed as the other commits are: it is a proposal a person reads before merging.
              message = message.trimEnd() + `\n\nSigned-off-by: ${bot.name} <${bot.email}>\n`;
              await publish(sheetBranch, head, content, message, { title: SHEETS_TITLE, existing, draft: false, body });
            };

            for (const [what, handle] of [
              ['the deletion pull request', removals],
              ['the pull request of ready additions', () => additions('ready')],
              ['the pull request of additions to verify', () => additions('to_verify')],
              ['the pull request of sheet corrections', sheetCorrections],
            ]) {
              try {
                await handle();
              } catch (error) {
                core.setFailed(`${what}: ${error.message}`);
              }
            }
            core.setOutput('numbers', numbers.join(' '));

      # The assignee is an issue's: set with GITHUB_TOKEN, which this job holds with "issues: write",
      # whoever wrote the pull requests, so that a GitHub App is not asked for the Issues permission.
      - name: Assign the drift pull requests
        if: ${{ !cancelled() && steps.pull-request.outputs.numbers != '' }}
        uses: actions/github-script@v9
        env:
          PULL_NUMBERS: ${{ steps.pull-request.outputs.numbers }}
        with:
          script: |
            const { owner, repo } = context.repo;
            for (const number of process.env.PULL_NUMBERS.split(' ')) {
              if (!/^[0-9]+$/.test(number)) {
                core.setFailed(`"${number}" is no pull request number.`);
                continue;
              }
              await github.rest.issues.addAssignees({
                owner, repo, issue_number: Number(number), assignees: ['tigerblue77'],
              });
            }
