---
name: Secret scan

# Secret detection on every pull request. Nothing in this repository is a known secret waiting for
# rotation, so there is no ".gitleaksignore": every finding is a finding.
#
# ! This workflow REPORTS, it does not block a human's merge. No ruleset is
#   imported (the header of "ansible-ci.yml" says why), so no CI check is required before
#   merging. The guard that really refuses is
#   ".githooks/pre-commit".
#
#   The exceptions are Dependabot's own updates and the weekly model-deletion pull request:
#   "dependabot-auto-merge.yml" merges one only once both jobs below have succeeded on it, reading
#   their display names from ".github/rulesets/main.json" and listening for this workflow by its
#   "name:" above. See the header of "ansible-ci.yml".
#
# The "sudo install" below needs a runner whose user has sudo without a password, which GitHub's
# hosted image gives. The header of "ansible-ci.yml" says why every job runs on hosted runners only.

on:
  push:
    branches: [main]
  pull_request:
  # How "dependabot-auto-merge.yml" runs this workflow on main once it has merged an update, which
  # starts no "push" run (#180). The same trigger in "ansible-ci.yml" says the rest.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # To be bumped by hand from https://github.com/gitleaks/gitleaks/releases: Dependabot has no
      # ecosystem for a raw release download. The checksum goes with the version and is read off the
      # "gitleaks_<version>_checksums.txt" of that same release.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Check the repository out
        uses: actions/checkout@v7

      # The checksum verification is not ceremony: without it, this job trustingly runs a binary
      # downloaded over the network on every single run, and it is the one job in the repository
      # whose whole purpose is to take nothing on trust.
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      # "dir" reads the working tree, not the history. That is the right mode here: the repository
      # has a single initial commit and no legacy to purge, so scanning the history would say
      # nothing more while costing more on every run.
      #
      # ! This job does NOT see the ".env" a developer would have on their own machine:
      #   "actions/checkout" only materialises what git tracks. That is the reason it is green
      #   here while "gitleaks dir ." run locally on a tree holding a real ".env" exits 1 --
      #   "dir" does not read the ".gitignore". Both behaviours are correct; it is the acceptance
      #   criterion that has to say which side it stands on.
      - name: Look for secrets in the working tree
        run: ./gitleaks dir . --no-banner --redact

  hook:
    name: Pre-commit hook blocks a secret
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    # The Definition of Done of #32 asks that "a commit deliberately carrying a fake key be refused
    # by the hook, not merely reported by CI". This job turns that into a proof that replays itself,
    # rather than a verification done once by hand and then forgotten: the hook is a file like any
    # other, and nothing else here would notice that it had stopped biting.
    steps:
      - name: Check the repository out
        uses: actions/checkout@v7

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      # ! The fake key is BUILT HERE, at run time, and is written nowhere in the repository. Two
      #   reasons, and each one would be enough on its own:
      #     - a literal key in this file would be found by the "gitleaks" job above, which reads the
      #       working tree: the test would turn red the very check it tests;
      #     - gitleaks filters its findings on ENTROPY. A constant filler ("AIzaSy" followed by
      #       zeroes) is not detected -- measured, "no leaks found", commit accepted. A test
      #       written with a fake key that is too regular would therefore wrongly conclude that
      #       the hook does not work. Drawing the characters at random gives it the entropy of a
      #       real one.
      - name: A commit carrying a fake key must be refused
        run: |
          set -uo pipefail
          scratch="$(mktemp -d)"
          # The mode of the VERSIONED file is checked here, before the copy: a "chmod +x" on the
          # copy would turn this job green in the very case where the hook has stopped biting, the
          # one where its executable bit has been lost.
          test -x .githooks/pre-commit \
            || { echo "::error title=Hook not executable::.githooks/pre-commit has lost its executable bit; git would not run it."; exit 1; }
          cp -p .githooks/pre-commit "$scratch/pre-commit-under-test"
          cd "$scratch"
          git init -q .
          git config user.email "ci@example.invalid"
          git config user.name "CI"
          mkdir -p .githooks
          mv pre-commit-under-test .githooks/pre-commit
          git config core.hooksPath .githooks
          echo "base" > base.txt
          git add base.txt .githooks
          git commit -q -m "base"

          # ! "tr -dc ... < /dev/urandom | head -c 33" exits 141: "head" closes the pipe as soon as
          #   it has its 33 bytes, "tr" takes a SIGPIPE, and "pipefail" surfaces the failure -- the
          #   step was therefore failing BEFORE it had tested anything (measured: exit 141, no
          #   output). Bounding the source and ending the pipeline with "cut", which reads its whole
          #   stream, removes the signal.
          fake_secret="AIzaSy$(head -c 512 /dev/urandom | LC_ALL=C tr -dc 'A-Za-z0-9' | cut -c1-33)"
          printf 'GEMINI_API_KEY=%s\n' "$fake_secret" > conf.txt
          git add conf.txt

          if git commit -q -m "fake key"; then
            echo "::error title=The hook no longer bites::A commit carrying a fake key was ACCEPTED by .githooks/pre-commit."
            exit 1
          fi

          if git log --oneline | grep -q "fake key"; then
            echo "::error title=The hook no longer bites::The commit was created despite the refusal it announced."
            exit 1
          fi

          echo "The hook refused the commit and no object was created."

      # The counterpart of the previous test: a hook that refused EVERYTHING would pass the test
      # above without proving anything. This one checks that an ordinary commit is not blocked.
      - name: A commit with no secret must pass
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          scratch="$(mktemp -d)"
          # The mode of the VERSIONED file is checked here, before the copy: a "chmod +x" on the
          # copy would turn this job green in the very case where the hook has stopped biting, the
          # one where its executable bit has been lost.
          test -x .githooks/pre-commit \
            || { echo "::error title=Hook not executable::.githooks/pre-commit has lost its executable bit; git would not run it."; exit 1; }
          cp -p .githooks/pre-commit "$scratch/pre-commit-under-test"
          cd "$scratch"
          git init -q .
          git config user.email "ci@example.invalid"
          git config user.name "CI"
          mkdir -p .githooks
          mv pre-commit-under-test .githooks/pre-commit
          git config core.hooksPath .githooks
          echo "nothing sensitive here" > readme.txt
          git add readme.txt .githooks
          git commit -q -m "ordinary commit"
          echo "The hook let an ordinary commit through."
