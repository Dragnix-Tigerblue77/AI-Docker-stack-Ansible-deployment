---
# What each LiteLLM router is held to, and which Artificial Analysis record describes each entry of
# "templates/LiteLLM_config.yaml.j2". Read by "check_LiteLLM_model_drift.py", which reports how the
# cascades stand against it in the summary of each run ("Contrats par routeur"). It is a
# REPORT: nothing here changes a cascade, an entry or a row of the "head" table, no member is removed
# from a cascade by it, and a model that breaks a contract is information, never a failure. The one
# thing that fails the plain run is the file's own shape (a router that does not exist, a number that
# is not a number, a value with no reason, a malformed row or file, a key written twice). A name kept
# here that is no entry of the template any more is not a failure, since a deletion leaves it: the
# plain run prints a notice and the summary lists it as a stale row, to be removed by a person.
#
# A router is named in this file, in the "head" table and in the script by its short id ("pro", "flash",
# "flash-lite", "code", "claude-code", "fiction", "paid"). The template publishes it under the name a client types, "Auto-Pro",
# "Auto-Flash", "Auto-Flash-Lite", "Auto-Code", "Auto-Claude-Code", "Auto-Fiction" and "Auto-Paid", and the script reads one for the other.
# "Auto", which picks one of three of these routers for each request by the complexity of the request, has no row below:
# it has no member of its own to hold to a floor, and the router it picks is held to its own.
#
# VALIDATED by the maintainer on 2026-11-22: the floors, the margin, the exchange rates, the code scale
# and the curve that estimates it, and the rules of the ranking below. Two of those rules were changed
# by the maintainer the same day, after a first validation: the ranking of "flash-lite" (it was the
# shortest time to the first answer token alone, and is now the intelligence index less the exchange
# rate times that time) and the rule that a member sharing its quota with a member of "pro" or
# "flash" comes last in "flash-lite". Every number still derives from the figures cited in its own
# reason line, and none is final: a source revises its figures, so each is read again at every run.
# What stays declared and imposes nothing is the quota and the availability of the providers ("inputs"
# below).
#
# NO TIME BUDGET. The goal is to use as many free models as possible, so a slow model is never
# disqualified for being slow. A member is eligible for a router if it reaches the router's
# floor (and, for "claude-code", takes tool calls), and for nothing else. Time is an
# ordering key: "pro", "flash" and "code" put the best quality first, and the time decides only between
# two members whose quality differs by less than the router's "tie_margin_points"; "flash-lite" values
# time, and orders its members by what they are worth for the time they take (below). The report keeps
# showing each member's time.
#
# The ranking of "flash-lite", which serves simple, short asks, keeps the time to the FIRST answer token
# as its measure, but between two models that answer about as fast the smarter one goes first. A member
# is worth its intelligence index less the router's exchange rate (its "min_points_per_second", 3, the
# one that also decides between the levels of one model) times its mean time to the first answer token,
# and the members that have both figures come by decreasing worth, the current order settling a tie.
# After them come the members that have a time and no index, the shortest time first; the figures are
# the published ones at the level the entry is called at, and never an estimate. A member with no time
# is not placed: it stays where it is in the cascade, flagged, behind those. Last come the members that
# draw on a quota another router needs: a member that is the same model of the same provider (same model
# id and same base address in the template) as a member of "pro" or "flash" has the quota of that
# member, which a free tier counts per model, so it ends the cascade, after every member that has a
# quota of its own, in the same order as above, and the last resort tier closes the cascade as it does
# every router. The report finds the members that share a quota by itself in the template; no list of
# them is kept here, and the routers whose members it must not eat are named in the "shared_quota_with"
# of the ranking.
#
# The unit of routing is "model + reasoning level". Artificial Analysis publishes one record per
# level, told apart by the suffix of the name ("(Low)", "(High)", "(Non-reasoning)"...), and speed in
# tokens per second is almost flat across levels while the time to the first answer token grows with
# them. The level a router keeps for a model is found by walking up its levels from the lowest and
# climbing to the next only while each extra second of the time to the first answer token buys at
# least the router's "min_points_per_second" points of index. A router that values time asks more
# points per second. The time of one request depends on the request, but what is compared is a model
# against itself, level against level, on the same requests: the rate measures the levels against
# each other and is no prediction for a given request. A step that is no slower and buys points is
# taken, a step that buys no points is not, and neither is one whose time is unknown. On Gemini 4
# Hydrogen (Low 26.9 in 7.6 s, Medium 41.2 in 13.0 s, High 50.8 in 21.5 s, Xhigh 53.9 in 47.4 s) the
# steps buy 2.6, 1.1 and 0.12 points a second: 0.2 and 1 stop at High, 3 at Low. On Gemini
# 3.8 Flash (Low 22.5 in 5.1 s, Medium 30.1 in 14.5 s, High 30.8 in 28.1 s) they buy 0.81 and 0.05:
# 0.2 stops at Medium, 1 and 3 at Low (Artificial Analysis free API, read 2026-11-21).
#
# The level an entry is CALLED at is no longer the one "level_gain" keeps, which stays a report of what
# each router would keep. Since 2026-11-24 the maintainer sets it by how the provider counts its free tier:
# the highest level the model takes where requests are counted (Gemini, OpenRouter, Kilo, Requesty), since
# thinking more then costs time only; none where tokens are counted (Groq, Aion Labs, Cloudflare), since
# thinking empties the quota and the model keeps the balance its maker chose, and none on a paid provider
# (Mistral, DeepSeek direct, Anthropic). "flash-lite" is ranked on time, so a model it shares with another router has
# one entry per level, named "<entry>-<level>", and an entry it holds is never raised. A level is set only where the values the model takes are known, and
# "check_compose_template.py" holds each to them: LiteLLM forwards none to NVIDIA, Cloudflare and Z AI,
# and no page gives them for OVHcloud's or Cent AI's models, so those keep the provider's default. A
# static level is only a DEFAULT: an effort a client sends replaces it, and Claude Code always sends one.
# "ROUTAGE.md" records where each model stands.
#
# How the figures are read. The time is the mean time to the first ANSWER token ("performance_v3"
# of the free API: the time the model spends thinking is part of it), the intelligence is the
# Artificial Analysis Intelligence Index on the version below, and both are the published figures, as
# the terms of that API ask the summary to cite them.
#
# Floors. A member past its router's floor is not removed: it goes to the router's last resort
# tier, after the members that conform. A floor is an ANCHOR, never a number: "at least as good as
# that model", whose figure the report reads at every run. Nothing is copied here, so nothing goes
# stale when a source revises a figure, and an anchor that can no longer be read is said in the
# summary instead of leaving a figure nobody checks: the router is then judged against nothing until a
# person names another anchor. The anchor tells the scale of the floor, and a floor keeps to one.
#
# On the intelligence index (more is better), an anchor names either an entry of the template
# ("entry", and where it has several levels, "level"), whose index the report reads from the Artificial
# Analysis ranking, or a model of Epoch AI's capabilities index ("epoch", its display name as the
# index spells it), read from the archive the online run already reads and converted to the scale of the
# intelligence index by the calibration below, which makes it an estimate, shown "estimé". The floors
# of "pro" and "flash" are on the capabilities index because it measures nearly every model that
# Artificial Analysis has no index for and measures the older Gemini models the floors are drawn from:
# "pro" is at least as good as Gemini 3 Pro, and "flash" at least as good as Gemini 2.5 Flash (the
# measurement of June 2025). "flash-lite" has NO floor: it is ordered by what a member is worth for
# its time (above), and every member that answers conforms.
#
# A floor on the index may carry a "margin", in points of the index and 0 where it is omitted: a
# member conforms while its figure is no more than the margin under the floor, and is under it only
# past that. "pro" and "flash" have 2, which is also what their "tie_margin_points" takes for two
# members not to be told apart. The report says the margin wherever it says the floor.
#
# On the code scale (smaller is better), which "code" and so "claude-code" are held to, an anchor is a
# "code_epoch": the model versions of Epoch AI's benchmark files that stand for the model, per file
# (at least two files), with the "name" the report shows. The scale is the CODE POSITION. In a
# benchmark file, the position of a score is (1 + the number of models of the file whose score is
# strictly greater) / (the number of models of the file), as a percentage, so that 100 is the last of
# the file and a small figure is a good one; every model version of the file counts, effort variants
# included. The position of a member in a file is that of the best score among the versions its "epoch"
# below lists for the file, and its code position is the MEDIAN of its positions over the files where
# it has a score, which takes two files at least: with fewer it has none. The position of an anchor is
# computed exactly as a member's, from the versions it names. A member conforms to a floor of this scale
# while its position is no more than the floor's plus the margin, which is none here. "code" is not
# held to the floor of "pro": coding is done well by models that are not the most capable ones, and
# its floor is the code position of Gemini 2.5 Flash. Each router lists, as "candidates", other anchors
# of its scale worth comparing, and the report shows the outcome of each side by side so that the
# choice is made on what each one does to the cascade.
#
# "claude-code" exists for one reason, tool calls, so it is "code" without the models that cannot take
# them: it derives from "code", is ranked exactly as "code" is, and its cascade is the cascade of
# "code" with the members that do not support tools taken out, in the same order. The report checks
# that on the template and lists the differences.
#
# "code" (and so "claude-code") is ranked on the code position above, read from Epoch AI's benchmark
# data (benchmark_data.zip of epoch.ai/benchmarks, free, no key, CC BY 4.0 with attribution, updated
# daily) by the online run, which cites it with the day it was read. Artificial Analysis
# publishes no coding or agentic index on any tier any more. Five files are read (DeepSWE,
# SWE-bench Verified, CursorBench, Terminal-Bench external, ALE-Bench), and WebDev Arena, and any design
# or UI arena, never: web interface quality is design, not code. The router puts its members that have
# a position first, the smallest first, the shorter time deciding between two members whose positions
# are less than "tie_margin_points" apart. A member with no code position of its own (no model version
# listed, none found, or found in one file only) is placed on an ESTIMATED one, converted from its
# intelligence index by "code_fallback" below, flagged "estimé" and with no time of its own; one that
# has neither a position nor an index is unrankable, not removed: it stays where it is, flagged. A member
# of the last resort or past the floor goes to the tail as for every other router. Its known weaknesses:
# the harnesses differ from one benchmark to the next, efforts are mixed, the sets of models differ per
# benchmark, and the effort of some entries is not stated in the file. When the archive cannot be read,
# the summary says so, the floor of "code" is not found and judges nobody, and the intelligence
# index orders the whole cascade, as a stand-in and nothing more. Each entry of "models" below
# records the Epoch AI model ids it was found under, effort suffix included, or "unknown".
#
# A member the ranking has no index for at the level it is called at is placed on an estimate where the
# capabilities index covers it: its entry's "eci" names the model, and the index, converted by the
# calibration below, stands in for the Artificial Analysis one, flagged "estimé" in its verdict. The
# index of the ranking always wins where it exists; the level kept, the exchange rate and the time are
# still the ranking's, and a router that values time uses no estimate. A member with no index and no
# capabilities index is "unrankable", not removed: it stays where it is in its cascade, flagged. 607
# of 764 records have no index on 2026-11-21 (the Gemini 3.6 Flash, Gemini 3.5 Flash and Gemini 2.5
# Pro among them): without the capabilities index a model with no index cannot be ranked, whatever it
# is worth.
#
# The intelligence scale is COMPRESSED at its low end. Of the 157 records that have an index on
# 2026-11-21, 37 sit below 15 and 24 below 10, where two points separate models nobody would put in
# the same class, while the top of the scale spreads from 40 to 65. A floor of 5 or 10 is therefore a
# coarse line.
#
# Quota and availability are declared inputs, not constraints: a rate limit or an error on a member
# sends the request to the next member at no cost. "inputs" records the limits the providers publish
# and leaves room for the error rate observed on the gateway, which is not measured yet; nothing in
# the report reads it.

status: validated
index_version: 5
source: "Artificial Analysis free API (artificialanalysis.ai), figures read 2026-11-21"

# The calibration of Epoch AI's capabilities index (ECI) on the intelligence index, read by the online
# run from the archive it reads for the code position, which covers many models that have no index. It turns
# the index of a model into the scale of the floors, by the line through the points below (extended
# past its ends by the slope of its end segment, and never below 0), and every figure it gives is
# "estimé" wherever it is shown. The points are read off the 41 models that have both an index (the
# median over their levels) and an ECI, whose rank correlation is 0.94, on 2026-11-21.
fallback_index:
  source: "Epoch AI Capabilities Index (ECI, benchmark_data.zip of epoch.ai/benchmarks, CC BY 4.0)"
  status: "read"
  flag: "estimated"
  method: "A monotone calibration of the Artificial Analysis index on the ECI, over the models that have both: the median index across a model's levels against its ECI. Used for a floor anchored on an Epoch AI model and for a member with no index at the level it is called at, and flagged estimated wherever it is used. Read by the online run, from the same archive as the code position."
  uncertainty: "ECI is one figure per model whereas the index has one per level, so at an ECI of 150 to 165 the index of one model spans about 10 points across its levels, and the points below are a middle line, not a measure."
  points: [[140, 4], [147, 12], [152, 21], [159, 31], [167, 50]]

# The estimate of a code position for a member that has none of its own, from its intelligence index, the
# one the report uses for it (the ranking's, or the estimate from the capabilities index where the ranking
# has none). The position is read on the line through the points below, joined by straight segments and
# kept at the first and the last position beyond them: nothing is extrapolated, since the calibration holds
# no model there. A position so obtained is "estimé" wherever it is shown, and has no time of its own. The
# points are read off the 9 entries of this file that have both an index and a code position, on the figures
# of 2026-11-21.
code_fallback:
  source: "The code position of Epoch AI's benchmark files (benchmark_data.zip, CC BY 4.0) against the effective intelligence index, over the 9 entries of this file that have both, on the figures of 2026-11-21"
  status: "read"
  flag: "estimated"
  method: "A monotone calibration of the median code position on the intelligence index: a pool-adjacent-violators fit (isotonic regression, the position never going up with the index) of the 9 entries, whose blocks are rounded to five break points. Used for a member with no code position of its own, flagged estimated wherever it is used."
  uncertainty: "Nine entries are a thin sample, and six of their indexes are themselves estimates from the capabilities index. Between an index of 5 and an index of 21 the sample holds no entry, and the line is straight over that gap. Between 20 and 26 three entries stand at 22 %, 26 % and 72 %, so the 40 % of the line there is a middle that none of them is on."
  points: [[0, 90], [5, 83], [23, 40], [30, 31], [51, 9]]

inputs:
  quota:
    gemini: "Free tier, counted per Google project and per model, not per API key, and the daily quotas reset at midnight Pacific time, per ai.google.dev/gemini-api/docs/rate-limits (read 2026-11-22). The page of the rate limits of Google AI Studio for the gateway's project, free tier, read 2026-11-22, gives requests per minute / tokens per minute / requests per day per model: Gemini 4 Hydrogen, Gemini 3.8 Flash, Gemini 3.6 Flash, Gemini 3 Flash and Gemini 2.5 Flash 5 / 250K / 20; Gemini 3.5 Flash-Lite and Gemini 3.1 Flash-Lite 15 / 250K / 500; Gemini 2.5 Flash-Lite 10 / 250K / 20; Gemma 4 31B and Gemma 4 26B 30 / 16K / 14,400; Gemini Embedding 1 and 2 100 / 30K / 1,000; the text-to-speech models 3 / 10K / 10; Gemini 3.5 Transcribe 3 / 10K / 25; Gemini 3.1 Pro, Gemini 2.5 Pro and Gemini 4 Argon, Neon and Carbon 0, not served on the free tier; Gemini 3.7 Flash is not on that page. Every entry of one model draws on that model's quota: gemini-4-hydrogen and gemini-4-hydrogen-low share one 20 requests a day, and so do gemini-3-8-flash and gemini-3-8-flash-low"
    groq: "Free plan, 30 requests and 8K tokens per minute for these models, per console.groq.com/docs/rate-limits as the template quotes it (checked 2026-09-27)"
    mistral: "Paid, a prepaid balance: Free mode no longer includes the API, per docs.mistral.ai/admin/billing-usage/usage-limits (read 2026-11-21); per-model limits only in the account's admin panel"
    deepseek: "No free quota: a prepaid balance, per api-docs.deepseek.com/faq as the template quotes it (checked 2026-09-27)"
    openrouter: "20 requests per minute and 50 per day, 1000 once 10 credits are bought, counted across every :free model of the account together, per openrouter.ai/docs/api_reference/limits as the template quotes it (checked 2026-09-27)"
    kilo: "Anonymous, no key and no account: 200 requests per hour per IP address, for the free models only, per the Authentication and Models and providers pages of the Kilo gateway documentation (read 2026-11-22); the free models' availability changes, and each flags that prompts may be trained on"
    ovhcloud: "Anonymous, no key and no account: 2 requests per minute per IP address and per model, observed from the maintainer's network on 2026-11-22 (a second call within the minute answered 429) and written on no page read, so one pool per entry, shared by the whole house; with a key, 400 a minute, but a payment method on a Public Cloud project is required and no spend cap exists (OVHcloud AI Endpoints page, read 2026-11-22)"
    cloudflare: "10,000 neurons a day for the whole account, shared by all its models, and 300 requests per minute for text generation, per developers.cloudflare.com/workers-ai/platform/pricing/ and .../platform/limits/ (read 2026-11-22); the models routed are deduced free from the pricing page's list of paid ones, and confirmed on no account"
    zai: "unknown: Z AI publishes no limit outside the account's console (docs.z.ai, read 2026-11-22), and the one-request-at-a-time limit a third party cites is not verified"
    requesty: "200 requests a day and 20 a minute for a new organization (1,000 and 60 for one that pays), counted across every free model of the organization together, per the Free models page of the Requesty docs (read 2026-11-22), which also says the models are free for now and that a change will be announced in the changelog ahead of time"
    nvidia: "40 requests per minute, shown on the account page (read 2026-11-22); no credit count, daily cap or end date is shown there or on any other page read, the API trial terms of service included"
    cent_ai: "no limit stated: the home page says \"Free until Nov 30 · no daily limit\" (read 2026-11-22) and nothing of what follows the 30th, when the model may be billed; a spending limit set on the key keeps a billed call from costing anything, since the call then fails and the cascade moves on"
    aion_labs: "15 requests a minute, 20,000 tokens a minute and 20,000 tokens a day for the whole account, all models together, on the free tier of the Rate Limits page of its documentation (read 2026-11-23); its terms of 2026-10-17 call free use \"a courtesy that we may change or withdraw at any time\""
    vercel_ai_gateway: "A monthly included credit, \"not an expiring trial\", shared by every entry of the provider and on a subset of its models, per vercel.com/docs/ai-gateway/pricing and its FAQ (read 2026-11-24): its amount is on no page read now (an older version of the pages said 5 USD every 30 days, and a renewal has not been observed yet), the rate limits per model are \"lower\" than the paid tier's and given no figure, a request with no credit answers 402 and a model outside the subset 403; the first purchase of credit ends the free credit for good"
    anthropic: "No free quota: every call is paid from the balance of the key's organisation, which the monthly credit of a Max, Ultra or Team plan of Claude fills, 100, 200 or up to 500 USD each billing cycle, expiring at its end and covering the Claude API but not Claude Code, per platform.claude.com/docs/en/about-claude/api-credits-for-subscribers (read 2026-11-25); an organisation with no other credit, no payment method and Auto-reload off refuses a request once the credit is spent"
    omniroute: "No quota: local and keyless"
  observed_error_rate: "not measured yet: a future input from the gateway"

routers:
  pro:
    intelligence_floor:
      anchor: {epoch: "Gemini 3 Pro"}
      margin: 2
      candidates:
        - {epoch: "Gemini 2.5 Flash (Jun 2025)"}
        - {epoch: "Gemini 3 Pro"}
        - {epoch: "Gemini 3.1 Pro"}
      reason: "At least as good as Gemini 3 Pro on Epoch AI's capabilities index, which covers nearly every model that Artificial Analysis has no index for (read 2026-11-21), so a reasoning router is not anchored on the one Gemini Flash that has an index at its lowest level. Gemini 2.5 Flash and Gemini 3.1 Pro are shown to compare. The margin of 2 points of the index, the one the router takes for two members not to be told apart, is there because the capabilities index measures one figure per model, with a confidence interval of about two points of its own scale (the interval Epoch AI publishes for each model, read 2026-11-21), so a model within the margin of the floor is not told apart from it."
    level_gain:
      min_points_per_second: 0.2
      reason: "pro asks little of an extra second, since nothing here is bounded by time: 0.2 points a second stops Gemini 4 Hydrogen at High (the step to Xhigh buys 3.1 points in 25.9 s, 0.12 a second) and keeps Gemini 3.8 Flash at Medium (High buys 0.7 in 13.6 s, 0.05), on the figures of 2026-11-21."
    ranking:
      criterion: intelligence
      tie_margin_points: 2
      reason: "The template ranks pro by capability and the index is the one general figure the free API gives; under 2 points two members are not told apart (Gemini 3.8 Flash at Medium and High differ by 0.7), so the shorter time decides."
    last_resort:
      members: [deepseek-v4-pro-direct, omniroute-free-reasoning]
      reason: "The template places the paid DeepSeek and the keyless local entry after every free one on purpose, and the local entry has no record to be judged on."
  flash:
    intelligence_floor:
      anchor: {epoch: "Gemini 2.5 Flash (Jun 2025)"}
      margin: 2
      candidates:
        - {epoch: "Gemini 2.5 Flash-Lite (Jun 2025)"}
        - {epoch: "Gemini 2.5 Flash (Jun 2025)"}
        - {entry: gemini-3-5-flash-lite}
        - {entry: gemini-3-1-flash-lite}
        - {epoch: "Gemini 3 Pro"}
      reason: "At least as good as Gemini 2.5 Flash, as Epoch AI's capabilities index measured it in June 2025: a Flash of the generation before the current ones is the least a daily driver is asked to be, and the index measures the models that Artificial Analysis has no figure for. Gemini 2.5 Flash-Lite, the two Gemini Flash-Lite that the template serves and Gemini 3 Pro, the floor of pro, are shown to compare. The margin of 2 points is the one of pro, for the same reason: the capabilities index gives one figure per model, with an interval of about two points of its own scale, so a model within the margin of the floor is not told apart from it."
    level_gain:
      min_points_per_second: 1
      reason: "A daily driver asks more of each extra second than pro does: 1 point a second takes Gemini 4 Hydrogen to High, Google's default for the model that replaces the Flash line (High buys 9.6 points over Medium in 8.4 s, 1.1 a second; Xhigh buys 0.12), which gives flash the same head as pro, and keeps Gemini 3.8 Flash at Low (Medium buys 7.6 in 9.4 s, 0.81), on the figures of 2026-11-21."
    ranking:
      criterion: intelligence
      tie_margin_points: 2
      reason: "The template ranks flash by capability; under 2 points two members are not told apart, so the shorter time decides."
    last_resort:
      members: [deepseek-flash-direct, omniroute-free-auto, openrouter-auto-free]
      reason: "The paid DeepSeek, the keyless local entry and OpenRouter's free router, which has no record, close the cascade by design."
  flash-lite:
    intelligence_floor:
      none: true
      reason: "The router exists for speed and takes every model that answers: a floor would only remove the models that answer fast and think little, which are what it is for, so what a member is worth for its time orders it and nothing goes under a floor."
    level_gain:
      min_points_per_second: 3
      reason: "The router that values time most asks the most of each extra second: 3 points a second keeps Gemini 4 Hydrogen at Low (Medium buys 14.3 points in 5.4 s, 2.6 a second) and Gemini 3.8 Flash at Low (Medium buys 0.81), on the figures of 2026-11-21. The same 3 points a second is the rate at which two models are compared in the ranking below."
    ranking:
      criterion: intelligence_for_time
      shared_quota_with: [pro, flash]
      reason: "The router serves simple, short asks, so the time to the first answer token stays its measure; but when two models answer about as fast the smarter one goes first, so a member is worth its intelligence index less 3 points for each second of its mean time to the first answer token (3 being the rate validated above for the levels of one model, used here between models). The members with a time and no index come after those with both, shortest time first, and the members with no time stay where they are, flagged. A member that is the same model of the same provider as a member of pro or flash comes last, after every member with a quota of its own: Gemini's free quota is counted per model, 20 requests a day for Gemini 4 Hydrogen and Gemini 3.8 Flash against 500 for Gemini 3.5 Flash-Lite and Gemini 3.1 Flash-Lite (see inputs, read 2026-11-22), so a Gemini 3.8 Flash at Low at the head of this router, worth more than any of its own members, would spend in a few requests the quota the heads of pro and flash need. Changed by the maintainer on 2026-11-22: it ranked by the shortest time alone, and put each Gemini model's own entry ahead of the Flash-Lite models whatever its level."
    last_resort:
      members: [ministral-3b, omniroute-free-fast]
      reason: "The template places the paid Mistral after every free entry on purpose, as it does the paid DeepSeek in pro and flash: it ends the cascade, after the members that share a quota too. The keyless local entry, OmniRoute's latency-first route, comes after it, as the local entry closes pro and flash after their paid members."
  code:
    intelligence_floor:
      anchor:
        name: "Gemini 2.5 Flash"
        code_epoch:
          terminalbench_external: [gemini-2.5-flash]
          ale_bench_external: [gemini-2.5-flash]
      candidates:
        - name: "Gemini 2.5 Flash"
          code_epoch:
            terminalbench_external: [gemini-2.5-flash]
            ale_bench_external: [gemini-2.5-flash]
        - name: "Gemini 3 Pro"
          code_epoch:
            swe_bench_verified: [gemini-3-pro-preview]
            terminalbench_external: [gemini-3-pro-preview]
            ale_bench_external: [gemini-3-pro-preview]
        - name: "Gemini 3.6 Flash"
          code_epoch:
            deepswe_external: [gemini-3.6-flash_high]
            ale_bench_external: [gemini-3.6-flash_high]
      reason: "At the code position of Gemini 2.5 Flash, the model the floor of flash is drawn from too: coding is not reserved to the most capable models, which a floor at the level of pro would do, and a floor on the intelligence index would judge a coding router by a measure that is not coding. The versions are those of the model's own entry, in the two files that hold a score for it. Gemini 3 Pro, the floor of pro, and Gemini 3.6 Flash are shown to compare."
    level_gain:
      min_points_per_second: 0.2
      reason: "Like pro, since code is not bounded by time either: 0.2 points a second stops Gemini 4 Hydrogen at High and keeps Gemini 3.8 Flash at Medium, on the figures of 2026-11-21."
    ranking:
      criterion: code_quality
      source: "Epoch AI benchmark data (CC BY 4.0), median position over DeepSWE, SWE-bench Verified, CursorBench, Terminal-Bench and ALE-Bench, at least two benchmarks, WebDev Arena excluded"
      # What the file declares: the online run reads this source. The summary says what each run
      # actually read, and the plain run reads nothing.
      source_status: "read"
      stand_in: intelligence
      tie_margin_points: 2
      reason: "Artificial Analysis publishes no coding index, so the median position over Epoch AI's code benchmarks orders the members, the shorter time deciding between two members less than 2 points of position apart, and a member with no position of its own is placed on one estimated from its intelligence index. The intelligence index orders the whole cascade, as a stand-in, when the data is not read; under 2 points two members are not told apart, so the shorter time decides."
    last_resort:
      members: [deepseek-v4-pro-direct, omniroute-free-code]
      reason: "The paid DeepSeek and the keyless local entry close the cascade by design, and the local entry has no record."
  claude-code:
    derives_from: code
    requires: [tools]
    reason: "The router exists for tool calls: it is code without the models that cannot take them, ranked as code is, in the same order."
  fiction:
    intelligence_floor:
      none: true
      reason: "The router exists for what its models are tuned for, role-play and fiction, which no index measures, and no member has a figure to be held to a floor with: nothing goes under one."
    level_gain:
      min_points_per_second: 0
      reason: "No member has a level the template sets or an index at a level to climb by: the provider's default level is the only one called, so there is no rate to ask."
    ranking:
      criterion: intelligence
      tie_margin_points: 0
      reason: "No member has an index, so no figure orders them and the report keeps each where it is, flagged; the order is the maintainer's, by hand: the newest and largest model first, the smallest last."
    last_resort:
      members: []
      reason: "No member is paid apart from the others or keyless: all six are the same provider's models on the same account allowance, and none is a last resort."
  paid:
    intelligence_floor:
      none: true
      reason: "The router exists to spend a credit on the models of the one provider it holds, every one of which that credit pays for and which no other router holds: a floor would only send the cheapest of them to the last resort, so nothing goes under one."
    level_gain:
      min_points_per_second: 0
      reason: "No member has a level the template sets: each is called at the effort its provider sets as its default, thinking being billed, so there is no rate to ask."
    ranking:
      criterion: intelligence
      tie_margin_points: 2
      reason: "Ranked by capability, as pro is: the index where it is read at the level a member is called at, and otherwise Epoch AI's capabilities index, which measures every member, converted and flagged estimated; under 2 points two members are not told apart, so the shorter time decides."
    last_resort:
      members: []
      reason: "No member is free, keyless or apart from the others: all are paid from the same credit, and none is a last resort."

# One row per entry of the template's model_list. "tools" says whether the entry takes tool calls
# as its provider or LiteLLM declares it ("yes", "no", or "unknown" where nothing is declared, never
# guessed). "slug" is the Artificial Analysis record that
# describes the entry at the level it is CALLED at ("level" names the record's level: minimal, low,
# medium, high, xhigh, max, reasoning, non-reasoning); the template sets a static "reasoning_effort"
# on the entries whose "level_source" says so, the level of every other entry is the provider's
# default, and "level_source" gives the provider's page and the day it was read, or says "unknown". An entry with no record at all says why in "no_record".
# "eci" names the model of Epoch AI's capabilities index (its display name, spelt as the index has it)
# that describes the entry, for the floors and for a member the ranking has no index for; an entry
# whose model the index does not hold says nothing.
# "epoch" lists, per benchmark file of Epoch AI's data kept for the code position (not WebDev Arena,
# which is refused), the model ids the entry was found under (effort suffix included), or says
# "unknown".
# Where Artificial Analysis has no record at the called level, "slug" is the nearest record it has,
# and the report says the level is not ranked. Where the level is unknown, "slug" is the record of
# the highest level the model could be called at by default.
