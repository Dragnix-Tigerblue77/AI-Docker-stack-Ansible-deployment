---
# What each LiteLLM router is held to, and which Artificial Analysis record describes each entry of
# "templates/LiteLLM_config.yaml.j2". Read by "check_LiteLLM_model_drift.py", which reports how the
# cascades stand against it in the weekly issue ("Contrats par routeur"). It is a REPORT: nothing
# here changes a cascade, an entry or a row of the "head" table, no member is removed from a cascade
# by it, and a model that breaks a contract is information, never a failure. The one thing that
# fails the plain run is the file's own shape (a router that does not exist, a number that is not a
# number, a value with no reason, a malformed row or file, a key written twice). A name kept here
# that is no entry of the template any more is not a failure, since a deletion leaves it: the plain
# run prints a notice and the weekly issue lists it as a stale row, to be removed by a person.
#
# PROVISIONAL. Every number and every choice below is a proposal, derived from the figures cited in
# its own reason line, until the maintainer validates it and sets "status" to "validated". The
# criteria a router is held to and the measures behind them are still to be defined with him: what
# is here is what the data of 2026-11-21 allows, not the final list.
#
# NO TIME BUDGET. The goal is to use as many free models as possible, so a slow model is never
# disqualified for being slow. A member is eligible for a router if it reaches the router's
# intelligence floor (and, for "claude-code", takes tool calls), and for nothing else. Time is an
# ordering key: "flash-lite" puts the shortest time to the first answer token first; the other
# routers put the best quality first, and the time decides only between two members whose quality
# differs by less than the router's "tie_margin_points". The report keeps showing each member's time.
#
# The unit of routing is "model + reasoning level". Artificial Analysis publishes one record per
# level, told apart by the suffix of the name ("(Low)", "(High)", "(Non-reasoning)"...), and speed in
# tokens per second is almost flat across levels while the time to the first answer token grows with
# them. The level a router keeps for a model is found by walking up its levels from the lowest and
# climbing to the next only while each extra second of the time to the first answer token buys at
# least the router's "min_points_per_second" points of index. A router that values time asks more
# points per second. The time of one request depends on the request, but what is compared is a model
# against itself, level against level, on the same requests: the rate measures the levels against
# each other and is no prediction for a given request. A step that is no slower and buys points is
# taken, a step that buys no points is not, and neither is one whose time is unknown. On Gemini 4
# Hydrogen (Low 26.9 in 7.6 s, Medium 41.2 in 13.0 s, High 50.8 in 21.5 s, Xhigh 53.9 in 47.4 s) the
# steps buy 2.6, 1.1 and 0.12 points a second: 0.2 stops at High, 1.5 at Medium, 3 at Low. On Gemini
# 3.8 Flash (Low 22.5 in 5.1 s, Medium 30.1 in 14.5 s, High 30.8 in 28.1 s) they buy 0.81 and 0.05:
# 0.2 stops at Medium, 1.5 and 3 at Low (Artificial Analysis free API, read 2026-11-21).
#
# How the figures are read. The time is the mean time to the first ANSWER token ("performance_v3"
# of the free API: the time the model spends thinking is part of it), the intelligence is the
# Artificial Analysis Intelligence Index on the version below, and both are the published figures, as
# the terms of that API ask the issue to cite them.
#
# Floors. A member under its router's floor is not removed: it goes to the router's last resort
# tier, after the members that conform. A floor is an ANCHOR, never a number: "at least as good as
# that entry of the template" (and, where the entry has several levels, at that level), whose index
# the report reads from the ranking at every run. Nothing is copied here, so nothing goes stale when
# Artificial Analysis revises a figure or moves to another version of its index, and an anchor that
# can no longer be read (the entry or its record is gone, or the record has no index) is said in the
# weekly issue instead of leaving a figure nobody checks: the router is then judged against nothing
# until a person names another anchor. Each router lists, as "candidates", other anchors worth
# comparing, and the report shows the outcome of each side by side so that the choice is made on what
# each one does to the cascade. The anchors are Gemini models the template serves: a Flash is at
# least as good as the current Flash-Lite, a Flash-Lite at least as good as the previous one, and
# "pro" at least as good as the lowest level of the one Gemini Flash that has an index at that level
# (the Gemini 3.5, 3.6 and 3.7 Flash have none on version 5 of the scale, so none can anchor
# anything). "code" and "claude-code" are NOT held to the floor of "pro": coding is done well by
# models that are not the most capable ones, so they take the floor of "flash". That floor stays an
# anchor on the intelligence index, since Epoch AI's code benchmarks hold no model below a Gemini
# Flash and no code quality anchor can sit at that level.
#
# "claude-code" exists for one reason, tool calls, so it is "code" without the models that cannot take
# them: it derives from "code", is ranked exactly as "code" is, and its cascade is the cascade of
# "code" with the members that do not support tools taken out, in the same order. The report checks
# that on the template and lists the differences.
#
# "code" (and so "claude-code") is ranked on code quality, read from Epoch AI's benchmark data
# (benchmark_data.zip of epoch.ai/benchmarks, free, no key, CC BY 4.0 with attribution, updated daily) by
# the weekly online run, which cites it with the day it was read. Artificial Analysis publishes no coding
# or agentic index on any tier any more. The method: for each of five benchmark files (DeepSWE,
# SWE-bench Verified, CursorBench, Terminal-Bench external, ALE-Bench), the score of a member is the
# best score among the Epoch AI model ids its entry lists in "models" below for that file; the file
# counts only if at least two members of the cascade have a score in it, and ranks them (1 is the best,
# a tie shares the average rank); the code quality of a member is the median of its ranks, and a member
# that fewer than two files rank is unrankable by code quality and is listed as such. The router puts
# its ranked members first, best code quality first, the shorter time deciding between equal ones. An
# unrankable member is not removed: it follows the ranked ones in the main tier, ordered on the
# intelligence index, and the report says it is ranked on that stand-in. A member of the last resort or
# under the floor goes to the tail as for every other router. WebDev Arena, and any design or UI arena,
# is never read: web interface quality is design, not code. Its known weaknesses: the harnesses differ
# from one benchmark to the next, efforts are mixed, the sets of models differ per benchmark, and the
# effort of some entries is not stated in the file. When the archive cannot be read, the weekly issue
# says so and the intelligence index orders the whole cascade, as a stand-in and nothing more. Each
# entry of "models" below records the Epoch AI model ids it was found under, effort suffix included, or
# "unknown".
#
# A member with no index is "unrankable", not removed: it stays where it is in its cascade, flagged,
# until the fallback below is read. 607 of 764 records have no index on 2026-11-21 (the Gemini 3.6
# Flash, Gemini 3.5 Flash and Gemini 2.5 Pro among them): a model with no index cannot be ranked,
# whatever it is worth.
#
# The intelligence scale is COMPRESSED at its low end. Of the 157 records that have an index on
# 2026-11-21, 37 sit below 15 and 24 below 10, where two points separate models nobody would put in
# the same class, while the top of the scale spreads from 40 to 65. A floor of 5 or 10 is therefore a
# coarse line.
#
# Quota and availability are declared inputs, not constraints: a rate limit or an error on a member
# sends the request to the next member at no cost. "inputs" records the limits the providers publish
# and leaves room for the error rate observed on the gateway, which is not measured yet; nothing in
# the report reads it.

status: provisional
index_version: 5
source: "Artificial Analysis free API (artificialanalysis.ai), figures read 2026-11-21"

# The general intelligence of a member with no index, estimated from Epoch AI's Capabilities Index
# (ECI), which covers many of them. Declared only: reading it is the next step, and every figure it
# gives is to be shown as "estimated". The points are read off the 41 models that have both an index
# (the median over their levels) and an ECI, whose rank correlation is 0.94, on 2026-11-21.
fallback_index:
  source: "Epoch AI Capabilities Index (ECI, benchmark_data.zip of epoch.ai/benchmarks, CC BY 4.0)"
  status: "not read yet"
  flag: "estimated"
  method: "A monotone calibration of the Artificial Analysis index on the ECI, over the models that have both: the median index across a model's levels against its ECI. Used only for a member with no index of its own, and flagged estimated wherever it is used."
  uncertainty: "ECI is one figure per model whereas the index has one per level, so at an ECI of 150 to 165 the index of one model spans about 10 points across its levels, and the points below are a middle line, not a measure."
  points: [[140, 4], [147, 12], [152, 21], [159, 31], [167, 50]]

inputs:
  quota:
    gemini: "unknown: no limit is stated in this repository"
    groq: "Free plan, 30 requests and 8K tokens per minute for these models, per console.groq.com/docs/rate-limits as the template quotes it (checked 2026-09-27)"
    mistral: "A $10 monthly API credit shared by every entry, per mistral.ai/pricing as the template quotes it (checked 2026-09-27); per-model limits only in the account's admin panel"
    deepseek: "No free quota: a prepaid balance, per api-docs.deepseek.com/faq as the template quotes it (checked 2026-09-27)"
    openrouter: "20 requests per minute and 50 per day, 1000 once 10 credits are bought, counted across every :free model of the account together, per openrouter.ai/docs/api_reference/limits as the template quotes it (checked 2026-09-27)"
    omniroute: "No quota: local and keyless"
  observed_error_rate: "not measured yet: a future input from the gateway"

routers:
  pro:
    intelligence_floor:
      anchor: {entry: gemini-3-8-flash, level: low}
      candidates:
        - {entry: gemini-3-5-flash-lite}
        - {entry: gemini-3-8-flash, level: low}
        - {entry: gemini-3-8-flash, level: medium}
      reason: "At least as good as Gemini 3.8 Flash at its lowest level (22.5 on 2026-11-21), the one Gemini Flash with an index that a reasoning router can be anchored on. Gemini 3.5 Flash-Lite and Gemini 3.8 Flash at Medium are shown to compare."
    level_gain:
      min_points_per_second: 0.2
      reason: "pro asks little of an extra second, since nothing here is bounded by time: 0.2 points a second stops Gemini 4 Hydrogen at High (the step to Xhigh buys 3.1 points in 25.9 s, 0.12 a second) and keeps Gemini 3.8 Flash at Medium (High buys 0.7 in 13.6 s, 0.05), on the figures of 2026-11-21."
    ranking:
      criterion: intelligence
      tie_margin_points: 2
      reason: "The template ranks pro by capability and the index is the one general figure the free API gives; under 2 points two members are not told apart (Gemini 3.8 Flash at Medium and High differ by 0.7), so the shorter time decides."
    last_resort:
      members: [deepseek-v4-pro-direct, omniroute-free-reasoning]
      reason: "The template places the paid DeepSeek and the keyless local entry after every free one on purpose, and the local entry has no record to be judged on."
  flash:
    intelligence_floor:
      anchor: {entry: gemini-3-5-flash-lite}
      candidates:
        - {entry: gemini-3-1-flash-lite}
        - {entry: gemini-3-5-flash-lite}
        - {entry: gemini-3-8-flash, level: low}
      reason: "At least as good as Gemini 3.5 Flash-Lite (11.7 on 2026-11-21), the current Flash-Lite we serve: a Flash is at least as good as it. gpt-oss-120b, Mistral Small 4, Gemma 4 31B and Qwen3.8 27B without reasoning fall under it. Gemini 3.1 Flash-Lite and Gemini 3.8 Flash at Low are shown to compare."
    level_gain:
      min_points_per_second: 1.5
      reason: "A daily driver that values time asks more of each extra second: 1.5 points a second stops Gemini 4 Hydrogen at Medium (High buys 9.6 points in 8.4 s, 1.1 a second) and keeps Gemini 3.8 Flash at Low (Medium buys 7.6 in 9.4 s, 0.81), on the figures of 2026-11-21."
    ranking:
      criterion: intelligence
      tie_margin_points: 2
      reason: "The template ranks flash by capability; under 2 points two members are not told apart, so the shorter time decides."
    last_resort:
      members: [deepseek-flash-direct, omniroute-free-auto, openrouter-auto-free]
      reason: "The paid DeepSeek, the keyless local entry and OpenRouter's free router, which has no record, close the cascade by design."
  flash-lite:
    intelligence_floor:
      anchor: {entry: gemini-3-1-flash-lite}
      candidates:
        - {entry: nemotron-lightning-free}
        - {entry: gemini-3-1-flash-lite}
        - {entry: qwen3-8-27b-groq}
      reason: "At least as good as Gemini 3.1 Flash-Lite (6.2 on 2026-11-21), the previous Flash-Lite we still serve and the head of this cascade today: a Flash-Lite is at least as good as it. Nemotron 3.5 Lightning and Qwen3.8 27B without reasoning are shown to compare."
    level_gain:
      min_points_per_second: 3
      reason: "The router that values time most asks the most of each extra second: 3 points a second keeps Gemini 4 Hydrogen at Low (Medium buys 14.3 points in 5.4 s, 2.6 a second) and Gemini 3.8 Flash at Low (Medium buys 0.81), on the figures of 2026-11-21."
    ranking:
      criterion: first_answer
      reason: "The template makes speed the point of this router, so the time to the first answer token orders it, shortest first."
    last_resort:
      members: []
      reason: "No keyless local entry is in this cascade, so nothing is exempt from the floor."
  code:
    intelligence_floor:
      anchor: {entry: gemini-3-5-flash-lite}
      candidates:
        - {entry: gemini-3-1-flash-lite}
        - {entry: gemini-3-5-flash-lite}
        - {entry: gemini-3-8-flash, level: low}
      # Epoch AI's code benchmarks hold no model below a Gemini Flash (no Flash-Lite is on two of them),
      # so no code quality anchor can sit at the flash level: the floor stays on the intelligence index.
      reason: "Declared on the intelligence index, at the floor of flash: coding is not reserved to the most capable models, which a floor at the level of pro would do, and the code quality source holds no model at the level of that floor, so it cannot express it. Gemini 3.1 Flash-Lite and Gemini 3.8 Flash at Low, the floor of pro, are shown to compare."
    level_gain:
      min_points_per_second: 0.2
      reason: "Like pro, since code is not bounded by time either: 0.2 points a second stops Gemini 4 Hydrogen at High and keeps Gemini 3.8 Flash at Medium, on the figures of 2026-11-21."
    ranking:
      criterion: code_quality
      source: "Epoch AI benchmark data (CC BY 4.0), median rank over DeepSWE, SWE-bench Verified, CursorBench, Terminal-Bench and ALE-Bench, at least two benchmarks, WebDev Arena excluded"
      # What the file declares: the weekly online run reads this source. The issue says what each run
      # actually read, and the plain run reads nothing.
      source_status: "read"
      stand_in: intelligence
      tie_margin_points: 2
      reason: "Artificial Analysis publishes no coding index, so the median rank over Epoch AI's code benchmarks orders the members it can rank, the shorter time deciding between equal medians. The intelligence index stands in for the members it cannot rank and for the whole cascade when the data is not read; under 2 points two of those are not told apart, so the shorter time decides."
    last_resort:
      members: [deepseek-v4-pro-direct, omniroute-free-code]
      reason: "The paid DeepSeek and the keyless local entry close the cascade by design, and the local entry has no record."
  claude-code:
    derives_from: code
    requires: [tools]
    reason: "The router exists for tool calls: it is code without the models that cannot take them, ranked as code is, in the same order."

# One row per entry of the template's model_list. "tools" says whether the entry takes tool calls
# as its provider or LiteLLM declares it ("yes", "no", or "unknown" where nothing is declared, never
# guessed). "slug" is the Artificial Analysis record that
# describes the entry at the level it is CALLED at ("level" names the record's level: minimal, low,
# medium, high, xhigh, max, reasoning, non-reasoning); the template sets no "reasoning_effort"
# anywhere, so the level is the provider's default, and "level_source" gives the provider's page and
# the day it was read, or says "unknown". An entry with no record at all says why in "no_record".
# "epoch" lists, per benchmark file of Epoch AI's data kept for code quality (not WebDev Arena, which
# is refused), the model ids the entry was found under (effort suffix included), or says "unknown".
# Where Artificial Analysis has no record at the called level, "slug" is the nearest record it has,
# and the report says the level is not ranked. Where the level is unknown, "slug" is the record of
# the highest level the model could be called at by default.
models:
  gemini-3-8-flash:
    slug: gemini-3-8-flash-medium
    level: medium
    level_source: "ai.google.dev/gemini-api/docs/thinking, read 2026-11-21: default thinking level medium for gemini-3.8-flash"
    tools: {support: "yes", source: "LiteLLM model map, supports_function_calling"}
    epoch:
      deepswe_external: [gemini-3.8-flash_high, gemini-3.8-flash_medium]
      ale_bench_external: [gemini-3.8-flash_high]
  gemini-3-7-flash:
    slug: gemini-3-7-flash
    level: unknown
    level_source: "unknown: ai.google.dev/gemini-api/docs/thinking, read 2026-11-21, has no row for gemini-3.7-flash"
    tools: {support: "yes", source: "LiteLLM model map, supports_function_calling"}
    epoch:
      deepswe_external: [gemini-3.7-flash_high, gemini-3.7-flash_low, gemini-3.7-flash_medium]
      ale_bench_external: [gemini-3.7-flash_high]
  gemini-3-6-flash:
    slug: gemini-3-6-flash
    level: medium
    level_source: "ai.google.dev/gemini-api/docs/thinking, read 2026-11-21: default thinking level medium for gemini-3.6-flash"
    note: "Artificial Analysis ranks it at High only"
    tools: {support: "yes", source: "LiteLLM model map, supports_function_calling"}
    epoch:
      deepswe_external: [gemini-3.6-flash_high]
      ale_bench_external: [gemini-3.6-flash_high]
  gemini-3-5-flash:
    slug: gemini-3-5-flash
    level: unknown
    level_source: "unknown: ai.google.dev/gemini-api/docs/thinking, read 2026-11-21, has a row for gemini-3.5-flash-lite only"
    tools: {support: "yes", source: "LiteLLM model map, supports_function_calling"}
    epoch:
      deepswe_external: [gemini-3.5-flash_high, gemini-3.5-flash_medium]
      swe_bench_verified: [gemini-3.5-flash_high]
      ale_bench_external: [gemini-3.5-flash_high]
  gemini-3-5-flash-lite:
    slug: gemini-3-5-flash-lite
    level: minimal
    level_source: "ai.google.dev/gemini-api/docs/thinking, read 2026-11-21: default thinking level minimal for gemini-3.5-flash-lite"
    note: "Artificial Analysis publishes one record and does not state its level"
    tools: {support: "yes", source: "LiteLLM model map, supports_function_calling"}
    epoch:
      ale_bench_external: [gemini-3.5-flash-lite_high]
  gemini-3-1-flash-lite:
    slug: gemini-3-1-flash-lite-preview
    level: minimal
    level_source: "ai.google.dev/gemini-api/docs/thinking, read 2026-11-21: default thinking level minimal for gemini-3.1-flash-lite"
    note: "Artificial Analysis publishes one record, its slug carries the retired preview's name and its level is not stated"
    tools: {support: "yes", source: "LiteLLM model map, supports_function_calling"}
    epoch:
      ale_bench_external: [gemini-3.1-flash-lite]
    epoch_note: "some ids carry no effort suffix: the effort of those runs is not stated"
  gemini-3-flash-preview:
    slug: gemini-3-flash-reasoning
    level: reasoning
    level_source: "ai.google.dev/gemini-api/docs/thinking, read 2026-11-21: default thinking level high for gemini-3-flash-preview"
    note: "Artificial Analysis splits this model into Reasoning and Non-reasoning only, so high maps to Reasoning"
    tools: {support: "yes", source: "LiteLLM model map, supports_function_calling"}
    epoch:
      swe_bench_verified: [gemini-3-flash-preview]
      terminalbench_external: [gemini-3-flash-preview]
      ale_bench_external: [gemini-3-flash-preview]
    epoch_note: "some ids carry no effort suffix: the effort of those runs is not stated"
  gemini-2-5-pro:
    slug: gemini-2-5-pro
    level: unknown
    level_source: "unknown: ai.google.dev/gemini-api/docs/thinking, read 2026-11-21, gives gemini-2.5-pro thinking on with no level"
    note: "A thinking budget, not a level: the one record Artificial Analysis has is the nearest"
    tools: {support: "yes", source: "LiteLLM model map, supports_function_calling"}
    epoch:
      swe_bench_verified: [gemini-2.5-pro]
      terminalbench_external: [gemini-2.5-pro]
      ale_bench_external: [gemini-2.5-pro_32K]
    epoch_note: "some ids carry no effort suffix: the effort of those runs is not stated"
  gemini-2-5-flash:
    slug: gemini-2-5-flash-reasoning
    level: unknown
    level_source: "unknown: ai.google.dev/gemini-api/docs/thinking, read 2026-11-21, gives gemini-2.5-flash thinking on with no level"
    note: "A thinking budget, not a level: the Reasoning record is the nearest"
    tools: {support: "yes", source: "LiteLLM model map, supports_function_calling"}
    epoch:
      terminalbench_external: [gemini-2.5-flash]
      ale_bench_external: [gemini-2.5-flash]
    epoch_note: "some ids carry no effort suffix: the effort of those runs is not stated"
  gemini-2-5-flash-lite:
    slug: gemini-2-5-flash-lite
    level: non-reasoning
    level_source: "ai.google.dev/gemini-api/docs/thinking, read 2026-11-21: gemini-2.5-flash-lite has thinking off by default"
    tools: {support: "yes", source: "LiteLLM model map, supports_function_calling"}
    epoch: unknown
  gemma-4-31b-gemini:
    slug: gemma-4-31b
    level: unknown
    level_source: "unknown: ai.google.dev/gemma/docs/capabilities/thinking, read 2026-11-21, states no default for the Gemini API"
    note: "Artificial Analysis has a Reasoning and a Non-reasoning record"
    tools: {support: "yes", source: "LiteLLM model map, supports_function_calling"}
    epoch:
      ale_bench_external: [gemma-4-31b-it]
    epoch_note: "some ids carry no effort suffix: the effort of those runs is not stated"
  gemma-4-26b-gemini:
    slug: gemma-4-26b-a4b
    level: unknown
    level_source: "unknown: ai.google.dev/gemma/docs/capabilities/thinking, read 2026-11-21, states no default for the Gemini API"
    note: "Artificial Analysis has a Reasoning and a Non-reasoning record"
    tools: {support: "yes", source: "LiteLLM model map, supports_function_calling"}
    epoch:
      ale_bench_external: [gemma-4-26b-a4b]
    epoch_note: "some ids carry no effort suffix: the effort of those runs is not stated"
  gemma-4-31b-free:
    slug: gemma-4-31b
    level: unknown
    level_source: "unknown: openrouter.ai/google/gemma-4-31b-it:free, read 2026-11-21, says nothing of a reasoning default"
    note: "Artificial Analysis has a Reasoning and a Non-reasoning record"
    tools: {support: "yes", source: "OpenRouter catalogue, tools among supported_parameters, read 2026-11-21"}
    epoch:
      ale_bench_external: [gemma-4-31b-it]
    epoch_note: "some ids carry no effort suffix: the effort of those runs is not stated"
  gemma-4-26b-free:
    slug: gemma-4-26b-a4b
    level: unknown
    level_source: "unknown: openrouter.ai/google/gemma-4-26b-a4b-it:free, read 2026-11-21, says nothing of a reasoning default"
    note: "Artificial Analysis has a Reasoning and a Non-reasoning record"
    tools: {support: "yes", source: "OpenRouter catalogue, tools among supported_parameters, read 2026-11-21"}
    epoch:
      ale_bench_external: [gemma-4-26b-a4b]
    epoch_note: "some ids carry no effort suffix: the effort of those runs is not stated"
  codestral:
    no_record: "Artificial Analysis lists no Codestral on 2026-11-21"
    tools: {support: "yes", source: "LiteLLM model map, supports_function_calling"}
    epoch: unknown
  codestral-2508:
    no_record: "Artificial Analysis lists no Codestral on 2026-11-21"
    tools: {support: "yes", source: "LiteLLM model map, supports_function_calling"}
    epoch:
      ale_bench_external: [codestral-2508]
    epoch_note: "some ids carry no effort suffix: the effort of those runs is not stated"
  mistral-medium:
    slug: mistral-medium-3-5
    level: unknown
    level_source: "unknown: docs.mistral.ai/capabilities/reasoning/adjustable, read 2026-11-21, gives no default for Mistral Medium 3.5"
    note: "Artificial Analysis publishes one record"
    tools: {support: "yes", source: "LiteLLM model map, supports_function_calling"}
    epoch: unknown
  mistral-small:
    slug: mistral-small-4
    level: unknown
    level_source: "unknown: docs.mistral.ai/capabilities/reasoning/adjustable, read 2026-11-21, gives no default for Mistral Small 4"
    note: "Artificial Analysis has a Reasoning and a Non-reasoning record"
