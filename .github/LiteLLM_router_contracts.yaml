  gemini-4-hydrogen:
    slug: gemini-4-hydrogen
    level: xhigh
    level_source: "static reasoning_effort xhigh in the template, the highest level ai.google.dev/gemini-api/docs/thinking (read 2026-11-24) gives the model, which LiteLLM sends to Google as the thinking level (its source, read 2026-11-24)"
    eci: "Gemini 4 Hydrogen"
