#
# The runner deploys onto itself: the "managed node" of this run is the CI machine, reached without
# SSH. The group is the one "playbook.Artificial_Intelligence.example.yaml" targets, so the example runs
# unedited. "ansible_playbook_python" is the interpreter "actions/setup-python" installed, the one the
# job also installs the "docker" SDK into -- "community.docker.docker_host_info" needs it on the
# managed node, and here the managed node is this very interpreter.
[Artificial_Intelligence_servers]
localhost ansible_connection=local ansible_python_interpreter="{{ ansible_playbook_python }}"
