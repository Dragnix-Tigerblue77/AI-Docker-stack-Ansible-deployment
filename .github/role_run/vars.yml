---
# Extra vars for both "role run" jobs of ".github/workflows/ansible-ci.yml", which run the EXAMPLE
# playbook itself, unedited, to its last task.
#
# Every "vault_*" the example reads gets a placeholder here. None of them is a secret, and none has to
# work: nothing is started, so nothing ever authenticates with them. What they have to do is exist, and
# differ from each other where the role's asserts say so, so that the role judges the example exactly
# as it would judge a caller copying it. Every provider key is given, though one would do: the example
# reads them all, and "check_compose_template.py" is what renders the other sets of keys.
vault_Artificial_Intelligence_Claude_code_virtual_key: "sk-role-run-placeholder-claude-code"
vault_Artificial_Intelligence_LibreChat_JWT_refresh_secret: "role-run-placeholder-LibreChat_JWT_refresh_secret"
vault_Artificial_Intelligence_LibreChat_JWT_secret: "role-run-placeholder-LibreChat_JWT_secret"
vault_Artificial_Intelligence_LibreChat_admin_email: "role-run-placeholder-LibreChat_admin_email"
vault_Artificial_Intelligence_LibreChat_admin_name: "role-run-placeholder-LibreChat_admin_name"
vault_Artificial_Intelligence_LibreChat_admin_password: "role-run-placeholder-LibreChat_admin_password"
vault_Artificial_Intelligence_LibreChat_admin_username: "role-run-placeholder-LibreChat_admin_username"
vault_Artificial_Intelligence_LibreChat_creds_IV: "role-run-placeholder-LibreChat_creds_IV"
vault_Artificial_Intelligence_LibreChat_creds_key: "role-run-placeholder-LibreChat_creds_key"
vault_Artificial_Intelligence_LiteLLM_Cent_AI_API_key: "role-run-placeholder-LiteLLM_Cent_AI_API_key"
vault_Artificial_Intelligence_LiteLLM_Cloudflare_API_key: "role-run-placeholder-LiteLLM_Cloudflare_API_key"
vault_Artificial_Intelligence_LiteLLM_Cloudflare_account_ID: "role-run-placeholder-LiteLLM_Cloudflare_account_ID"
vault_Artificial_Intelligence_LiteLLM_DeepSeek_API_key: "role-run-placeholder-LiteLLM_DeepSeek_API_key"
vault_Artificial_Intelligence_LiteLLM_Gemini_API_key: "role-run-placeholder-LiteLLM_Gemini_API_key"
vault_Artificial_Intelligence_LiteLLM_Groq_API_key: "role-run-placeholder-LiteLLM_Groq_API_key"
vault_Artificial_Intelligence_LiteLLM_Mistral_API_key: "role-run-placeholder-LiteLLM_Mistral_API_key"
vault_Artificial_Intelligence_LiteLLM_NVIDIA_API_key: "role-run-placeholder-LiteLLM_NVIDIA_API_key"
vault_Artificial_Intelligence_LiteLLM_OpenRouter_API_key: "role-run-placeholder-LiteLLM_OpenRouter_API_key"
