# The two overrides the run needs, both extra vars so they win over the example's own role
# parameters without the example being edited:
#
#   * the deployer is the stand-in under ".github/role_run/roles/", not the caller's own
#     deployment role, which this repository does not contain;
#   * no LiteLLM internal user, since provisioning one needs a gateway actually answering on
#     port 4000, and this run starts no container.
Artificial_Intelligence_Docker_stack_deployment_role_name: "role_run_deployer"
Artificial_Intelligence_LiteLLM_internal_users: []
