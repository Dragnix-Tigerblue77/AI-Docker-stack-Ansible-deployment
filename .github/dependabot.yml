---
# Sans ce fichier, Dependabot ne tourne pas : les versions epinglees de "requirements.txt" et les
# actions epinglees des workflows resteraient figees, et le commentaire de "requirements.txt" qui
# annonce le contraire serait faux.
#
# ! Il n'y a pas d'ecosysteme Dependabot pour un telechargement de release brut : la version de
#   gitleaks epinglee dans "gitleaks.yml" -- et son empreinte SHA-256, qui va avec -- se relevent
#   a la main sur la page des releases du projet.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  # Les workflows epinglent "actions/checkout@v5" et "actions/setup-python@v5".
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
