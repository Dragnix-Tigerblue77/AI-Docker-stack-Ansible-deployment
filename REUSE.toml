version = 1
SPDX-PackageName = "AI-Docker-stack-Ansible-deployment"
SPDX-PackageDownloadLocation = "https://github.com/Dragnix-Tigerblue77/AI-Docker-stack-Ansible-deployment"

# Every file this repository can annotate carries its two SPDX lines in its own header, which is what
# the REUSE specification asks for. The two groups below cannot, and each is declared here rather
# than left uncovered -- an uncovered file is one "reuse lint" reports, and a report nobody can act
# on is how a check gets disabled.

# Rendered onto the managed node rather than kept here: a header in one of these does not stay in
# this repository, it ends up in the deployed "docker-compose.yml", in a file the operator reads on
# the target. The same reasoning as "Homelab_Ansible_deployment", which declares the same path under
# "roles/**/" there -- this repository IS the role, so the path has no "roles/**/" prefix to carry.
[[annotations]]
path = "templates/**"
SPDX-FileCopyrightText = "2026 Tigerblue77"
SPDX-License-Identifier = "AGPL-3.0-only"

# "files/**" is the same case as "templates/**" above, just copied verbatim rather than rendered:
# LibreChat's own configuration file (#4) is deployed onto the managed node, where it is a file the
# LibreChat container reads directly, not a source file of this repository. It has comment syntax,
# unlike the JSON below, which is exactly why leaving it unannotated would be a choice rather than a
# necessity -- and the wrong one, for the same reason as "templates/**".
[[annotations]]
path = "files/**"
SPDX-FileCopyrightText = "2026 Tigerblue77"
SPDX-License-Identifier = "AGPL-3.0-only"

# JSON has no comment syntax at all: a "#" line is not a comment there, it is a parse error.
#
# There IS another way -- REUSE reads a sidecar "<file>.license" -- so this is a choice rather than
# a necessity, and it is worth saying which: a sidecar is a second file whose entire content is a
# header, sitting next to every JSON the repository will ever hold. Declaring the extension once
# here costs one rule, and it is what "Homelab_Ansible_deployment" does for the same reason.
#
# It covers a file that does not exist on "main" yet -- ".claude/settings.json", which #22 brings --
# and that is deliberate: without it, enabling "reuse lint" here would turn that open pull request
# red on a file its author would have to grow a sidecar for.

[[annotations]]
path = ["**/*.json"]
SPDX-FileCopyrightText = "2026 Tigerblue77"
SPDX-License-Identifier = "AGPL-3.0-only"

# The n8n collector of #20 is the one group of JSON files here that someone else wrote: all seven
# are Dragnix-23's (8fbe76c), and the later commit that renamed "AIS" in their workflow and
# credential names changed identifiers, not authorship. CONTRIBUTING.md is explicit that a
# contributor keeps the copyright in what he writes, so the rule above would make "reuse lint" green
# with a name that is not true -- the one thing a header must never do. The README next to them
# names him in its own header; this is the same statement for the files that cannot carry one.
#
# It has to stay BELOW "**/*.json": when two annotations match a file, the last one here wins.
[[annotations]]
path = "workflows/n8n/**/*.json"
SPDX-FileCopyrightText = "2026 Dragnix-23"
SPDX-License-Identifier = "AGPL-3.0-only"
