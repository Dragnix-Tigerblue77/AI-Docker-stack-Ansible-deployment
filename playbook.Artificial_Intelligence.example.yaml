---
# EXAMPLE playbook: it shows how the role is called, it is not meant to be run as-is.
#
# This repository holds one role. The inventory, the FQDNs, the reverse proxy labels, the published
# network and the role that actually deploys the stack all belong to the caller -- that is what lets
# two people deploy the same stack onto two estates with nothing in common, without forking.
#
# The group name below therefore exists only in this example: put your inventory's own there.

- name: "Deploy the Artificial Intelligence stack"
  hosts: Artificial_Intelligence_servers
  become: true

  roles:
    - role: deploy_Artificial_Intelligence_Docker_stack
      vars:
        # MANDATORY. The role renders the stack's compose file, it does not deploy it: this parameter
        # names the role that does. That role has to render "{{ Docker_compose_file_name }}.j2" from
        # ITS OWN CALLER's "templates/" -- that is, from the Artificial Intelligence role's -- and read the three other
        # variables "tasks/main.yml" hands it. The README spells the contract out.
        Artificial_Intelligence_Docker_stack_deployment_role_name: "your_stack_deployment_role"

        # Whatever the role named above needs is the CALLER's to provide: this role cannot know what
        # that is, since the role is chosen by a variable, and neither of its asserts can check for it.
        # A variable that role reads without defaulting it is declared here, next to this one.

        # The time zone handed to every container. A caller that already carries its own passes it here
        # rather than restating it, so the stack's containers and the host running them tell the same
        # time.
        Artificial_Intelligence_server_time_zone: "{{ server_time_zone | default('Etc/UTC') }}"

        # The published network, created and named by the caller, the one their reverse proxy listens
        # on. The two are set together. Until a service of the stack has a web interface, leaving them
        # at "false" is the right call: nothing attaches to it.
        #
        # Artificial_Intelligence_published_Docker_network_name: "{{ DMZ_Docker_network_name }}"
        # Artificial_Intelligence_published_Docker_network_definition: "{{ DMZ_Docker_network_definition }}"

        # MANDATORY since #1, and without a default: a default password is a password, and one
        # shipped in a repository is a published one. All three come from the caller's vault -- here
        # in the "ansible-vault encrypt_string" form, so the ciphertext lives in the playbook and the
        # clear text nowhere.
        #
        # The role interpolates them straight into the rendered compose file -- never into a ".env":
        # that file already carries the "0600" / "diff: false" contract the deployment role owes it.
        Artificial_Intelligence_PostgreSQL_password: "{{ vault_Artificial_Intelligence_PostgreSQL_password }}"

        # MANDATORY since #159, and without a default: PostgreSQL's own superuser, which LiteLLM no
        # longer is -- the password above is its ordinary role's. A DIFFERENT value, vaulted the same
        # way: the role refuses the same one for both.
        Artificial_Intelligence_PostgreSQL_superuser_password: "{{ vault_Artificial_Intelligence_PostgreSQL_superuser_password }}"

        # ADMINISTRATION ONLY. It is never handed to a consumer: Open WebUI, N8N, the Claude Code
        # container and the Discord bot each get their own virtual key, carrying their own model
        # allow-list, created in #2. A client holding this key makes that whole isolation pointless.
        Artificial_Intelligence_LiteLLM_master_key: "{{ vault_Artificial_Intelligence_LiteLLM_master_key }}"

        # MANDATORY since #164, and without a default: the key LiteLLM encrypts the credentials stored
        # from "/ui" with. A DIFFERENT value from the master key -- the role refuses the same one -- and
        # one that never changes once a credential is stored. A deployment that ran without it needs
        # the migration in the role's README, "La clé de sel (#164)", not a fresh value.
        Artificial_Intelligence_LiteLLM_salt_key: "{{ vault_Artificial_Intelligence_LiteLLM_salt_key }}"

        # "/ui"'s own password, now that its port is published (see the role's README for why). Basic
        # protection -- a login form, not HTTP basic auth, and no TLS -- but the one thing standing
        # between the LAN and the dashboard of the container that holds both accounts' provider keys
        # plus the master key -- so it is vaulted like the secrets above, not left to a default.
        Artificial_Intelligence_LiteLLM_UI_password: "{{ vault_Artificial_Intelligence_LiteLLM_UI_password }}"


        # The provider keys of the gateway's one account (#2, v1 scope). Give at least one (#296): a
        # provider whose key is left out, or empty, has no model in the gateway at all. Another
        # account's own arrive as model_list entries of their own (#107) -- not from its "/ui" login,
        # which LiteLLM does not let add a model.
        # No GitHub key here: GitHub Models is retired (#109), and the role no longer asks for one. No
        # Cerebras key either: Cerebras has no free tier any more, its entries are commented out (#200).
        Artificial_Intelligence_LiteLLM_Gemini_API_key: "{{ vault_Artificial_Intelligence_LiteLLM_Gemini_API_key }}"
        Artificial_Intelligence_LiteLLM_Mistral_API_key: "{{ vault_Artificial_Intelligence_LiteLLM_Mistral_API_key }}"
        Artificial_Intelligence_LiteLLM_Groq_API_key: "{{ vault_Artificial_Intelligence_LiteLLM_Groq_API_key }}"
        Artificial_Intelligence_LiteLLM_OpenRouter_API_key: "{{ vault_Artificial_Intelligence_LiteLLM_OpenRouter_API_key }}"
        # DeepSeek is PAID, like Mistral above: leave a paid provider's key out not to use it.
        Artificial_Intelligence_LiteLLM_DeepSeek_API_key: "{{ vault_Artificial_Intelligence_LiteLLM_DeepSeek_API_key }}"
        # Cloudflare Workers AI is free within a daily allowance, and takes two values given together or not
        # at all: its API token, and the identifier of its account. One account only: opening a second to
        # double the allowance is what its terms forbid.
        Artificial_Intelligence_LiteLLM_Cloudflare_API_key: "{{ vault_Artificial_Intelligence_LiteLLM_Cloudflare_API_key }}"
        Artificial_Intelligence_LiteLLM_Cloudflare_account_ID: "{{ vault_Artificial_Intelligence_LiteLLM_Cloudflare_account_ID }}"
        # Z AI serves GLM-4.7-Flash free of charge: one key, the account's own.
        Artificial_Intelligence_LiteLLM_Zai_API_key: "{{ vault_Artificial_Intelligence_LiteLLM_Zai_API_key }}"
        # Requesty serves a few models free for now, in one daily quota shared by all of them: one key, the
        # account's own.
        Artificial_Intelligence_LiteLLM_Requesty_API_key: "{{ vault_Artificial_Intelligence_LiteLLM_Requesty_API_key }}"
        # NVIDIA's hosted API is a free TRIAL service: its terms allow it for testing and evaluation only, not
        # in production, let NVIDIA collect the content to improve its models, and forbid personal data.
        Artificial_Intelligence_LiteLLM_NVIDIA_API_key: "{{ vault_Artificial_Intelligence_LiteLLM_NVIDIA_API_key }}"
        # Cent AI serves one model free until the end of November and has not said what follows: give a key
        # that carries a spending limit, so that a billed call fails instead of costing anything.
        Artificial_Intelligence_LiteLLM_Cent_AI_API_key: "{{ vault_Artificial_Intelligence_LiteLLM_Cent_AI_API_key }}"
        # Aion Labs serves models for role-play and fiction, unmoderated, and only through the "Fiction" access group
        # and the "Auto-Fiction" router: no key holding "LLM" reaches them. Its free allowance is 20,000 tokens a day.
        Artificial_Intelligence_LiteLLM_Aion_Labs_API_key: "{{ vault_Artificial_Intelligence_LiteLLM_Aion_Labs_API_key }}"
        # Vercel AI Gateway serves some models out of a small monthly free credit, which needs a payment method on the
        # team: never buy credit and leave Auto-reload off, since the first purchase ends the free credit for good.
        Artificial_Intelligence_LiteLLM_Vercel_AI_Gateway_API_key: "{{ vault_Artificial_Intelligence_LiteLLM_Vercel_AI_Gateway_API_key }}"

        # A LIST (#103), empty by default: one entry per additional person, each becoming their own
        # restricted "internal_user" LiteLLM login with one virtual key -- which reaches every model
        # until #2 builds per-account isolation (#114). Adding a third person is adding a third entry
        # here, never a new pair of variables named after them.
        # See the role's README, "Un compte par personne, pas une paire figée".
        Artificial_Intelligence_LiteLLM_internal_users:
          - username: "alice"
            email: "{{ vault_Artificial_Intelligence_LiteLLM_alice_email }}"

        # A LIST too, empty by default: each entry becomes a LiteLLM "proxy_admin", invited and never given a
        # password -- the run shows a one-use link, where the person chooses their own. Usernames and emails must
        # differ from the internal users'. See the role's README, "Les administrateurs de `/ui`".
        Artificial_Intelligence_LiteLLM_admin_users:
          - username: "bob"
            email: "{{ vault_Artificial_Intelligence_LiteLLM_admin_email }}"

        # MANDATORY since #71, and without a default: "--requirepass" would otherwise be empty.
        Artificial_Intelligence_Redis_password: "{{ vault_Artificial_Intelligence_Redis_password }}"

        # MANDATORY since #73, and without a default: the image ships "CHANGEME" otherwise, which
        # upstream documents as deliberately weak. OmniRoute's port is published for the dashboard,
        # same reasoning as LiteLLM's "/ui" (#1).
        Artificial_Intelligence_OmniRoute_dashboard_password: "{{ vault_Artificial_Intelligence_OmniRoute_dashboard_password }}"

        # MANDATORY since #3, and without a default: #3 requires an API key on Qdrant even though no
        # port is published, as defence-in-depth against a compromised workload on the internal
        # network.
        Artificial_Intelligence_Qdrant_API_key: "{{ vault_Artificial_Intelligence_Qdrant_API_key }}"

        # MANDATORY since #76, all four, without a default: LibreChat generates temporary values on
        # first start otherwise, and keeps them nowhere but its own volume -- unsuitable for
        # production by its own documentation.
        Artificial_Intelligence_LibreChat_creds_key: "{{ vault_Artificial_Intelligence_LibreChat_creds_key }}"
        Artificial_Intelligence_LibreChat_creds_IV: "{{ vault_Artificial_Intelligence_LibreChat_creds_IV }}"
        Artificial_Intelligence_LibreChat_JWT_secret: "{{ vault_Artificial_Intelligence_LibreChat_JWT_secret }}"
        Artificial_Intelligence_LibreChat_JWT_refresh_secret: "{{ vault_Artificial_Intelligence_LibreChat_JWT_refresh_secret }}"

        # MANDATORY since #76, without a default: the LibreChat accounts the role creates, "admin: true"
        # granting the ADMIN role. See "Le contrat du rôle de déploiement" in the role's README for why
        # this only works when the deployment target is Compose.
        Artificial_Intelligence_LibreChat_users:
          - email: "{{ vault_Artificial_Intelligence_LibreChat_admin_email }}"
            name: "{{ vault_Artificial_Intelligence_LibreChat_admin_name }}"
            username: "{{ vault_Artificial_Intelligence_LibreChat_admin_username }}"
            password: "{{ vault_Artificial_Intelligence_LibreChat_admin_password }}"
            admin: true

        # #13's agent is deployed with the stack, like every other service: its virtual key is
        # MANDATORY, without a default. The key is a value YOU pick -- it starts with "sk-", holds at
        # least 16 characters and differs from the master key -- and the role registers it in LiteLLM
        # itself, with the agent's model as its only allow-list.
        Artificial_Intelligence_Claude_code_virtual_key: "{{ vault_Artificial_Intelligence_Claude_code_virtual_key }}"
        #
        # The GitHub token is OPTIONAL (#245): left out, the container gets no "GH_TOKEN" and no
        # "GITHUB_TOKEN". Claude Code reads them itself to call the GitHub API, for its PR status
        # footer among others, and the image has no "gh" to fall back on: a deployment without a
        # token loses the footer, and its other calls go out without one. Given, it must be a
        # non-empty string.
        #
        # A caller that does not want the agent switches it off. Left here commented, the way the
        # published network above is, rather than omitted.
        #
        # Artificial_Intelligence_Claude_code_enabled: false
        #
        # Its working directory is a named Docker volume unless you give an absolute path of the
        # node, which must exist there and be writable by the image's "node" user.
        #
        # Artificial_Intelligence_Claude_code_workspace_directory: "/srv/Artificial_Intelligence/workspace/claude_code"
        # Artificial_Intelligence_Claude_code_GitHub_token: "{{ vault_Artificial_Intelligence_Claude_code_GitHub_token }}"
