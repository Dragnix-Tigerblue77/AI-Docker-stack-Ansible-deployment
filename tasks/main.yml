---
# tasks file for deploy_Artificial_Intelligence_Docker_stack

# Both checks are made HERE, up front and outside any condition, rather than left to whatever reads
# the variable: a parameter read behind a condition that almost never holds is a parameter nobody
# notices is missing, until the day it is missing on a fresh machine.
- name: "Check the Artificial Intelligence stack parameters"
  ansible.builtin.assert:
    that:
      - Artificial_Intelligence_Docker_stack_deployment_role_name is defined
      - Artificial_Intelligence_Docker_stack_deployment_role_name is string
      - Artificial_Intelligence_Docker_stack_deployment_role_name | length > 0
    quiet: true
    fail_msg: >-
      "Artificial_Intelligence_Docker_stack_deployment_role_name" is mandatory: this role renders the Artificial Intelligence stack's
      compose file but does not deploy it, and it is the caller that names the role which does.
      It has no default because having one would presuppose an orchestrator, which #31 forbids.
      See the "Le contrat du rôle de déploiement" section of the README.

# The template writes a limit only for a string, so a number or `true` would silently leave the service
# unlimited and an empty string would write an invalid limit. The names are read off the caller's
# variables, so a service added later is covered without anyone remembering to list it here.
- name: "Check every memory limit is false or a size"
  ansible.builtin.assert:
    that:
      - >-
        lookup('ansible.builtin.vars', item) is sameas false
        or (lookup('ansible.builtin.vars', item) is string
        and lookup('ansible.builtin.vars', item) is match('^[1-9][0-9]*[bkmgBKMG]?$'))
    quiet: true
    fail_msg: >-
      "{{ item }}" is a memory limit: leave it false to set none, or give a size such as "2g". A number, true or
      an empty string is refused rather than silently ignored.
  loop: "{{ query('ansible.builtin.varnames', '^Artificial_Intelligence_.*_memory_limit$') }}"
  loop_control:
    label: "{{ item }}"

- name: "Check the Artificial Intelligence stack secrets are provided"
  ansible.builtin.assert:
    that:
      - Artificial_Intelligence_PostgreSQL_password is defined
      - Artificial_Intelligence_PostgreSQL_password is string
      - Artificial_Intelligence_PostgreSQL_password | length > 0
      - Artificial_Intelligence_LiteLLM_master_key is defined
      - Artificial_Intelligence_LiteLLM_master_key is string
      - Artificial_Intelligence_LiteLLM_master_key | length > 0
      - Artificial_Intelligence_LiteLLM_UI_password is defined
      - Artificial_Intelligence_LiteLLM_UI_password is string
      - Artificial_Intelligence_LiteLLM_UI_password | length > 0
    quiet: true
    fail_msg: >-
      "Artificial_Intelligence_PostgreSQL_password", "Artificial_Intelligence_LiteLLM_master_key" and "Artificial_Intelligence_LiteLLM_UI_password" are mandatory
      and have no default: a default password is a password, and one shipped in a repository is a
      published one. The caller renders all three from its vault. "Artificial_Intelligence_LiteLLM_master_key" is for
      administration only -- every consumer gets its own virtual key instead (#2).
      "Artificial_Intelligence_LiteLLM_UI_password" is the only thing standing between the LAN and "/ui" now that its port
      is published, so it is held to the same standard as the other two.

# The superuser's password is compared with LiteLLM's further down, with the other secrets that must
# differ, since that comparison does not run in check mode.
- name: "Check the PostgreSQL superuser is provided and kept apart from LiteLLM's role"
  ansible.builtin.assert:
    that:
      - Artificial_Intelligence_PostgreSQL_superuser is string
      - Artificial_Intelligence_PostgreSQL_superuser | length > 0
      - Artificial_Intelligence_PostgreSQL_superuser_password is defined
      - Artificial_Intelligence_PostgreSQL_superuser_password is string
      - Artificial_Intelligence_PostgreSQL_superuser_password | length > 0
      - Artificial_Intelligence_PostgreSQL_superuser != Artificial_Intelligence_PostgreSQL_user
    quiet: true
    fail_msg: >-
      "Artificial_Intelligence_PostgreSQL_superuser_password" is mandatory and has no default, and
      "Artificial_Intelligence_PostgreSQL_superuser" must differ from LiteLLM's own role (#159).
      LiteLLM connects as an ordinary role that owns its database and nothing else, so that an SQL
      injection through the gateway cannot reach "COPY ... PROGRAM" -- a shell in the PostgreSQL
      container. The same name would make the init script fail on a role that already exists.

- name: "Check at least one LiteLLM provider key is provided"
  ansible.builtin.assert:
    that:
      - >-
        [
        Artificial_Intelligence_LiteLLM_Gemini_API_key,
        Artificial_Intelligence_LiteLLM_Mistral_API_key,
        Artificial_Intelligence_LiteLLM_Groq_API_key,
        Artificial_Intelligence_LiteLLM_OpenRouter_API_key,
        Artificial_Intelligence_LiteLLM_DeepSeek_API_key
        ] | select('string') | map('length') | select('gt', 0) | list | length > 0
    quiet: true
    fail_msg: >-
      At least one of the five LiteLLM provider keys of the gateway's account (Gemini, Mistral, Groq,
      OpenRouter, DeepSeek) must be a non-empty string (#296): without one the gateway has no model to
      route to. They are all empty by default, and "LiteLLM_config.yaml.j2" (#2) renders only the
      providers whose key is given, each read as "os.environ/<PROVIDER>_API_KEY". Another account's own
      provider keys are not asked for here: they arrive as model_list entries of their own (#107). Not
      from that account's own "/ui" login -- LiteLLM keeps "/model/new" to the proxy admin. The GitHub
      key counts for nothing: #109 retired every
      "github/*" entry of the model_list it fed. Nor does the Cerebras key: Cerebras has no free tier
      any more and its entries are commented out (#200).

# The agent asks for "claude-code" by default, a router whose cascade holds only models that support
# structured tool calls, and only Gemini, Mistral and DeepSeek serve any (see its comment in
# "LiteLLM_config.yaml.j2"). Without one of those keys the router does not exist and the agent's
# every request would be refused.
- name: "Check the Claude Code agent has a provider that can serve its model"
  ansible.builtin.assert:
    that:
      - >-
        [
        Artificial_Intelligence_LiteLLM_Gemini_API_key,
        Artificial_Intelligence_LiteLLM_Mistral_API_key,
        Artificial_Intelligence_LiteLLM_DeepSeek_API_key
        ] | select('string') | map('length') | select('gt', 0) | list | length > 0
    quiet: true
    fail_msg: >-
      The Claude Code agent asks for the model "claude-code", whose cascade routes to Gemini, Mistral and
      DeepSeek only: it needs at least one of "Artificial_Intelligence_LiteLLM_Gemini_API_key",
      "Artificial_Intelligence_LiteLLM_Mistral_API_key" and "Artificial_Intelligence_LiteLLM_DeepSeek_API_key"
      (#296). Give one, point "Artificial_Intelligence_Claude_code_model" at a router the keys you
      have do serve, or set "Artificial_Intelligence_Claude_code_enabled" to false.
  when:
    - Artificial_Intelligence_Claude_code_enabled
    - Artificial_Intelligence_Claude_code_model == "claude-code"

- name: "Check the Redis password is provided"
  ansible.builtin.assert:
    that:
      - Artificial_Intelligence_Redis_password is defined
      - Artificial_Intelligence_Redis_password is string
      - Artificial_Intelligence_Redis_password | length > 0
    quiet: true
    fail_msg: >-
      "Artificial_Intelligence_Redis_password" is mandatory and has no default (#71): without it, "--requirepass" would
      be empty, which is no password at all -- defence in depth against a compromised workload on the
      internal network, same standard as "Artificial_Intelligence_Qdrant_API_key" (#3).

- name: "Check the LiteLLM salt key is provided"
  ansible.builtin.assert:
    that:
      - Artificial_Intelligence_LiteLLM_salt_key is defined
      - Artificial_Intelligence_LiteLLM_salt_key is string
      - Artificial_Intelligence_LiteLLM_salt_key | length > 0
    quiet: true
    fail_msg: >-
      "Artificial_Intelligence_LiteLLM_salt_key" is mandatory and has no default (#164). It is
      "LITELLM_SALT_KEY", the key LiteLLM
      encrypts the credentials stored from "/ui" with. Without it LiteLLM encrypts them with the master
      key, and rotating the master key makes every one of them unreadable; an empty value is not
      "unset" to LiteLLM but a key anyone can compute. An EXISTING deployment must not simply be given
      a fresh value: see "La clé de sel (#164)" in the README for the migration that keeps them.

- name: "Check the Claude Code agent parameters are provided"
  ansible.builtin.assert:
    that:
      - Artificial_Intelligence_Claude_code_virtual_key is defined
      - Artificial_Intelligence_Claude_code_virtual_key is string
      - Artificial_Intelligence_Claude_code_virtual_key | length > 0
    quiet: true
    fail_msg: >-
      "Artificial_Intelligence_Claude_code_virtual_key" is mandatory while
      "Artificial_Intelligence_Claude_code_enabled" is true, and has no default: it is a
      secret, and this role presupposes none. See #13.
  when: Artificial_Intelligence_Claude_code_enabled

# The one optional secret of the agent (#245), checked on its own so that it does not share a message
# with the mandatory key. "false", its default, means "not set" ("sameas" is an identity test: 0 and ""
# are not mistaken for it). Anything else must be a non-empty string, so that a value that is given and
# unusable is refused rather than quietly left out of the container.
- name: "Check the Claude Code agent GitHub token, when provided, is a non-empty string"
  ansible.builtin.assert:
    that:
      - >-
        Artificial_Intelligence_Claude_code_GitHub_token is sameas false
        or (Artificial_Intelligence_Claude_code_GitHub_token is string
        and Artificial_Intelligence_Claude_code_GitHub_token | length > 0)
    quiet: true
    fail_msg: >-
      "Artificial_Intelligence_Claude_code_GitHub_token" is optional (#245) but, once given, must be a
      non-empty string: an empty or non-string value is refused rather than ignored. Leave it unset to give the
      agent no GitHub token, or pass the token itself.
  when: Artificial_Intelligence_Claude_code_enabled

# Not any string: the role hands this exact value to LiteLLM as a custom key, which LiteLLM refuses
# unless it starts with "sk-" and holds at least 16 characters (read in its source, "key_management_
# endpoints.py"), and the failure would otherwise surface from a task whose output is hidden. It is
# compared with the master key further down, with the other secrets that must differ.
- name: "Check the Claude Code agent virtual key is one LiteLLM accepts"
  ansible.builtin.assert:
    that:
      - Artificial_Intelligence_Claude_code_virtual_key.startswith('sk-')
      - Artificial_Intelligence_Claude_code_virtual_key | length >= 16
    quiet: true
    fail_msg: >-
      "Artificial_Intelligence_Claude_code_virtual_key" must start with "sk-", hold at least
      16 characters, and differ from "Artificial_Intelligence_LiteLLM_master_key": this role registers
      that very value in LiteLLM as the agent's key, LiteLLM refuses any other shape, and the master key
      is never handed to a consumer (#2). A fresh value is "sk-" followed by "openssl rand -hex 24".
  when: Artificial_Intelligence_Claude_code_enabled

# Only for the host-path case: by default the workspace is a named volume and there is nothing to
# check. "false" is "not set" (invariant 2), so a string is what asks for a bind mount, and an empty
# one or a relative one is refused here instead of reaching the orchestrator as a mount it reads
# otherwise (a relative source is a volume name, not a path).
- name: "Check the Claude Code agent host workspace directory is an absolute path"
  ansible.builtin.assert:
    that:
      - Artificial_Intelligence_Claude_code_workspace_directory | length > 0
      - Artificial_Intelligence_Claude_code_workspace_directory.startswith('/')
    quiet: true
    fail_msg: >-
      "Artificial_Intelligence_Claude_code_workspace_directory" is optional: leave it unset
      (false) for the agent's workspace to be a named Docker volume, or give the absolute path of a
      directory of the node that runs the container.
  when:
    - Artificial_Intelligence_Claude_code_enabled
    - Artificial_Intelligence_Claude_code_workspace_directory is string

- name: "Check the OmniRoute dashboard password is provided"
  ansible.builtin.assert:
    that:
      - Artificial_Intelligence_OmniRoute_dashboard_password is defined
      - Artificial_Intelligence_OmniRoute_dashboard_password is string
      - Artificial_Intelligence_OmniRoute_dashboard_password | length > 0
    quiet: true
    fail_msg: >-
      "Artificial_Intelligence_OmniRoute_dashboard_password" is mandatory and has no default: the image ships "CHANGEME"
      otherwise, documented upstream as deliberately weak. Its port is published for the dashboard to
      be reachable from the LAN (#73), so this password is the one thing standing in front of it.

- name: "Check the Qdrant API key is provided"
  ansible.builtin.assert:
    that:
      - Artificial_Intelligence_Qdrant_API_key is defined
      - Artificial_Intelligence_Qdrant_API_key is string
      - Artificial_Intelligence_Qdrant_API_key | length > 0
    quiet: true
    fail_msg: >-
      "Artificial_Intelligence_Qdrant_API_key" is mandatory and has no default: #3 requires an API key on Qdrant even
      though no port is published, as defence-in-depth against a compromised workload reaching it
      over the internal network.

- name: "Check the LibreChat secrets are provided"
  ansible.builtin.assert:
    that:
      - Artificial_Intelligence_LibreChat_creds_key is defined
      - Artificial_Intelligence_LibreChat_creds_key is string
      - Artificial_Intelligence_LibreChat_creds_key | length > 0
      - Artificial_Intelligence_LibreChat_creds_IV is defined
      - Artificial_Intelligence_LibreChat_creds_IV is string
      - Artificial_Intelligence_LibreChat_creds_IV | length > 0
      - Artificial_Intelligence_LibreChat_JWT_secret is defined
      - Artificial_Intelligence_LibreChat_JWT_secret is string
      - Artificial_Intelligence_LibreChat_JWT_secret | length > 0
      - Artificial_Intelligence_LibreChat_JWT_refresh_secret is defined
      - Artificial_Intelligence_LibreChat_JWT_refresh_secret is string
      - Artificial_Intelligence_LibreChat_JWT_refresh_secret | length > 0
    quiet: true
    fail_msg: >-
      "Artificial_Intelligence_LibreChat_creds_key", "Artificial_Intelligence_LibreChat_creds_IV", "Artificial_Intelligence_LibreChat_JWT_secret" and
      "Artificial_Intelligence_LibreChat_JWT_refresh_secret" are mandatory and have no default (#76). Without the four
      encryption/JWT secrets LibreChat generates temporary ones on first start and keeps them nowhere
      but its own volume -- unsuitable for production by its own documentation. There is no virtual
      key to check here any more (#103): "librechat.yaml" reads "apiKey: \"user_provided\"", so each
      LibreChat account supplies its own the first time it uses the gateway endpoint, rather than the
      role pre-provisioning one shared key.

- name: "Check the LibreChat accounts are provided"
  ansible.builtin.assert:
    that:
      - Artificial_Intelligence_LibreChat_users | length > 0
    quiet: true
    fail_msg: >-
      "Artificial_Intelligence_LibreChat_users" is mandatory and has no default (#76): this role does
      not get to presuppose who runs the estate. It lists the LibreChat accounts the role creates, one
      mapping per account with "email", "name", "username" and "password", and "admin: true" on those
      granted the ADMIN role -- see the "Deploy the LibreChat accounts" tasks below for why that is
      not left to LibreChat's own "first user is admin" behaviour.

- name: "Check each LibreChat account is well formed"
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.email is defined
      - item.email is string
      - item.email | length > 0
      - item.name is defined
      - item.name is string
      - item.name | length > 0
      - item.username is defined
      - item.username is string
      - item.username | length > 0
      - item.password is defined
      - item.password is string
      - item.password | length > 0
      - item.admin is not defined or item.admin is boolean
    quiet: true
    fail_msg: >-
      Every entry of the LibreChat accounts needs a non-empty "email", "name", "username" and
      "password", and "admin", when given, must be a boolean (a string such as "true" is not one, and
      would silently grant nothing).
  loop: "{{ Artificial_Intelligence_LibreChat_users }}"
  loop_control:
    label: "{{ item.username | default('?') if item is mapping else '?' }}"

# Secrets that must differ from each other, compared HERE and not in the tasks that check each one is
# provided, so that every operand has been refused when undefined before it is read. Not in check mode:
# a caller whose secret retrieval cannot read the vault in a dry run stands one placeholder in for every
# secret, and the placeholders are then equal although no secret is wrong. Whether each one is provided
# still runs there, above. "quiet" prints the failing expression, never either value.
- name: "Check the secrets that must differ from each other do"
  when: not ansible_check_mode
  block:
    - name: "Check the PostgreSQL superuser's password differs from LiteLLM's role's"
      ansible.builtin.assert:
        that:
          - Artificial_Intelligence_PostgreSQL_superuser_password != Artificial_Intelligence_PostgreSQL_password
        quiet: true
        fail_msg: >-
          "Artificial_Intelligence_PostgreSQL_superuser_password" must differ from
          "Artificial_Intelligence_PostgreSQL_password" (#159): the same password would put the
          superuser's login in LiteLLM's environment, and a shell in the PostgreSQL container one SQL
          injection away.

    - name: "Check the LiteLLM salt key differs from the master key"
      ansible.builtin.assert:
        that:
          - Artificial_Intelligence_LiteLLM_salt_key != Artificial_Intelligence_LiteLLM_master_key
        quiet: true
        fail_msg: >-
          "Artificial_Intelligence_LiteLLM_salt_key" must differ from
          "Artificial_Intelligence_LiteLLM_master_key" (#164): with the same value, rotating the master
          key makes every credential stored from "/ui" unreadable.

    - name: "Check the Claude Code agent virtual key differs from the master key"
      ansible.builtin.assert:
        that:
          - Artificial_Intelligence_Claude_code_virtual_key != Artificial_Intelligence_LiteLLM_master_key
        quiet: true
        fail_msg: >-
          "Artificial_Intelligence_Claude_code_virtual_key" must differ from
          "Artificial_Intelligence_LiteLLM_master_key" (#2): the master key is for administration only
          and is never handed to a consumer.
      when: Artificial_Intelligence_Claude_code_enabled

# The database name is the one value of "DATABASE_URL" that cannot be percent-encoded: Prisma does
# not decode it (#133, measured). The allowed set is RFC 3986's unreserved characters, which no URL
# parser encodes or decodes, plus "$", which none does either and which the compose template doubles
# for Compose's own interpolation. Written as "nothing is left once they are removed" rather than as
# an anchored "match", whose "$" also matches before a trailing newline.
- name: "Check the PostgreSQL database name survives LiteLLM's connection string"
  ansible.builtin.assert:
    that:
      - Artificial_Intelligence_PostgreSQL_database is string
      - Artificial_Intelligence_PostgreSQL_database | length > 0
      - Artificial_Intelligence_PostgreSQL_database | regex_replace('[A-Za-z0-9._~$-]', '') | length == 0
    quiet: true
    fail_msg: >-
      "Artificial_Intelligence_PostgreSQL_database" may hold only ASCII letters, digits, "-", ".",
      "_", "~" and "$". LiteLLM's Prisma reads the database name out of "DATABASE_URL" without
      decoding it, so a character a URL has to encode -- "/", "?", "#", "{", a space, anything
      non-ASCII -- reaches it as some other name, raw or encoded, and "%" means one thing to Prisma
      and another to psql. It fails silently: LiteLLM creates and migrates the database it was
      handed, reports healthy, and the one "POSTGRES_DB" created stays empty.

- name: "Check the published network parameters are consistent"
  ansible.builtin.assert:
    that:
      - (Artificial_Intelligence_published_Docker_network_name is string) == (Artificial_Intelligence_published_Docker_network_definition is string)
    quiet: true
    fail_msg: >-
      "Artificial_Intelligence_published_Docker_network_name" and "Artificial_Intelligence_published_Docker_network_definition" are set
      together or not at all: the name attaches a service to the published network, the definition
      declares it in the rendered file's "networks:" block. Setting only one produces a compose file
      that either references an undeclared network, or declares one nobody uses -- and in the first
      case the orchestrator only says so at deployment time.

# The stack is rendered from THIS role's "templates/", and deployed by a role this repository does
# not contain. The four variables below are the contract: they carry the names the homelab
# repository's deployment roles expect, unprefixed, because they are theirs and not ours.
#
# Passed as "include_role" parameters (precedence 20) rather than through a "set_fact" or a task
# level "vars:": it is the only form that beats a fact already set. Below it, the fact wins, and a
# task connects as an account other than the one its "vars:" announced while reporting "ok".
# The two secrets never appear in a file of their own: they are interpolated straight into the
# compose template by Ansible, alongside everything else it already renders (#1). That is one fewer
# file to secure -- the compose file itself already carries the "0600" / "diff: false" contract the
# deployment role owes it, in "Le contrat du rôle de déploiement" above, for exactly this reason.
#
# No secret in this one either -- the gateway reads the master key and the database URL from its
# own container environment, not from here -- so it is neither "no_log" nor undiffable. It is
# mounted read-only: the gateway reads its routing configuration, it does not rewrite it.
- name: "Render the {{ Artificial_Intelligence_Docker_stack_name }} stack LiteLLM configuration"
  ansible.builtin.template:
    src: "LiteLLM_config.yaml.j2"
    dest: "{{ Artificial_Intelligence_LiteLLM_config_file_destination_path }}"
    owner: "root"
    group: "root"
    mode: "0644"
  # Its "checksum" is what gets a changed configuration applied at all (#161): see the parameters of
  # "Deploy the ... Docker stack" below.
  register: Artificial_Intelligence_LiteLLM_config_rendering

# Copied rather than rendered (#76): the file carries no "{{ ... }}" Jinja and no secret. Its
# "apiKey" is "user_provided" since #103, each LibreChat account entering its own gateway key
# itself, so Ansible has nothing to interpolate here.
- name: "Deploy the LibreChat configuration"
  ansible.builtin.copy:
    src: "librechat/librechat.yaml"
    dest: "{{ Artificial_Intelligence_LibreChat_config_file_destination_path }}"
    owner: "root"
    group: "root"
    mode: "0644"
  # Same reason as the LiteLLM configuration above (#161).
  register: Artificial_Intelligence_LibreChat_config_deployment

- name: "Deploy the {{ Artificial_Intelligence_Docker_stack_name }} Docker stack"
  ansible.builtin.include_role:
    name: "{{ Artificial_Intelligence_Docker_stack_deployment_role_name }}"
  vars:
    Docker_stack_name: "{{ Artificial_Intelligence_Docker_stack_name }}"
    Docker_compose_file_name: "{{ Artificial_Intelligence_Docker_compose_file_name }}"
    Docker_compose_file_destination_directory: "{{ Artificial_Intelligence_Docker_compose_file_destination_directory }}"
    Docker_compose_file_destination_path: "{{ Artificial_Intelligence_Docker_compose_file_destination_path }}"
    # Not part of that contract (#161): the deployment role does nothing with these two but render
    # the compose template in their scope, which it does anyway. The template names the Docker
    # config that carries each file after its checksum, and a new name is the only thing that changes
    # the compose file when only the configuration changed -- without it neither Compose nor Swarm
    # sees a difference, and the container keeps running on the old file. See
    # "Artificial_Intelligence_LiteLLM_config_Docker_name" in defaults/main.yml.
    #
    # "default(false)" is for "--check": a template or copy about to change its file returns no
    # "checksum" in check mode -- the copy action returns before adding it to its result -- and
    # "false" leaves the config's bare name in that dry run's compose file rather than failing on an
    # undefined attribute.
    Artificial_Intelligence_LiteLLM_config_checksum: "{{ Artificial_Intelligence_LiteLLM_config_rendering.checksum | default(false) }}"
    Artificial_Intelligence_LibreChat_config_checksum: "{{ Artificial_Intelligence_LibreChat_config_deployment.checksum | default(false) }}"

# Every "Artificial_Intelligence_LiteLLM_internal_users" entry (#103), created against the gateway's own admin API --
# never against "/ui" by hand, which would not be idempotent or repeatable across a fresh machine.
# "/user/new" is confirmed (read in LiteLLM's own source, "internal_user_endpoints.py") to answer
# 409 on a user_id or email that already exists rather than upsert it, so a re-run is a no-op here,
# the same shape as LibreChat's own "create-user" a few tasks down.
#
# LiteLLM needs a moment after the stack deployment task above to actually start answering on its
# published port -- "until"/"retries" ride out that window rather than presuppose it has already
# passed; a hard failure past the retry budget still fails the play, since a user this role could
# not confirm exists is not a user it should silently skip.
- name: "Create each additional LiteLLM internal user"
  ansible.builtin.uri:
    url: "{{ Artificial_Intelligence_LiteLLM_admin_API_URL }}/user/new"
    method: POST
    headers:
      Authorization: "Bearer {{ Artificial_Intelligence_LiteLLM_master_key }}"
    body_format: json
    body:
      user_id: "{{ item.username }}"
      user_email: "{{ item.email }}"
      user_role: "internal_user"
      # "/user/new" mints a key of its own by default, with no model restriction, and this task never
      # showed it to anyone: every account ended up with a second, unseen key next to the one the
      # task below prints. Measured on LiteLLM 1.100.0 through "/user/info". The key comes from
      # "/key/generate" below, and from nowhere else.
      auto_create_key: false
    status_code: [200, 201, 409]
  register: Artificial_Intelligence_LiteLLM_internal_user_creation
  until: Artificial_Intelligence_LiteLLM_internal_user_creation.status is defined and Artificial_Intelligence_LiteLLM_internal_user_creation.status in [200, 201, 409]
  retries: 5
  delay: 5
  no_log: true
  loop: "{{ Artificial_Intelligence_LiteLLM_internal_users }}"
  loop_control:
    label: "{{ item.username }}"
  changed_when: Artificial_Intelligence_LiteLLM_internal_user_creation.status in [200, 201]

# Deliberately a SEPARATE call from "/user/new" above, on the RECOMMENDED shape of LiteLLM's own
# onboarding guide, rather than relying on whatever key "/user/new" itself might also return: minting
# a virtual key is "/key/generate"'s one job, and its response shape is the one LiteLLM documents
# consistently (a "key" field) across every endpoint that returns one.
#
# No "models" restriction on the key, deliberately: every key reaches every model until #2 builds
# the real per-account isolation -- the behaviour #114 wrote down as the expected one. This key used
# to carry "models: [access_group:<username>]", which is not a LiteLLM syntax: an access group is
# named BARE in a key's "models", and the prefixed string was taken as the name of a model nobody
# declares. Measured on LiteLLM 1.100.0, the key could reach nothing -- "/v1/models" listed only
# "access_group:<username>", and a call to "flash" came back 403 "key not allowed to access model"
# -- so the account it was minted for could not use LibreChat at all. When #2 lands, an account's
# scope comes back from a role variable, on the key AND on the user, never from a spelling guessed
# here.
#
# Gated on THIS run's own creation result rather than trusted to "/key/generate" being idempotent on
# repeat calls (unverified -- see #103): the "when" below is true only the one run "/user/new" just
# now returned 200/201 for this exact user, never again once it settles on 409 forever after. A key
# is therefore minted exactly once per account, ever, regardless of what a bare repeat call to
# "/key/generate" alone would have done.
- name: "Generate each newly created internal user's virtual key"
  ansible.builtin.uri:
    url: "{{ Artificial_Intelligence_LiteLLM_admin_API_URL }}/key/generate"
    method: POST
    headers:
      Authorization: "Bearer {{ Artificial_Intelligence_LiteLLM_master_key }}"
    body_format: json
    body:
      user_id: "{{ item.item.username }}"
      key_alias: "{{ item.item.username }}-personal"
    status_code: [200]
  register: Artificial_Intelligence_LiteLLM_internal_user_key
  no_log: true
  loop: "{{ Artificial_Intelligence_LiteLLM_internal_user_creation.results }}"
  loop_control:
    label: "{{ item.item.username }}"
  when: item.status in [200, 201]
  changed_when: true

# The ONE place this key is ever shown: LiteLLM does not return it again on a later call, the same
# way a GitHub token or a registry password is shown once at creation and never again. "no_log" stays
# off deliberately, on this task alone -- the whole point is that this prints. What it is FOR is
# LibreChat's own "apiKey: \"user_provided\"" prompt (see "librechat.yaml"): the account this key
# belongs to pastes it there the first time it opens the gateway endpoint, and LibreChat keeps it,
# encrypted, from then on.
- name: "Show each newly generated internal user's virtual key"
  ansible.builtin.debug:
    msg: >-
      LiteLLM virtual key for "{{ item.item.item.username }}" -- shown once, save it now:
      {{ item.json.key }}
  loop: "{{ Artificial_Intelligence_LiteLLM_internal_user_key.results }}"
  loop_control:
    label: "{{ item.item.item.username }}"
  when: item is not skipped

# The Claude Code agent's virtual key (#13), registered by the role under the VALUE the caller
# vaulted, so that the agent needs nothing by hand and no second run: the key cannot exist before
# LiteLLM does, and this is the first moment it can be created. The container may start a few seconds
# before it does; it only calls the gateway when someone uses it, and its restart policy ("any")
# covers the case where it exits meanwhile.
#
# The master key authenticates the calls and is never what the agent holds. The allow-list is the
# model alias the agent asks for and nothing else, which is what keeps it away from every other
# account's quota.
#
# Idempotent by LOOKING FIRST rather than by trusting "/key/generate" on a repeat: "/key/info" answers
# 404 for a key it has never seen and 200 for one it has, and it takes the key's SHA-256 (what LiteLLM
# stores) so that the secret stays out of the URL. A key LiteLLM reports as "deleted" is registered
# again. The role creates the key and does not reconcile one that exists: an existing key keeps the
# models it was created with. Rotating it means deleting the old key from "/ui" first -- its alias is
# unique, so "/key/generate" would refuse the new one while the old stays -- and then deploying.
#
# Skipped in "--check": the stack is only rendered then, and there is no LiteLLM to ask.
#
# "no_log" everywhere the key or the master key could be printed, so a failure there is silent about
# its cause: the readiness probe, which carries no secret, is the task that names an unreachable
# gateway.
- name: "Register the Claude Code agent's LiteLLM virtual key"
  when:
    - Artificial_Intelligence_Claude_code_enabled
    - not ansible_check_mode
  block:
    - name: "Wait for LiteLLM to answer"
      ansible.builtin.uri:
        url: "{{ Artificial_Intelligence_LiteLLM_admin_API_URL }}/health/readiness"
        status_code: [200]
      register: Artificial_Intelligence_LiteLLM_readiness
      until: Artificial_Intelligence_LiteLLM_readiness.status is defined and Artificial_Intelligence_LiteLLM_readiness.status == 200
      retries: 30
      delay: 5
      changed_when: false

    - name: "Look up the Claude Code agent's LiteLLM virtual key"
      ansible.builtin.uri:
        url: "{{ Artificial_Intelligence_LiteLLM_admin_API_URL }}/key/info?key={{ Artificial_Intelligence_Claude_code_virtual_key | hash('sha256') }}"
        headers:
          Authorization: "Bearer {{ Artificial_Intelligence_LiteLLM_master_key }}"
        status_code: [200, 404]
      register: Artificial_Intelligence_Claude_code_key_lookup
      no_log: true
      changed_when: false

    - name: "Register the Claude Code agent's LiteLLM virtual key where it is missing"
      ansible.builtin.uri:
        url: "{{ Artificial_Intelligence_LiteLLM_admin_API_URL }}/key/generate"
        method: POST
        headers:
          Authorization: "Bearer {{ Artificial_Intelligence_LiteLLM_master_key }}"
        body_format: json
        body:
          key: "{{ Artificial_Intelligence_Claude_code_virtual_key }}"
          key_alias: "claude_code"
          models: ["{{ Artificial_Intelligence_Claude_code_model }}"]
        status_code: [200]
      no_log: true
      changed_when: true
      when: >-
        Artificial_Intelligence_Claude_code_key_lookup.status == 404
        or Artificial_Intelligence_Claude_code_key_lookup.json.info.status | default('') == 'deleted'

# The LibreChat accounts (#76), created BY THE ROLE once the stack it belongs to is actually
# running -- everything below needs a live "librechat" container, which is why it comes after the
# deployment task rather than beside the other asserts.
#
# The container is found by a LABEL THE COMPOSE FILE WRITES ITSELF, rather than by guessing its name
# or by reading one the deployer wrote. Neither of the other two works across deployers: a container
# name is part of no contract (Compose writes "<project>-<service>-<n>", Swarm
# "<stack>_<service>.<n>.<task id>"), and the labels each deployer applies are not the same either --
# "com.docker.compose.project" and "com.docker.compose.service" under "docker compose up",
# "com.docker.stack.namespace" and "com.docker.swarm.service.name" under "docker stack deploy", with
# not one label of the other family in either case. This lookup read the Compose pair until a
# downstream Swarm deployment measured that, on the managed node, and found the failure to be
# entirely silent: the filter matches nothing, the block below skips exactly as its "when" is
# written to, and LibreChat comes up with neither account created while "ALLOW_REGISTRATION" is
# false -- a chat UI nobody can log into, and nothing red anywhere.
#
# The two labels are declared on the service in the compose template, under "labels" and not under
# "deploy.labels" so that they land on the CONTAINER; the template carries the full reasoning beside
# them. Nothing about the Compose target changes -- Compose applies them exactly as before, and its
# own canonical labels are still there, simply no longer what this task reads.
#
# ! Still SINGLE-NODE ONLY. Under a multi-node Swarm the node running THIS task is not necessarily
# the node hosting the "librechat" container, and finding it would mean querying the Swarm API for
# its current placement and then acting on that node, which this role does not do. The task below
# finds nothing and skips cleanly in that case (see "Skip cleanly" below) rather than acting on the
# wrong node's Docker daemon. Left for whoever brings the multi-node Swarm target, per the README's
# "Le contrat du rôle de déploiement".
#
# ! Needs "community.docker" (see "requirements.yml") AND the "docker" Python SDK installed on the
# MANAGED NODE: both modules talk to the Docker Engine API through it, not through the "docker" CLI.
# Stated in the role's README rather than asserted here, because there is nothing to assert against
# -- a missing SDK fails inside the module itself, with its own clear error.
- name: "Find the running librechat container"
  community.docker.docker_host_info:
    containers: true
    containers_filters:
      label:
        - "artificial_intelligence.stack={{ Artificial_Intelligence_Docker_stack_name }}"
        - "artificial_intelligence.service=librechat"
  register: Artificial_Intelligence_LibreChat_container_lookup

# A "block" and a "when" at its level, not "meta: end_play": this role can be included alongside
# others in a play it does not own, and ending the WHOLE PLAY over a container this role could not
# find would take those other roles' tasks down with it -- exactly the kind of thing outside its
# reach this role otherwise keeps hands off. Skipping only guards what actually depends on the
# container.
- name: "Deploy the LibreChat accounts"
  when: Artificial_Intelligence_LibreChat_container_lookup.containers | length > 0
  block:
    # Every argument on the command line, none of them at an interactive prompt: LibreChat's own
    # "create-user" CLI opens a NEW "readline" interface per question and closes it right after,
    # which loses whatever of a piped multi-line stdin arrived in the same chunk as the first answer
    # -- verified by reproducing the hang live, once, before writing this task. Passing the password
    # as its 4th positional argument and "--email-verified=true" as a flag is what LibreChat's own
    # script reads BEFORE it would prompt for either, so no prompt ever fires.
    #
    # Idempotent by inspection of its output rather than by checking for the account first:
    # "create-user" itself refuses a duplicate email or username with "A user with that email or
    # username already exists!" and exits 1, which is exactly the case "failed_when" excludes.
    # LibreChat prints it on stdout (measured on v0.8.7), but both streams are read, since which one
    # carries that message is LibreChat's to change.
    #
    # "no_log": the password is an argument of the command, so the task's own result would print it.
    - name: "Create the LibreChat accounts"
      community.docker.docker_container_exec:
        container: "{{ Artificial_Intelligence_LibreChat_container_lookup.containers[0].Id }}"
        argv:
          - npm
          - run
          - create-user
          - --
          - "{{ item.email }}"
          - "{{ item.name }}"
          - "{{ item.username }}"
          - "{{ item.password }}"
          - "--email-verified=true"
      register: Artificial_Intelligence_LibreChat_account_creation
      changed_when: Artificial_Intelligence_LibreChat_account_creation.rc == 0
      failed_when: >-
        Artificial_Intelligence_LibreChat_account_creation.rc != 0
        and "already exists" not in (Artificial_Intelligence_LibreChat_account_creation.stdout | default('')
        ~ Artificial_Intelligence_LibreChat_account_creation.stderr | default(''))
      loop: "{{ Artificial_Intelligence_LibreChat_users }}"
      loop_control:
        label: "{{ item.username }}"
      no_log: true

    # Not "the first account is auto-admin": upstream reports of that behaviour not applying are
    # exactly why #76 asked for it to be set explicitly rather than relied on. Setting it directly in
    # MongoDB is idempotent on its own terms -- a document already at "ADMIN" reports
    # "modifiedCount: 0", which is what "changed_when" reads below -- so running this against an
    # account that is already admin is a safe no-op rather than an error.
    #
    # ! The email is LOWERCASED in the filter. LibreChat stores every email lowercased, so a vaulted
    # mixed-case one matched no document at all: the update reported "matchedCount: 0" and the task
    # said "ok". Written as a JSON string so that a quote in it cannot end the JavaScript string.
    - name: "Find the running librechat_mongodb container"
      community.docker.docker_host_info:
        containers: true
        containers_filters:
          label:
            - "artificial_intelligence.stack={{ Artificial_Intelligence_Docker_stack_name }}"
            - "artificial_intelligence.service=librechat_mongodb"
      register: Artificial_Intelligence_LibreChat_mongodb_container_lookup

    - name: "Grant the ADMIN role to the LibreChat accounts that are admins"
      community.docker.docker_container_exec:
        container: "{{ Artificial_Intelligence_LibreChat_mongodb_container_lookup.containers[0].Id }}"
        argv:
          - mongosh
          - "mongodb://localhost:27017/LibreChat"
          - --quiet
          - --eval
          - >-
            JSON.stringify(db.users.updateOne(
              {email: {{ item.email | lower | to_json }}},
              {$set: {role: "ADMIN"}}
            ))
      register: Artificial_Intelligence_LibreChat_admin_grant
      changed_when: "'\"modifiedCount\":1' in Artificial_Intelligence_LibreChat_admin_grant.stdout"
      loop: "{{ Artificial_Intelligence_LibreChat_users | selectattr('admin', 'defined') | selectattr('admin', 'equalto', true) | list }}"
      loop_control:
        label: "{{ item.username }}"
