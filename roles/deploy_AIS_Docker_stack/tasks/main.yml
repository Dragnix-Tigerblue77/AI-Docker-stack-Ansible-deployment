---
# tasks file for roles/deploy_AIS_Docker_stack

# Both checks are made HERE, up front and outside any condition, rather than left to whatever reads
# the variable. It is the lesson of the homelab repository's "retrieve_value_or_create_Docker_secret":
# a parameter read behind a condition that almost never holds is a parameter nobody notices is
# missing, until the day it is missing on a fresh machine.
- name: "Check the AIS stack parameters"
  ansible.builtin.assert:
    that:
      - AIS_Docker_stack_deployment_role_name is defined
      - AIS_Docker_stack_deployment_role_name is string
      - AIS_Docker_stack_deployment_role_name | length > 0
    quiet: true
    fail_msg: >-
      "AIS_Docker_stack_deployment_role_name" is mandatory: this role renders the AIS stack's
      compose file but does not deploy it, and it is the caller that names the role which does.
      It has no default because having one would presuppose an orchestrator, which #31 forbids.
      See the "Le contrat du rôle de déploiement" section of the README.

- name: "Check the AIS stack secrets are provided"
  ansible.builtin.assert:
    that:
      - AIS_PostgreSQL_password is defined
      - AIS_PostgreSQL_password is string
      - AIS_PostgreSQL_password | length > 0
      - AIS_LiteLLM_master_key is defined
      - AIS_LiteLLM_master_key is string
      - AIS_LiteLLM_master_key | length > 0
      - AIS_LiteLLM_UI_password is defined
      - AIS_LiteLLM_UI_password is string
      - AIS_LiteLLM_UI_password | length > 0
    quiet: true
    fail_msg: >-
      "AIS_PostgreSQL_password", "AIS_LiteLLM_master_key" and "AIS_LiteLLM_UI_password" are mandatory
      and have no default: a default password is a password, and one shipped in a repository is a
      published one. The caller renders all three from its vault. "AIS_LiteLLM_master_key" is for
      administration only -- every consumer gets its own virtual key instead (#2).
      "AIS_LiteLLM_UI_password" is the only thing standing between the LAN and "/ui" now that its port
      is published, so it is held to the same standard as the other two.

# The floor is checked HERE rather than trusted to whoever edits the tag, because that is the edit
# where it gets forgotten: raising an image tag feels like a version bump, not like a security
# decision. Four critical CVEs in four months on this product in 2026 -- among them a
# PRE-AUTHENTICATED SQL injection whose target is exactly the PostgreSQL service this role deploys.
#
# "is version" compares as versions and not as strings, so "1.100.0" is correctly greater than
# "1.84.0" -- which a string comparison gets backwards, and which is the whole reason this is not a
# "|| >=" on the raw tag.
- name: "Check the LiteLLM image tag clears the security floor"
  ansible.builtin.assert:
    that:
      - AIS_LiteLLM_Docker_image_tag is string
      - AIS_LiteLLM_Docker_image_tag != "main-latest"
      - AIS_LiteLLM_Docker_image_tag | regex_replace('^v', '') is version(AIS_LiteLLM_minimum_secure_version, '>=')
    quiet: true
    fail_msg: >-
      "AIS_LiteLLM_Docker_image_tag" ({{ AIS_LiteLLM_Docker_image_tag }}) is below the security floor
      "AIS_LiteLLM_minimum_secure_version" ({{ AIS_LiteLLM_minimum_secure_version }}), or is the
      deprecated "main-latest" tag, which is no longer fed and freezes the deployment on an old image
      while looking current. This container holds both accounts' provider keys and the master key.
      Re-check the upstream security advisories and raise the tag -- never lower the floor.

- name: "Check tigerblue77's LiteLLM provider keys are provided"
  ansible.builtin.assert:
    that:
      - AIS_LiteLLM_Gemini_API_key_tigerblue77 is defined
      - AIS_LiteLLM_Gemini_API_key_tigerblue77 is string
      - AIS_LiteLLM_Gemini_API_key_tigerblue77 | length > 0
      - AIS_LiteLLM_GitHub_API_key_tigerblue77 is defined
      - AIS_LiteLLM_GitHub_API_key_tigerblue77 is string
      - AIS_LiteLLM_GitHub_API_key_tigerblue77 | length > 0
      - AIS_LiteLLM_Mistral_API_key_tigerblue77 is defined
      - AIS_LiteLLM_Mistral_API_key_tigerblue77 is string
      - AIS_LiteLLM_Mistral_API_key_tigerblue77 | length > 0
      - AIS_LiteLLM_Cerebras_API_key_tigerblue77 is defined
      - AIS_LiteLLM_Cerebras_API_key_tigerblue77 is string
      - AIS_LiteLLM_Cerebras_API_key_tigerblue77 | length > 0
      - AIS_LiteLLM_Groq_API_key_tigerblue77 is defined
      - AIS_LiteLLM_Groq_API_key_tigerblue77 is string
      - AIS_LiteLLM_Groq_API_key_tigerblue77 | length > 0
      - AIS_LiteLLM_OpenRouter_API_key_tigerblue77 is defined
      - AIS_LiteLLM_OpenRouter_API_key_tigerblue77 is string
      - AIS_LiteLLM_OpenRouter_API_key_tigerblue77 | length > 0
    quiet: true
    fail_msg: >-
      tigerblue77's six LiteLLM provider keys (Gemini, GitHub, Mistral, Cerebras, Groq, OpenRouter)
      are mandatory and have no default, like every other secret this role interpolates.
      "LiteLLM_config.yaml.j2" (#2) reads each one as "os.environ/<PROVIDER>_API_KEY_TIGERBLUE77" --
      Dragnix's own keys are deliberately absent: he adds them himself from "/ui".

- name: "Check the Redis password is provided"
  ansible.builtin.assert:
    that:
      - AIS_Redis_password is defined
      - AIS_Redis_password is string
      - AIS_Redis_password | length > 0
    quiet: true
    fail_msg: >-
      "AIS_Redis_password" is mandatory and has no default (#71): without it, "--requirepass" would
      be empty, which is no password at all -- defence in depth against a compromised workload on the
      internal network, same standard as "AIS_Qdrant_API_key" (#3).

- name: "Check the Claude Code agent (tigerblue77) parameters are provided"
  ansible.builtin.assert:
    that:
      - AIS_Claude_code_tigerblue77_virtual_key is defined
      - AIS_Claude_code_tigerblue77_virtual_key is string
      - AIS_Claude_code_tigerblue77_virtual_key | length > 0
      - AIS_Claude_code_tigerblue77_GitHub_token is defined
      - AIS_Claude_code_tigerblue77_GitHub_token is string
      - AIS_Claude_code_tigerblue77_GitHub_token | length > 0
      - AIS_Claude_code_tigerblue77_workspace_directory is defined
      - AIS_Claude_code_tigerblue77_workspace_directory is string
      - AIS_Claude_code_tigerblue77_workspace_directory | length > 0
    quiet: true
    when: AIS_Claude_code_tigerblue77_enabled
    fail_msg: >-
      "AIS_Claude_code_tigerblue77_virtual_key", "AIS_Claude_code_tigerblue77_GitHub_token" and
      "AIS_Claude_code_tigerblue77_workspace_directory" are mandatory once
      "AIS_Claude_code_tigerblue77_enabled" is true, and none of the three has a default: the first
      two are secrets, the third is a host path, and this role presupposes neither. See #13.

- name: "Check the OmniRoute dashboard password is provided"
  ansible.builtin.assert:
    that:
      - AIS_OmniRoute_dashboard_password is defined
      - AIS_OmniRoute_dashboard_password is string
      - AIS_OmniRoute_dashboard_password | length > 0
    quiet: true
    fail_msg: >-
      "AIS_OmniRoute_dashboard_password" is mandatory and has no default: the image ships "CHANGEME"
      otherwise, documented upstream as deliberately weak. Its port is published for the dashboard to
      be reachable from the LAN (#73), so this password is the one thing standing in front of it.

- name: "Check the Qdrant API key is provided"
  ansible.builtin.assert:
    that:
      - AIS_Qdrant_API_key is defined
      - AIS_Qdrant_API_key is string
      - AIS_Qdrant_API_key | length > 0
    quiet: true
    fail_msg: >-
      "AIS_Qdrant_API_key" is mandatory and has no default: #3 requires an API key on Qdrant even
      though no port is published, as defence-in-depth against a compromised workload reaching it
      over the internal network.

- name: "Check the published network parameters are consistent"
  ansible.builtin.assert:
    that:
      - (AIS_published_Docker_network_name is string) == (AIS_published_Docker_network_definition is string)
    quiet: true
    fail_msg: >-
      "AIS_published_Docker_network_name" and "AIS_published_Docker_network_definition" are set
      together or not at all: the name attaches a service to the published network, the definition
      declares it in the rendered file's "networks:" block. Setting only one produces a compose file
      that either references an undeclared network, or declares one nobody uses -- and in the first
      case the orchestrator only says so at deployment time.

# The stack is rendered from THIS role's "templates/", and deployed by a role this repository does
# not contain. The four variables below are the contract: they carry the names the homelab
# repository's deployment roles expect, unprefixed, because they are theirs and not ours.
#
# Passed as "include_role" parameters (precedence 20) rather than through a "set_fact" or a task
# level "vars:": it is the only form that beats a fact already set, and that is what #459 cost the
# homelab repository -- a task connecting as an account other than the one its "vars:" announced,
# and reporting "ok".
# The two secrets never appear in a file of their own: they are interpolated straight into the
# compose template by Ansible, alongside everything else it already renders (#1). That is one fewer
# file to secure -- the compose file itself already carries the "0600" / "diff: false" contract the
# deployment role owes it, in "Le contrat du rôle de déploiement" above, for exactly this reason.
#
# No secret in this one either -- the gateway reads the master key and the database URL from its
# own container environment, not from here -- so it is neither "no_log" nor undiffable. It is
# mounted read-only: the gateway reads its routing configuration, it does not rewrite it.
- name: "Render the {{ AIS_Docker_stack_name }} stack LiteLLM configuration"
  ansible.builtin.template:
    src: "LiteLLM_config.yaml.j2"
    dest: "{{ AIS_LiteLLM_config_file_destination_path }}"
    owner: "root"
    group: "root"
    mode: "0644"

# "ansible.builtin.template" does not create the directories its "dest" lands in -- unlike
# "AIS_Docker_compose_file_destination_directory", which the deployment role is trusted to already
# have prepared, this one is local to this build context and nothing else creates it.
- name: "Create the Claude Code agent (tigerblue77) build context directory"
  ansible.builtin.file:
    path: "{{ AIS_Claude_code_tigerblue77_build_context_directory }}"
    state: directory
    owner: "root"
    group: "root"
    mode: "0755"
  when: AIS_Claude_code_tigerblue77_enabled

# "build:" needs an actual Dockerfile on the managed node, not something read out of this
# repository's own checkout at deploy time -- which may not even be present there. Rendered rather
# than copied so the image it is built FROM stays a single value in "defaults/main.yml", pinned by
# tag and digest, instead of a second copy baked into a static file (#13).
- name: "Render the Claude Code agent (tigerblue77) Dockerfile"
  ansible.builtin.template:
    src: "claude_code_tigerblue77.Dockerfile.j2"
    dest: "{{ AIS_Claude_code_tigerblue77_build_context_directory }}Dockerfile"
    owner: "root"
    group: "root"
    mode: "0644"
  when: AIS_Claude_code_tigerblue77_enabled

- name: "Deploy the {{ AIS_Docker_stack_name }} Docker stack"
  ansible.builtin.include_role:
    name: "{{ AIS_Docker_stack_deployment_role_name }}"
  vars:
    Docker_stack_name: "{{ AIS_Docker_stack_name }}"
    Docker_compose_file_name: "{{ AIS_Docker_compose_file_name }}"
    Docker_compose_file_destination_directory: "{{ AIS_Docker_compose_file_destination_directory }}"
    Docker_compose_file_destination_path: "{{ AIS_Docker_compose_file_destination_path }}"
