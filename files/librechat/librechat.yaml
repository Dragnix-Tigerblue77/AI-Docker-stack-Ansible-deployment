---
version: 1.1.5

endpoints:
  custom:
    - name: "LiteLLM Homelab"
      # "user_provided" (#103), never one shared key read from the container's own environment: a
      # single value here would mean every LibreChat account -- one human, or several -- talks to the
      # gateway under the SAME LiteLLM identity, which defeats per-account isolation (#2) the moment a
      # second human account exists. LibreChat instead asks EACH of its own accounts for their own
      # key, the first time that account uses this endpoint, and keeps it (encrypted) for that account
      # alone from then on. Never the master key either way (#1): LibreChat is a consumer of the
      # gateway like any other, and #1 is explicit that the master key never leaves LiteLLM's own
      # container.
      apiKey: "user_provided"
      # "litellm" is the gateway's SERVICE KEY (#1) -- not "litellm-proxy", which is what the
      # original POC named it before the service actually landed in the compose template.
      baseURL: "http://litellm:4000/v1"
      models:
        # Two identifiers here did not exist in the gateway's real model_list (#2):
        # "llama-3-3-70b-groq" was never declared, and "llama-3-1-405b-sambanova" belongs to the
        # SambaNova block #2 keeps entirely commented out (a bank card is required upstream). Both
        # would have answered with a 404 from the gateway the moment either was selected. Replaced
        # the first with "gpt-oss-120b-groq", an actual deployed Groq entry serving the same role;
        # dropped the second outright, since no working SambaNova substitute exists to offer instead.
        default: ["Auto", "Auto-Flash", "Auto-Code", "Auto-Pro", "Auto-Flash-Lite", "gemini-3-8-flash", "gpt-oss-120b-groq", "codestral"]
        fetch: true
      titleModel: "Auto-Flash"
      dropParams: ["stop"]
