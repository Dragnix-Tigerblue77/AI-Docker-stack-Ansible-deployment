# Relay between the gateway and OVHcloud AI Endpoints, which serves its free models only to a request
# with NO Authorization header at all: an empty one is refused (400) and any bearer token, a placeholder
# included, answers 403. LiteLLM always sends one on the "openai/" provider, and nginx drops a header
# whose value is set to the empty string. Why each setting is what it is: RELAIS_OVHCLOUD.md.

# Docker's embedded DNS, the same address in every container on a user-defined network. The upstream
# is a variable below, so it is resolved at each request with this TTL, and the relay starts even
# when OVHcloud cannot be reached.
resolver 127.0.0.11 valid=300s ipv6=off;

server {
  listen 8080;

  # Large enough for a request carrying several base64-encoded images in one JSON body (a third
  # larger than the images themselves); nginx's default of 1m answers 413 to the first photograph.
  client_max_body_size 64m;
  # The body goes on to OVHcloud as it arrives, not through a file in the container's small tmpfs.
  proxy_request_buffering off;

  # What the container's healthcheck asks, and nothing of OVHcloud's.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /v1/ {
    set $ovh oai.endpoints.kepler.ai.cloud.ovh.net;
    proxy_pass https://$ovh;
    proxy_set_header Host $ovh;
    proxy_set_header Authorization "";

    proxy_ssl_server_name on;
    proxy_ssl_name $ovh;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # A streamed answer is passed chunk by chunk, not held back until it is complete.
    proxy_buffering off;
    # An unreachable OVHcloud fails fast and the cascade moves on; a model that reasons is silent for
    # a long time, so the read timeout stays above the router's "timeout" in LiteLLM_config.yaml.j2.
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
  }

  # "/v1" alone would otherwise be redirected to "/v1/" by the prefix location above.
  location = /v1 {
    return 404;
  }

  location / {
    return 404;
  }
}
