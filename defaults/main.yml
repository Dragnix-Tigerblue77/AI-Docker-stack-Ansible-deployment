---
# defaults file for deploy_Artificial_Intelligence_Docker_stack

# The stack name, which is its namespace to the orchestrator: Swarm labels its services with it and
# Compose names its project after it, so it is what answers "is this stack already deployed on this
# machine ?". Compose normalises project names to lowercase, which is inconsequential here but is
# why the deployment role applies a "| lower".
Artificial_Intelligence_Docker_stack_name: "Artificial_Intelligence"

# The template's name, without its ".j2" suffix. The deployment role renders it from ITS OWN
# CALLER's "templates/" -- that is, from this role's. It is what lets a repository ship a stack
# without shipping the machinery that deploys it.
Artificial_Intelligence_Docker_compose_file_name: "Artificial_Intelligence.docker-compose.yml"

# Where the rendered file lands on the managed node. "/tmp/" is the historical default on the
# homelab side, kept here so both repositories behave the same way.
#
# ! This file holds in clear text everything the template interpolates -- and as soon as the service
# issues land, that includes API keys. The deployment role has to write it "0600" and with
# "diff: false": "--diff" would print the WHOLE file into the run's output, and a leak that outlives
# the run is worse than the file itself. The contract is spelled out in the README.
Artificial_Intelligence_Docker_compose_file_destination_directory: "/tmp/"
Artificial_Intelligence_Docker_compose_file_destination_path: "{{ Artificial_Intelligence_Docker_compose_file_destination_directory }}{{ Artificial_Intelligence_Docker_compose_file_name }}"

# The time zone handed to every container through "TZ". The homelab repository carries its own in
# "group_vars/all.yaml" under the name "server_time_zone", but this role cannot presuppose that its
# caller has that variable: it is therefore restated here under a name of its own, with a neutral
# default. A caller that already has one passes it as a parameter, with nothing to rename.
Artificial_Intelligence_server_time_zone: "Etc/UTC"

# The network the stack's services reach each other over. It is declared by the stack, so it is
# created and destroyed with it, and is reachable from nowhere else: that is what lets an internal
# service publish no port at all.
#
# There is only one for now. #7 will settle the collector / actor split, and it is that decision
# which says whether two or three are needed -- not this skeleton, which can only decline to
# pre-empt it.
Artificial_Intelligence_internal_Docker_network_name: "Artificial_Intelligence_internal"

# The published network, the one the caller's reverse proxy reaches the few web-facing services
# over. It does NOT belong to this repository: the caller creates and names it, and the stack only
# attaches to it with "external: true".
#
# "false" rather than "''": ansible-core 2.19 refuses a bare truth test on a non-boolean, so the
# template writes "is string" to mean "set". It is the idiom of the homelab repository's Docker and
# DNS roles, taken as-is.
#
# The two go together: the NAME attaches a service, the DEFINITION declares the network in the
# "networks:" block. "tasks/main.yml" refuses one without the other.
Artificial_Intelligence_published_Docker_network_name: false
Artificial_Intelligence_published_Docker_network_definition: false

# The role that actually deploys the stack, named by the caller. MANDATORY, no default.
#
# This is what keeps #31's promise: "the role presupposes neither machine, nor domain, nor account,
# nor orchestrator". A default pointing at the homelab repository's Swarm role would be exactly the
# presupposition the issue forbids, and it would fail on a caller that does not have it -- on a role
# name appearing nowhere in the call they wrote.
#
# The contract that role has to meet is in the README, under "Le contrat du rôle de déploiement".
# Both "Docker/deploy_Docker_swarm_stack" and "Docker/deploy_Docker_compose_stack" of the homelab
# repository meet it.
# Artificial_Intelligence_Docker_stack_deployment_role_name:

# --------------------------------------------------------------------------------------------------
# The routing configuration (#1)
# --------------------------------------------------------------------------------------------------

# The gateway's routing configuration, mounted read-only into the container. #1 renders the file and
# its general settings; #2 fills its model list. It carries no secret of its own -- both are
# interpolated straight into the compose template below, not into a file of their own -- so it needs
# neither "0600" nor "no_log".
Artificial_Intelligence_LiteLLM_config_file_name: "LiteLLM_config.yaml"
Artificial_Intelligence_LiteLLM_config_file_destination_path: "{{ Artificial_Intelligence_Docker_compose_file_destination_directory }}{{ Artificial_Intelligence_LiteLLM_config_file_name }}"

# --------------------------------------------------------------------------------------------------
# PostgreSQL -- the gateway's store (#1)
# --------------------------------------------------------------------------------------------------

# MAJOR pinned explicitly, never ":latest". A major bump imposes a pg_dump / restore, so it must
# never happen because a tag moved: it is a decision with a maintenance window, not a side effect.
# Check the major is supported by the Prisma schema of the LiteLLM version below before raising it.
#
# The tag BEGINS with the major -- "17-alpine", "17.6-alpine3.22", "18" -- and "tasks/main.yml"
# refuses one that does not. The compose template reads the major off it to mount the data volume
# where that major's image keeps its data: "/var/lib/postgresql/data" up to 17, "/var/lib/postgresql"
# from 18, where the official image moved it. A volume left at the old path makes 18 refuse to
# start, on an empty volume too (#168).
#
# ! Raising the major on a volume that already holds a cluster is a MIGRATION, not a tag change: the
# new major refuses the old cluster and exits -- nothing is lost, and nothing starts. The way across,
# verified from 17 to 18 with LiteLLM and written out command by command in the README ("Monter
# PostgreSQL d'un majeur"):
#   1. with the OLD major still running and LiteLLM stopped, "pg_dump --format=custom" its database;
#   2. raise this tag AND give "Artificial_Intelligence_PostgreSQL_data_Docker_volume_name" a new
#      name: the new major initialises an empty volume, and the old one stays as the way back;
#   3. deploy, stop LiteLLM, "pg_restore --clean --if-exists" the dump, start LiteLLM again;
#   4. remove the old volume by hand once the new one has proved itself.
# "pg_upgrade" is the other way -- in place, faster on a large store -- but it needs both majors'
# binaries in one container, which the official image does not carry. For a store this size the
# dump is the simpler of the two.
Artificial_Intelligence_PostgreSQL_Docker_image_tag: "17-alpine"

Artificial_Intelligence_PostgreSQL_database: "litellm"
Artificial_Intelligence_PostgreSQL_user: "litellm"

# The named volume the store lives in. Named rather than a bind mount: surviving a container
# recreation is an acceptance criterion of #1, and a bind mount would also tie the stack to a host
# path this repository does not get to choose.
Artificial_Intelligence_PostgreSQL_data_Docker_volume_name: "Artificial_Intelligence_PostgreSQL_data"

# Starting value, to be recalled after measuring under load with "docker stats". What matters today
# is that a limit exists at all.
Artificial_Intelligence_PostgreSQL_memory_limit: "1g"

# --------------------------------------------------------------------------------------------------
# LiteLLM Proxy -- the single point every LLM call goes through (#1)
# --------------------------------------------------------------------------------------------------

# The image tag. Explicit SemVer, NEVER "main-latest": that tag is deprecated and no longer fed, so
# it freezes the deployment on an old image while looking current.
#
# ! Verified on 2026-09-06. Upstream retired the "-stable" suffix -- it matched neither PEP 440 nor
# SemVer 2.0 -- so a stable release is now a plain "vX.Y.Z", and there is no "-stable" variant to
# prefer any more.
#
# ! This tag is to be RE-CHECKED on the day of the deployment, against the upstream security
# advisories, and raised if need be. Four critical CVEs in four months on this product in 2026: a
# version number written in advance in an issue is not evidence. That check is a task of its own.
Artificial_Intelligence_LiteLLM_Docker_image_tag: "v1.100.0"

# The security floor, below which "tasks/main.yml" refuses to run. It is a MINIMUM, not a ceiling:
# 1.84.0 is what carries the fix for CVE-2026-59822 (MCP authentication bypass, CISA KEV), and it
# also clears CVE-2026-42208 (pre-authenticated SQL injection on the "Authorization" header, CISA
# KEV, exploited 36 h after disclosure, fixed in 1.83.10) and CVE-2026-35029 ("/config/update"
# reachable with no admin control).
#
# Raise this when a new advisory lands. Lowering it is how the floor stops being one.
Artificial_Intelligence_LiteLLM_minimum_secure_version: "1.84.0"

# Each worker replicates the configuration, so this multiplies the memory footprint rather than
# dividing the work for free. The target host has 88 threads and no GPU; the limit below is what
# bounds the temptation to raise this number. Measure before changing it.
Artificial_Intelligence_LiteLLM_number_of_workers: "4"

# Starting value, tied to the worker count above. To be recalled under load.
Artificial_Intelligence_LiteLLM_memory_limit: "2g"

# The two secrets, MANDATORY and without a default. No default on purpose: a default password is a
# password, and one shipped in a public repository is a published one. The caller renders them from
# its vault, and "tasks/main.yml" refuses to run without them.
#
# ! "Artificial_Intelligence_LiteLLM_master_key" is for ADMINISTRATION only. It is never handed to a consumer: Open
# WebUI, N8N, the Claude Code container and the Discord bot each get their own virtual key carrying
# their own model allow-list (#2). A client holding the master key makes the whole isolation work of
# #2 pointless.
# Artificial_Intelligence_PostgreSQL_password:
# Artificial_Intelligence_LiteLLM_master_key:

# "/ui" is published (see "ports:" on the "litellm" service) so each account can add its OWN provider
# keys by hand, from a browser on the LAN, rather than have them rendered from a vault: that decision
# is deliberate, matches how the other self-hosted databases of this estate are already run --
# deployed empty, populated live, backed up to their repository from time to time -- and it is not
# this role's to second-guess. What this role owes it in exchange is basic auth in front of that
# reachable port, which is the one thing "docker compose port litellm 4000" answering from the LAN
# does not already give it.
#
# "Artificial_Intelligence_LiteLLM_UI_username" has an ordinary default; "Artificial_Intelligence_LiteLLM_UI_password" has none, for the same
# reason the two secrets above do not.
Artificial_Intelligence_LiteLLM_UI_username: "admin"
# Artificial_Intelligence_LiteLLM_UI_password:

# A LIST, empty by default, never a fixed pair of named variables (#103): each entry
# ({"username": ..., "email": ...}) becomes its own restricted LiteLLM login -- "internal_user" role,
# which can create/view/delete only ITS OWN keys and see only ITS OWN spend, never another account's
# keys or the gateway's own configuration. Adding a person is adding an entry, never duplicating a
# task or a pair of variables named after someone.
#
# The account this role's own admin (whoever holds "Artificial_Intelligence_LiteLLM_UI_username"/"_password") uses is
# NOT one of these: that login already has full admin access via LiteLLM's own bootstrap mechanism,
# and giving it a second, restricted entry here would not add anything.
#
# Each entry's key is scoped to "access_group:<username>" (#2) at creation, the same access-group
# mechanism "LiteLLM_config.yaml.j2" already tags tigerblue77's own models with -- so an account
# added here only ever sees models tagged for its own name. That key is shown ONCE, in this role's
# own output, the run it is actually created: LiteLLM does not store it in a form the API can return
# a second time, the same way a GitHub token or a Docker registry password is shown once and never
# again. Save it somewhere durable then -- LibreChat's own "apiKey: \"user_provided\"" prompt is
# where it is meant to end up.
Artificial_Intelligence_LiteLLM_internal_users: []

# --------------------------------------------------------------------------------------------------
# Redis -- LiteLLM's shared cooldown state and response cache backend (#71)
# --------------------------------------------------------------------------------------------------

# Major pinned explicitly, never ":latest" -- same reasoning as PostgreSQL, applied to a smaller
# surface: a major bump can change eviction and persistence defaults.
Artificial_Intelligence_Redis_Docker_image_tag: "7-alpine"

Artificial_Intelligence_Redis_data_Docker_volume_name: "Artificial_Intelligence_Redis_data"

# Starting value. Response caching and per-worker cooldown state are both small compared to the
# corpora the other services here hold.
Artificial_Intelligence_Redis_memory_limit: "256m"

# MANDATORY, without a default: "--requirepass" would otherwise be empty, which is no password at
# all. Internal-only like Qdrant's API key (#3) -- defence in depth against a compromised workload on
# the same network, not a port published anywhere.
# Artificial_Intelligence_Redis_password:

# --------------------------------------------------------------------------------------------------
# LiteLLM routing -- tigerblue77's own provider keys (#2, v1 scope)
# --------------------------------------------------------------------------------------------------

# tigerblue77's own provider keys, MANDATORY and without a default like every other secret this role
# interpolates. Each is exposed to the "litellm" container under a "<PROVIDER>_API_KEY_TIGERBLUE77"
# name -- not a style choice: "check_LiteLLM_account_isolation.py" (#32) uses exactly that
# "_API_KEY_<ACCOUNT>" suffix to decide which account an entry of "LiteLLM_config.yaml.j2" belongs to,
# and an entry it cannot attribute is refused, not silently let through.
#
# Dragnix's own keys are deliberately absent here: he adds them himself from "/ui" (see
# "Artificial_Intelligence_LiteLLM_UI_password" above), so there is nothing for this role to vault on his behalf.
# Artificial_Intelligence_LiteLLM_Gemini_API_key_tigerblue77:
# Artificial_Intelligence_LiteLLM_Mistral_API_key_tigerblue77:
# Artificial_Intelligence_LiteLLM_Cerebras_API_key_tigerblue77:
# Artificial_Intelligence_LiteLLM_Groq_API_key_tigerblue77:
# Artificial_Intelligence_LiteLLM_OpenRouter_API_key_tigerblue77:
# The only PAID provider of this file (#101): DeepSeek's own API has no persistent free tier, unlike
# every other entry above. "deepseek-r1-github" (LiteLLM_config.yaml.j2, via GitHub Models) used to be
# a different route to a different catalogue, unaffected either way -- GitHub Models itself has since
# been retired (#109), so that route is gone too, not merely unaffected.
# Artificial_Intelligence_LiteLLM_DeepSeek_API_key_tigerblue77:

# GitHub Models retired 2026-07-30 (#109): every "github/*" entry of "LiteLLM_config.yaml.j2" that
# used to read this key is commented out, so nothing consumes it any more. Defaulted to empty rather
# than left without one like the keys above -- it is no longer a secret guarding a real quota, just an
# unused container environment variable, and "tasks/main.yml" no longer asserts it is provided.
Artificial_Intelligence_LiteLLM_GitHub_API_key_tigerblue77: ""

# --------------------------------------------------------------------------------------------------
# OmniRoute -- the gateway's keyless, free, last-resort fallback (#73)
# --------------------------------------------------------------------------------------------------

# Explicit SemVer, never ":latest" and never the "-web" variant (a desktop/PWA build this deployment
# has no use for: it is consumed as a plain OpenAI-compatible API by LiteLLM, #2).
#
# ! Verified on 2026-09-06 against the upstream Docker Hub tags.
Artificial_Intelligence_OmniRoute_Docker_image_tag: "3.8.50"

# The named volume OmniRoute's SQLite store lives in, at the path its own Docker guide documents
# ("/app/data") -- not a bind mount, for the same reason as every other stateful service here.
Artificial_Intelligence_OmniRoute_data_Docker_volume_name: "Artificial_Intelligence_OmniRoute_data"

# Starting value. The image's own default heap (1024 MB) is documented as sufficient for light,
# occasional traffic -- which is exactly what a last-resort fallback is -- but not for a primary
# coding-agent workload. Recall this if OmniRoute ever stops being a fallback.
Artificial_Intelligence_OmniRoute_memory_limit: "2g"

# MANDATORY, without a default: the image ships "CHANGEME" otherwise, documented upstream as
# deliberately weak to force a change. Treated exactly like "Artificial_Intelligence_LiteLLM_UI_password" (#1) -- the
# port is published for the same reason (the dashboard needs a browser on the LAN), so this is the
# one thing standing in front of it.
# Artificial_Intelligence_OmniRoute_dashboard_password:

# --------------------------------------------------------------------------------------------------
# Qdrant -- the Artificial Intelligence stack's vector engine (#3)
# --------------------------------------------------------------------------------------------------

# Explicit SemVer, never ":latest". The issue's own draft targeted "v1.13.4", eighteen months and six
# minor versions behind by the time #3 was written -- exactly the trap this convention exists for.
#
# ! Verified on 2026-09-06 against the upstream GitHub releases.
Artificial_Intelligence_Qdrant_Docker_image_tag: "v1.19.1"

# Named volume for "/qdrant/storage". Persistence across a container recreation is an acceptance
# criterion of #3, not a hope.
Artificial_Intelligence_Qdrant_data_Docker_volume_name: "Artificial_Intelligence_Qdrant_data"

# Starting value, to be recalled after measuring under load. The corpus #3 sizes this against
# (10,000-30,000 chunks, ~120 MB of vectors) is small; this is deliberately generous rather than tight.
Artificial_Intelligence_Qdrant_memory_limit: "1g"

# MANDATORY, without a default: #3 requires an API key even though no port is published, as
# defence-in-depth against a compromised workload on the internal network. No default on purpose --
# same reasoning as every other secret this role interpolates.
# Artificial_Intelligence_Qdrant_API_key:

# --------------------------------------------------------------------------------------------------
# Claude Code agent -- tigerblue77 (#13)
# --------------------------------------------------------------------------------------------------

# Off by default. #31 requires every service to be enabled or disabled by a variable, and an agent
# that reaches an individual's own Claude Code session is not something a fresh deployment should
# start running unasked. It is also the FIRST service of this template that ships disabled: turning
# it on is what switches "services:" from "{}" to a real mapping, in the template.
Artificial_Intelligence_Claude_code_tigerblue77_enabled: false

# The image this service is BUILT ON, never installed a second time: it already carries the pinned
# CLI, the non-root "node" user and the auto-updater switched off (see
# "https://github.com/Dragnix-Tigerblue77/Claude-Code-Docker-container"). Pinned by tag AND digest,
# per #13 -- never ":latest", and never the tag alone either.
Artificial_Intelligence_Claude_code_Docker_image_tag: "2.1.236"
Artificial_Intelligence_Claude_code_Docker_image_digest: "sha256:025264aeda3bf906a26d1f9282f69dcbbb169e7fb7e5a4406d42f90311d5e35a"

# Where the Dockerfile this role renders from "templates/claude_code_tigerblue77.Dockerfile.j2" lands
# on the managed node, next to the rendered compose file: "build:" needs an actual path on that
# machine, not something read out of this repository at deploy time.
Artificial_Intelligence_Claude_code_tigerblue77_build_context_directory: "{{ Artificial_Intelligence_Docker_compose_file_destination_directory }}claude_code_tigerblue77/"

# MANDATORY when the service above is enabled, and without a default -- same reasoning as every other
# secret this role interpolates. Created in the LiteLLM admin UI (#2, or by hand until #2 lands): the
# model allow-list a virtual key carries is what stands between this container and every other
# account's quota. NEVER the master key.
# Artificial_Intelligence_Claude_code_tigerblue77_virtual_key:

# MANDATORY when the service above is enabled, and without a default. A personal access token, read
# by both "gh" and git inside the container. #13 defers real repository access to the MCP GitHub
# connector (#23); until that lands, this is how the agent reaches a repository at all.
# Artificial_Intelligence_Claude_code_tigerblue77_GitHub_token:

# MANDATORY when the service above is enabled, and without a default: a host path is inventory data,
# which this role does not get to presuppose. The caller's own working tree for this agent.
# Artificial_Intelligence_Claude_code_tigerblue77_workspace_directory:

# The model name the agent asks for. It is an ALIAS "model_group_alias" resolves inside LiteLLM (#2),
# not a literal provider model -- #13's compliance note is that no Anthropic model backed by a
# subscription may ever sit behind it.
Artificial_Intelligence_Claude_code_tigerblue77_model: "claude-code"

# Starting value, to be recalled after measuring under load. Higher than a bare agent's would be: the
# image adds "gh", "ansible-core" and build tooling on top of the published Claude Code image.
Artificial_Intelligence_Claude_code_tigerblue77_memory_limit: "2g"

# The named volume the WHOLE home directory lives in -- not only "~/.claude". "~/.claude.json" sits
# BESIDE "~/.claude", never inside it: a volume on "~/.claude" alone persists half the session and
# silently loses the other half on every recreation. See the upstream image's own README on this
# trap, and #13's Definition of Done, which checks for it explicitly.
Artificial_Intelligence_Claude_code_tigerblue77_home_Docker_volume_name: "Artificial_Intelligence_Claude_code_tigerblue77_home"

# --------------------------------------------------------------------------------------------------
# LibreChat -- the Artificial Intelligence stack's human-facing chat interface (#76)
# --------------------------------------------------------------------------------------------------

# Explicit stable release, never the "-dev" image (rebuilt on every push to upstream "main", never
# meant for a stable deployment) and never ":latest".
#
# ! Verified on 2026-09-06 against the upstream GHCR tags.
Artificial_Intelligence_LibreChat_Docker_image_tag: "v0.8.7"

# Explicit major, verified against the upstream compose example.
Artificial_Intelligence_MongoDB_LibreChat_Docker_image_tag: "8.0.20"

Artificial_Intelligence_LibreChat_uploads_Docker_volume_name: "Artificial_Intelligence_LibreChat_uploads"
Artificial_Intelligence_MongoDB_LibreChat_data_Docker_volume_name: "Artificial_Intelligence_MongoDB_LibreChat_data"

Artificial_Intelligence_LibreChat_memory_limit: "1g"
Artificial_Intelligence_MongoDB_LibreChat_memory_limit: "512m"

# MANDATORY, without a default, all four. LibreChat generates temporary values for these on first
# start and stores them in its own volume if none are given -- documented upstream as unsuitable for
# production, precisely because nothing vaults them anywhere. Never left to that default here.
# Artificial_Intelligence_LibreChat_creds_key:
# Artificial_Intelligence_LibreChat_creds_IV:
# Artificial_Intelligence_LibreChat_JWT_secret:
# Artificial_Intelligence_LibreChat_JWT_refresh_secret:

# Closed, not the image's own default: the port below is published on the LAN, and open registration
# there would hand anyone on the network a seat on both accounts' quotas. The estate's own two
# accounts are created with "docker exec ... npm run create-user", which works with registration
# closed.
Artificial_Intelligence_LibreChat_allow_registration: false

# Where "files/librechat/librechat.yaml" lands on the managed node, mounted read-only into the
# container. Copied rather than rendered: nothing in it needs Ansible interpolation -- the file
# reads "apiKey: \"user_provided\"" for the gateway endpoint (#103), so LibreChat asks each of its
# OWN accounts for their own virtual key the first time they use it, rather than reading one shared
# key out of the container's environment.
Artificial_Intelligence_LibreChat_config_file_name: "librechat.yaml"
Artificial_Intelligence_LibreChat_config_file_destination_path: "{{ Artificial_Intelligence_Docker_compose_file_destination_directory }}{{ Artificial_Intelligence_LibreChat_config_file_name }}"

# Dragnix's own LibreChat account, created BY THE ROLE as the estate's first (and only automated)
# account, then granted the ADMIN role directly in MongoDB -- see "tasks/main.yml" for why not the
# "first user is auto-admin" behaviour some LibreChat deployments rely on, which is not reliable
# enough to build on (upstream reports of it silently not applying). Dragnix creates tigerblue77's
# account himself from the admin panel once logged in, which is not something Ansible has to automate.
#
# MANDATORY, all four, without a default: this role does not get to presuppose who runs the estate.
# Artificial_Intelligence_LibreChat_Dragnix_email:
# Artificial_Intelligence_LibreChat_Dragnix_name:
# Artificial_Intelligence_LibreChat_Dragnix_username:
# Artificial_Intelligence_LibreChat_Dragnix_password:
